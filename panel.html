  #dlg[open] { display: flex; flex-direction: column; }
  #dlg > form { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } }
  @keyframes destello { from { background-color: #fdf3d9; } to { background-color: transparent; } }
  .destello { animation: destello 2.4s ease-out; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .escribiendo::after { content: '▍'; animation: parpadeo 1s steps(1) infinite; color: #a3825c; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  #dlg [data-panel] .grid:not([class*="grid-cols"]) { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 639px) { #dlg [data-panel] .grid:not(.grid-cols-2):not(.grid-cols-3) { grid-template-columns: minmax(0, 1fr); } }
  #dlg select { max-width: 100%; }
  #toasts { position: fixed; inset: auto 0 16px 0; margin: 0 auto; border: 0; padding: 0 16px; background: transparent; overflow: visible; width: auto; height: auto; }
  details > summary::-webkit-details-marker { display: none; }
  mark { background: #fbe7b5; color: inherit; border-radius: 3px; padding: 0 1px; }
  .sin-barra { scrollbar-width: none; } .sin-barra::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) { dialog[open], .destello, .escribiendo::after { animation: none; } }

const PI = {

/* Avisos en la capa superior (se ven por encima de las ventanas modales) */
function toast(msg, tipo = 'ok') {
  const box = $('#toasts'), c = { ok: 'bg-stone-900 text-white', error: 'bg-rose-600 text-white', info: 'bg-white text-stone-800 ring-1 ring-stone-200' }[tipo];
  const d = document.createElement('div');
  d.className = `pointer-events-auto max-w-md rounded-xl px-4 py-2.5 text-sm shadow-lg ${c}`;
  d.textContent = msg; box.appendChild(d); box.style.display = 'flex';
  try { box.hidePopover(); box.showPopover(); } catch {}
  setTimeout(() => { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(() => { d.remove(); if (!box.children.length) { try { box.hidePopover(); } catch {} box.style.display = ''; } }, 300); }, tipo === 'error' ? 7000 : 3200);
}
function errorAmigable(e) {
  const m = (e && (e.message || e.details)) || String(e);
  if (/solo_admin/.test(m)) return 'Solo el administrador puede cambiar el nombre del evento, sus links y el crédito.';
  if (/column .* does not exist|schema cache/i.test(m)) return 'La base de datos no está actualizada: ejecuta supabase/01_esquema.sql.';
  if (e?.code === '23505' && /miembros/.test(m)) return 'Ese correo ya tiene acceso a este evento.';
  if (e?.code === '23505' && /proyectos_slug|slug/.test(m)) return 'Ya existe un evento con ese identificador.';
  if (e?.code === '23505' || /duplicate key|nombre_uk|nombre_norm/.test(m)) return 'Ya existe un invitado con ese nombre. Agrega un apellido o el parentesco entre paréntesis, p. ej. “Pérez (Padre)”.';
  if (/pases_confirmados_max/.test(m)) return 'Los pases confirmados no pueden superar los pases asignados.';
  if (/plantillas_chk/.test(m)) return `Máximo ${MAX_PLANTILLAS} plantillas guardadas.`;
  if (/slug/.test(m) && /check/.test(m)) return 'Identificador inválido: usa minúsculas, números y guiones (3 a 40 caracteres).';
  if (/check/.test(m)) return 'Hay un valor fuera de rango. Revisa los campos.';
  if (/JWT|session|permission|RLS|no_autorizado|row-level/i.test(m)) return 'Tu usuario no tiene permiso para esta acción.';
  return m;
}
function errorClave(e) {
  const c = e?.code || '', m = e?.message || '';
  if (/sending|smtp|email.*(provider|send)/i.test(m)) return 'No se pudo enviar el correo: el servicio de correo del sitio no está bien configurado. Avisa al administrador.';
  if (c === 'same_password' || /different from the old/i.test(m)) return 'La nueva contraseña debe ser distinta de la actual.';
  if (c === 'weak_password' || /weak|at least/i.test(m)) return `Contraseña muy débil: usa al menos ${CLAVE_MIN} caracteres combinando letras y números.`;
  if (c === 'reauthentication_needed' || /reauthentic/i.test(m)) return 'Por seguridad debes volver a iniciar sesión antes de cambiar la contraseña.';
  if (/expired|invalid/i.test(m)) return 'El enlace o código venció. Solicita uno nuevo.';
  if (/rate|too many|seconds/i.test(m)) return 'Demasiados intentos. Espera un minuto y vuelve a intentarlo.';
  return m || 'No se pudo completar la operación.';
}

function cerrarModal() { if (antesDeCerrar && !antesDeCerrar()) return; antesDeCerrar = null; dlg.close(); }
/* opc.fijo = false: se cierra al hacer clic fuera · opc.antesDeCerrar(): devuelve false para impedir el cierre */

}

async function guardarClave(id) {
  const a = $(`#${id}-1`).value, b = $(`#${id}-2`).value, m = $(`#${id}-msg`);

async function entrar(session, forzar = false) {
  if (S.recuperando) return pantallaNuevaClave();
  if (!forzar && S.user && S.user.id === session.user.id) return;
  S.user = session.user;
  await canjearAlta();
  const { data, error } = await sb.rpc('mi_perfil');
  if (error || !data) { pantallaLogin(t('No se pudo verificar tu acceso.')); return; }
  S.perfil = data;
  const todos = data.proyectos || [];
  S.proyectos = todos.filter(x => x.rol === 'admin' || x.rol === 'novios');
  const staff = todos.filter(x => x.rol === 'staff');
  localStorage.setItem('pyd.staff', JSON.stringify({ proyectos: staff.map(x => x.slug) }));
  if (!S.proyectos.length && !data.admin) {
    if (staff.length) { location.replace(P.STAFF_URL + '?p=' + encodeURIComponent(staff[0].slug)); return; }
    await sb.auth.signOut(); pantallaLogin(t('Este correo no tiene acceso al panel.')); return;
  }
  if (!S.proyectos.length) { pantallaSinProyectos(); return; }
  const pedido = new URLSearchParams(location.search).get('p') || localStorage.getItem('panel.proyecto');
  const elegido = S.proyectos.find(x => x.slug === pedido) || S.proyectos[0];
  await abrirProyecto(elegido.id);
}

async function abrirProyecto(id) {
  if (S.canal) { sb.removeChannel(S.canal); S.canal = null; }
  S.sel.clear(); S.q = ''; S.seg = 'todos';
  $('#app').innerHTML = `<div class="grid min-h-dvh place-items-center text-stone-500">Cargando invitados…</div>`;
  const [c, l] = await Promise.all([sb.from('proyectos').select('*').eq('id', id).single(), sb.from('invitados').select('*').eq('proyecto_id', id).order('id')]);
  if (c.error || l.error) { $('#app').innerHTML = `<p class="p-6 text-rose-700">${esc(t('No se pudieron cargar los datos:'))} ${esc(errorAmigable(c.error || l.error))}</p>`; return; }
  S.p = c.data; S.lista = l.data;
  localStorage.setItem('panel.proyecto', S.p.slug);
  const u = new URL(location.href); u.searchParams.set('p', S.p.slug); history.replaceState(null, '', u.toString());
  layout(); refrescar(); suscribir();
}
async function recargar() {
  const { data, error } = await sb.from('invitados').select('*').eq('proyecto_id', S.p.id).order('id');
  if (!error) { S.lista = data; refrescar(); }
}
function suscribir() {
  const id = S.p.id;
  S.canal = sb.channel('invitados-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invitados', filter: `proyecto_id=eq.${id}` }, pl => {
      if (pl.eventType === 'DELETE') { S.lista = S.lista.filter(i => i.id !== pl.old.id); S.sel.delete(pl.old.id); }
      else if (pl.new.proyecto_id === S.p.id) { upsertLocal(pl.new); S.recientes.set(pl.new.id, Date.now()); }
      programar();
    })
    .subscribe(st => { if (st === 'SUBSCRIBED') recargar(); });
}
function upsertLocal(r) { const k = S.lista.findIndex(i => i.id === r.id); if (k >= 0) S.lista[k] = r; else S.lista.push(r); }
let pendiente = 0;
function programar() { cancelAnimationFrame(pendiente); pendiente = requestAnimationFrame(refrescar); }

async function enviarWa(i, plantilla) {

/* IA: redacta el mensaje en vivo (Edge Function "generar-mensaje", streaming, modelos de respaldo) */
async function generarIA({ ta, instrucciones, tonos, base, idioma, alTexto, alFin }) {
  const { data: { session } } = await sb.auth.getSession();
  const ctl = new AbortController(); S.ia = ctl;
  const reloj = setTimeout(() => ctl.abort('tiempo'), 60000);
  let txt = '', modelo = '';
  try {
    const r = await fetch(P.SUPABASE_URL + '/functions/v1/generar-mensaje', {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', apikey: P.SUPABASE_ANON, Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ proyecto: S.p.id, instrucciones, tonos, base, idioma })
    });
    if (!r.ok || !r.body) {
      const j = await r.json().catch(() => ({}));
      throw new Error(r.status === 404 ? t('La función de IA no está desplegada.') : j.error === 'sin_configurar' ? t('Falta configurar la clave de IA.')
        : j.error === 'clave' ? t('La clave de IA no es válida o no tiene permisos.') : r.status === 403 ? t('Tu usuario no puede usar la IA en este evento.')
        : t('La IA no respondió.') + (j.detalle ? ' ' + j.detalle : ''));
    }
    modelo = r.headers.get('x-modelo') || '';
    ta.value = ''; ta.classList.add('escribiendo');
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n')) >= 0) {
        const linea = buf.slice(0, k).trim(); buf = buf.slice(k + 1);
        if (!linea.startsWith('data:')) continue;
        const dato = linea.slice(5).trim(); if (dato === '[DONE]') continue;
        try { const c = JSON.parse(dato).choices?.[0]?.delta?.content; if (c) { txt += c; ta.value = txt; ta.scrollTop = ta.scrollHeight; alTexto?.(); } } catch {}
      }
    }
    txt = txt.trim();
    if (!txt) throw new Error(t('La IA no devolvió texto. Intenta con otras indicaciones.'));
    if (!/\{link\}/.test(txt)) txt += '\n\n{link}';
    ta.value = txt; alTexto?.(); return modelo || 'IA';
  } catch (e) {
    if (e.name === 'AbortError' || e === 'tiempo') { if (ctl.signal.reason === 'tiempo') toast(t('La IA tardó demasiado. Intenta de nuevo.'), 'error'); }
    else toast(e.message, 'error');
    if (txt) { ta.value = txt; alTexto?.(); }
    return '';
  } finally { clearTimeout(reloj); ta.classList.remove('escribiendo'); S.ia = null; alFin?.(); }
}

      <p id="c-prev" data-notr class="mt-1 whitespace-pre-wrap [overflow-wrap:anywhere] rounded-xl bg-[#e7ffdb] p-3 text-sm text-stone-800"></p></div></div>`;

  const panelReporte = `<div class="grid gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2">${cajaChk('c-rep', c.reporte_activo, 'Enviar un resumen diario solo los días en que algún invitado respondió, cambió su respuesta o dejó un mensaje.')}</div>
    <div class="sm:col-span-2"><label class="${lbl}" for="c-dest">Destinatarios</label><input id="c-dest" class="${campo}" value="${esc(c.reporte_destinatarios || '')}" placeholder="novia@correo.com, novio@correo.com">
      <p id="c-dest-ok" class="mt-1 text-xs text-stone-500"></p></div>
    <div><label class="${lbl}" for="c-hora">Hora de envío</label><select id="c-hora" class="${campo}">${horas}</select><p class="mt-1 text-xs text-stone-500"><span>Zona horaria:</span> ${esc(c.zona_horaria || 'America/Lima')}</p></div>
    <div class="rounded-xl bg-stone-50 p-3 text-sm sm:col-span-2"><div id="c-rep-estado" class="text-stone-600">Consultando estado…</div>

        <button type="button" id="c-probar" class="${btnS}">${ico('mail')} Guardar y enviar prueba</button></div></div></div>`;

  const panelAccesos = `<div class="grid gap-4"><div id="a-lista" class="grid gap-2"><p class="text-sm text-stone-500">Cargando accesos…</p></div>

      <p class="mt-2 text-xs text-stone-500">Novios: gestionan invitados y la configuración de este evento. Staff: solo el modo recepción (búsqueda y registro de ingreso).</p>

    <div class="rounded-xl bg-stone-50 p-3"><p class="font-semibold">Enlaces de registro</p>
      <p class="mt-0.5 text-xs text-stone-500">Comparte el enlace y la persona crea su propia cuenta con su correo y contraseña. Recibe el acceso automáticamente.</p>
      <div class="mt-2 grid gap-2 sm:grid-cols-[auto_auto_auto_1fr]">
        <select id="e-rol" class="${campoA}" aria-label="Rol">${admin ? '<option value="novios">Novios (panel)</option>' : ''}<option value="staff">Staff (recepción)</option></select>
        <select id="e-usos" class="${campoA}" aria-label="Usos">${[1, 2, 3, 5, 10].map(n => `<option value="${n}" ${n === 2 ? 'selected' : ''}>${n === 1 ? '1 persona' : n + ' personas'}</option>`).join('')}</select>
        <select id="e-dias" class="${campoA}" aria-label="Vigencia">${[3, 7, 14, 30].map(n => `<option value="${n}" ${n === 14 ? 'selected' : ''}>${n} días</option>`).join('')}</select>
        <button type="button" id="e-crear" class="${btnS} justify-self-start">${ico('link')} Crear enlace</button></div>
      <div id="e-lista" class="mt-3 grid gap-2"></div></div></div>`;

  const paneles = { general: panelGeneral, formulario: panelFormulario, tarjeta: panelTarjeta, whatsapp: panelWhatsapp, reporte: panelReporte, accesos: panelAccesos };
  let sucio = false;
  const marcarSucio = (v = true) => { sucio = v; const e = $('#c-sucio'); if (e) { e.hidden = !v; } const g = $('#c-guardado'); if (g && v) g.hidden = true; };
  const confirmarSalida = () => !sucio || window.confirm(t('Hay cambios sin guardar. ¿Cerrar sin guardar?'));

  modal(`<form id="f-cfg" novalidate>${cabecera('Configuración', esc(c.nombre))}
    <div class="flex flex-none gap-1 overflow-x-auto border-b border-stone-200 px-3" role="tablist">${PESTANAS.map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === pestana}" class="shrink-0 border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-stone-500 hover:text-stone-800 aria-selected:border-oro-600 aria-selected:text-oro-700">${n}</button>`).join('')}</div>
    ${cuerpo(Object.entries(paneles).map(([k, h]) => `<section role="tabpanel" data-panel="${k}" ${k === pestana ? '' : 'hidden'}>${h}</section>`).join('') + `<p id="c-err" class="mt-3 min-h-5 text-sm text-rose-600" role="alert"></p>`)}
    ${pie(`<span id="c-sucio" class="mr-auto inline-flex items-center gap-1.5 text-sm font-medium text-amber-700" hidden><span class="size-2 rounded-full bg-amber-500"></span><span>Cambios sin guardar</span></span>
      <span id="c-guardado" class="mr-auto text-sm text-emerald-700" hidden>✓ <span>Cambios guardados</span></span>
      <button type="button" class="${btnS}" data-cerrar>Cerrar</button><button class="${btnP}" id="c-ok">${ico('save')} Guardar</button>`)}</form>`, d => {
    const q = s => d.querySelector(s);
    d.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      d.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
      d.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
      q('#c-ok').hidden = b.dataset.tab === 'accesos';
      if (b.dataset.tab === 'accesos') cargarAccesos(d);
    });
    q('#c-ok').hidden = pestana === 'accesos'; if (pestana === 'accesos') cargarAccesos(d);
    const zonaEditable = e => !e.target.closest('#a-email,#a-rol,#mp-lista,#ia-txt,#ia-lang,[data-panel="accesos"]');
    q('#f-cfg').addEventListener('input', e => { if (zonaEditable(e)) marcarSucio(); });
    q('#f-cfg').addEventListener('change', e => { if (zonaEditable(e)) marcarSucio(); });

    /* --- teléfonos --- */
    q('#c-tel-fix').onclick = () => revisarTelefonos(q('#c-pais').value);

    /* --- fondos --- */
    d.querySelectorAll('[data-fondo-tipo]').forEach(s => s.addEventListener('change', () => {
      const fila = s.closest('[data-fondo]'); 
      fila.querySelector('[data-fondo-color]').style.visibility = s.value === 'color' ? 'visible' : 'hidden';
    }));
    d.querySelectorAll('[data-fondo]').forEach(f => { f.querySelector('[data-fondo-color]').style.visibility = f.querySelector('[data-fondo-tipo]').value === 'color' ? 'visible' : 'hidden'; });

    /* --- logo, casillas y QR (vista previa en vivo) --- */
    q('#f-logo-ancho').addEventListener('input', e => { q('#f-logo-v').textContent = e.target.value + ' px'; });
    const giroOpc = () => { const g = q('#f-giro').checked; q('#f-voltear').disabled = !g; q('#f-voltear').closest('label').classList.toggle('opacity-50', !g); };
    q('#f-giro').addEventListener('change', giroOpc); giroOpc();
    d.querySelectorAll('[data-escala]').forEach(r => r.addEventListener('input', () => { q('#' + r.id + '-v').textContent = r.value + '%'; }));
    d.querySelectorAll('[data-escala-reset]').forEach(b => b.onclick = () => { const r = q('#' + b.dataset.escalaReset); r.value = 100; r.dispatchEvent(new Event('input', { bubbles: true })); });
    q('#t-campo-alfa').addEventListener('input', e => { q('#t-campo-v').textContent = e.target.value + '%'; });
    const leerQR = () => ({ estilo: q('#q-estilo').value, color: q('#q-color').value, logo_forma: q('#q-forma').value, logo_fondo: q('#q-lfondo').value, logo_texto: q('#q-ltexto').value, escala: esc100(q('#q-escala').value) });
    const previewQR = () => { if (!window.QR) return; const Q = leerQR(), L = q('#t-logo').value.trim();
      QR.dibujar(q('#q-prev'), c.url_rsvp + '?to=AB12', { ecc: 'M', estilo: Q.estilo, color: Q.color,
        logo: { activo: !!L, tipo: 'texto', texto: L, colorTexto: Q.logo_texto, fondo: Q.logo_fondo, forma: Q.logo_forma, fuente: 'italic 600 {px}px Georgia, serif', halo: .1, tamano: 'max', ladoMax: .3, ecc: 'H', reservaECC: .5 } }); };
    ['#q-estilo', '#q-color', '#q-forma', '#q-lfondo', '#q-ltexto', '#t-logo'].forEach(id => q(id).addEventListener('input', previewQR));
    previewQR();

    /* --- preguntas --- */
    const pintarPreg = () => {
      q('#f-lista').innerHTML = preg.length ? preg.map((p, k) => `<div class="rounded-xl p-3 ring-1 ring-stone-200" data-k="${k}">
        <div class="grid gap-2 sm:grid-cols-[1fr_11rem_auto]">
          <input data-campo="etiqueta" class="${campo}" value="${esc(p.etiqueta)}" placeholder="Texto de la pregunta" aria-label="Pregunta">
          <select data-campo="tipo" class="${campo}" aria-label="Tipo">${TIPOS.map(([v, n]) => `<option value="${v}" ${p.tipo === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <div class="flex gap-0.5"><button type="button" data-mover="-1" class="${icoBtn}" aria-label="Subir" ${k ? '' : 'disabled'}>${ico('arrowup')}</button><button type="button" data-mover="1" class="${icoBtn}" aria-label="Bajar" ${k < preg.length - 1 ? '' : 'disabled'}>${ico('arrowdown')}</button>
            <button type="button" data-quitar class="${icoBtn} hover:text-rose-600" aria-label="Eliminar pregunta">${ico('trash')}</button></div></div>
        ${p.tipo === 'opcion' || p.tipo === 'multiple' ? `<input data-campo="opciones" class="${campo} mt-2" value="${esc(p.opciones.join(', '))}" placeholder="Opciones separadas por comas" aria-label="Opciones">` : ''}
        <div class="mt-2 flex flex-wrap gap-4 text-sm"><label class="flex items-center gap-2"><input type="checkbox" data-campo="obligatoria" ${p.obligatoria ? 'checked' : ''} class="size-4 accent-oro-600"><span>Obligatoria</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" data-campo="solo_si_asiste" ${p.solo_si_asiste ? 'checked' : ''} class="size-4 accent-oro-600"><span>Solo si asiste</span></label></div></div>`).join('')
        : `<p class="rounded-xl border-2 border-dashed border-stone-200 p-4 text-center text-sm text-stone-500">Sin preguntas adicionales. Agrega una o elige una sugerida.</p>`;
    };
    const nuevaPreg = base => ({ id: '', etiqueta: '', tipo: 'texto', opciones: [], obligatoria: false, solo_si_asiste: true, ...base, etiqueta: base ? t(base.etiqueta) : '', opciones: [...(base?.opciones || [])].map(t) });
    pintarPreg();
    q('#f-add').onclick = () => { preg.push(nuevaPreg()); pintarPreg(); marcarSucio(); q('#f-lista').lastElementChild.querySelector('input').focus(); };
    q('#f-preset').onchange = e => { if (e.target.value !== '') { preg.push(nuevaPreg(PRESETS_PREG[+e.target.value])); e.target.value = ''; pintarPreg(); marcarSucio(); } };
    q('#f-lista').addEventListener('input', e => { const it = e.target.closest('[data-k]'), cp = e.target.dataset.campo; if (!it || !cp) return;
      const p = preg[+it.dataset.k];
      if (cp === 'opciones') p.opciones = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      else if (e.target.type === 'checkbox') p[cp] = e.target.checked; else p[cp] = e.target.value; });
    q('#f-lista').addEventListener('change', e => { if (e.target.dataset.campo === 'tipo') { preg[+e.target.closest('[data-k]').dataset.k].tipo = e.target.value; pintarPreg(); } });
    q('#f-lista').addEventListener('click', e => { const it = e.target.closest('[data-k]'); if (!it) return; const k = +it.dataset.k;
      const m = e.target.closest('[data-mover]'); if (m) { const j = k + +m.dataset.mover; [preg[k], preg[j]] = [preg[j], preg[k]]; pintarPreg(); marcarSucio(); }
      if (e.target.closest('[data-quitar]')) { preg.splice(k, 1); pintarPreg(); marcarSucio(); } });

    /* --- WhatsApp: plantillas, mis plantillas e IA --- */
    const ta = q('#c-wa'), prev = () => { q('#c-prev').textContent = mensajeWa(ejemplo, ta.value); };
    ta.addEventListener('input', prev); prev();
    const ponerTexto = tx => { ta.value = tx; prev(); marcarSucio(); };
    d.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { const p = ta.selectionStart ?? ta.value.length; ta.setRangeText(b.dataset.chip, p, ta.selectionEnd ?? p, 'end'); ta.focus(); prev(); marcarSucio(); });
    d.querySelectorAll('[data-plantilla]').forEach(b => b.onclick = () => ponerTexto(PLANTILLAS_WA.find(x => x.id === b.dataset.plantilla).texto));
    /* 5 espacios fijos (null = vacío) */
    while (plantillas.length < MAX_PLANTILLAS) plantillas.push(null);
    plantillas = plantillas.slice(0, MAX_PLANTILLAS).map(x => x && x.texto ? x : null);
    const pintarMisPlantillas = () => {
      q('#mp-n').textContent = `(${plantillas.filter(Boolean).length}/${MAX_PLANTILLAS})`;
      q('#mp-lista').innerHTML = plantillas.map((p, k) => `<div class="flex min-w-0 items-center gap-2 rounded-xl bg-white p-2 ring-1 ${p ? 'ring-stone-300' : 'ring-dashed ring-stone-200'}">
          <span class="grid size-7 shrink-0 place-items-center rounded-lg ${p ? 'bg-oro-100 text-oro-700' : 'bg-stone-100 text-stone-400'} text-xs font-semibold">${k + 1}</span>
          <input data-mp-nombre="${k}" data-notr maxlength="40" class="min-w-0 flex-1 rounded-lg border-0 bg-transparent px-1 py-1 text-sm focus:ring-2 focus:ring-oro-500 focus:outline-none" value="${esc(p ? p.nombre : '')}" placeholder="${esc(t('Espacio') + ' ' + (k + 1) + ' · ' + t('vacío'))}" aria-label="${esc(t('Nombre del espacio') + ' ' + (k + 1))}">
          <button type="button" data-mp-usar="${k}" class="${icoBtn} size-8 disabled:opacity-25" title="${esc(t('Usar este mensaje'))}" aria-label="${esc(t('Usar este mensaje'))}" ${p ? '' : 'disabled'}>${ico('down')}</button>
          <button type="button" data-mp-guardar="${k}" class="${icoBtn} size-8" title="${esc(t('Guardar el mensaje actual aquí'))}" aria-label="${esc(t('Guardar el mensaje actual aquí'))}">${ico('save')}</button>
          <button type="button" data-mp-borrar="${k}" class="${icoBtn} size-8 hover:text-rose-600 disabled:opacity-25" title="${esc(t('Vaciar'))}" aria-label="${esc(t('Vaciar'))}" ${p ? '' : 'disabled'}>${ico('x')}</button></div>`).join('');
    };
    const guardarPlantillas = async nuevas => {
      const { data, error } = await sb.from('proyectos').update({ plantillas_wa: nuevas }).eq('id', c.id).select('plantillas_wa').single();
      if (error) { toast(/plantillas_wa/.test(error.message || '') && /column|schema/.test(error.message || '') ? t('La base de datos no está actualizada: ejecuta supabase/01_esquema.sql.') : t(errorAmigable(error)), 'error'); return false; }
      plantillas = (data.plantillas_wa || []).slice(); while (plantillas.length < MAX_PLANTILLAS) plantillas.push(null);
      S.p.plantillas_wa = data.plantillas_wa; pintarMisPlantillas(); return true;
    };
    pintarMisPlantillas();
    q('#mp-lista').addEventListener('click', async e => {
      const b = e.target.closest('[data-mp-usar],[data-mp-guardar],[data-mp-borrar]'); if (!b) return;
      if (b.dataset.mpUsar != null) { ponerTexto(plantillas[+b.dataset.mpUsar].texto); toast(t('Mensaje cargado. Pulsa Guardar para usarlo en los envíos.'), 'info'); return; }
      const k = +(b.dataset.mpGuardar ?? b.dataset.mpBorrar), nuevas = plantillas.slice();
      if (b.dataset.mpBorrar != null) {
        if (!window.confirm(t('¿Vaciar este espacio?'))) return;
        nuevas[k] = null; if (await guardarPlantillas(nuevas)) toast(t('Espacio vaciado'));
        return;
      }
      const texto = ta.value.trim();
      if (!texto) { toast(t('El mensaje está vacío.'), 'info'); return; }
      if (plantillas[k] && !window.confirm(t('¿Reemplazar el mensaje guardado en este espacio?'))) return;
      const nombre = q(`[data-mp-nombre="${k}"]`).value.trim() || t('Mensaje') + ' ' + (k + 1);
      nuevas[k] = { nombre, texto };
      if (await guardarPlantillas(nuevas)) toast(t('Guardado en el espacio') + ' ' + (k + 1));
    });
    q('#mp-lista').addEventListener('change', async e => {
      const inp = e.target.closest('[data-mp-nombre]'); if (!inp) return;
      const k = +inp.dataset.mpNombre; if (!plantillas[k]) return;
      const nuevas = plantillas.slice(); nuevas[k] = { ...plantillas[k], nombre: inp.value.trim() || t('Mensaje') + ' ' + (k + 1) };
      if (await guardarPlantillas(nuevas)) toast(t('Nombre actualizado'));
    });
    d.querySelectorAll('[data-tono]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
    const ia = async base => {
      const tonos = [...d.querySelectorAll('[data-tono][aria-pressed="true"]')].map(b => b.dataset.tono);
      q('#ia-ir').disabled = q('#ia-mejorar').disabled = true; q('#ia-stop').hidden = false; q('#ia-estado').textContent = t('Escribiendo…');
      const anterior = ta.value;
      const modelo = await generarIA({ ta, instrucciones: q('#ia-txt').value.trim(), tonos, base, idioma: q('#ia-lang').value, alTexto: () => { prev(); marcarSucio(); },
        alFin: () => { q('#ia-ir').disabled = q('#ia-mejorar').disabled = false; q('#ia-stop').hidden = true; } });
      q('#ia-estado').innerHTML = modelo ? `${esc(t('Listo'))} · <span class="font-mono" data-notr>${esc(modelo)}</span> · <button type="button" id="ia-undo" class="${enlace} text-xs">${esc(t('Deshacer'))}</button>` : '';
      q('#ia-undo')?.addEventListener('click', () => { ponerTexto(anterior); q('#ia-estado').textContent = ''; });
    };
    q('#ia-ir').onclick = () => ia('');
    q('#ia-mejorar').onclick = () => ia(ta.value);
    q('#ia-stop').onclick = () => S.ia?.abort();

    /* --- reporte --- */
    const dest = q('#c-dest'), destOk = () => { const v = correosValidos(dest.value); q('#c-dest-ok').textContent = v.length ? `${v.length} ✓ ${v.join(', ')}` : t('Separa varios correos con comas.'); };
    dest.addEventListener('input', destOk); destOk();
    estadoReporte(q('#c-rep-estado'));
    q('#c-prev-rep').onclick = vistaPreviaReporte;

    /* --- guardar (la ventana sigue abierta) --- */
    const leer = () => {
      const lim = q('#c-lim').value, v = s => q(s).value.trim();
      const usados = new Set();
      const preguntasOut = preg.filter(p => p.etiqueta.trim()).map(p => {
        let id = p.id || slugify(p.etiqueta).replace(/-/g, '_').slice(0, 30) || 'pregunta';
        if (!p.id) { const b = id; let n = 2; while (usados.has(id) || (c.formulario?.preguntas || []).some(x => x.id === id)) id = `${b}_${n++}`; p.id = id; }
        usados.add(id);
        return { id, etiqueta: p.etiqueta.trim(), tipo: p.tipo, opciones: ['opcion', 'multiple'].includes(p.tipo) ? p.opciones : [], obligatoria: !!p.obligatoria, solo_si_asiste: !!p.solo_si_asiste };
      });
      const texto = (id, k) => { const x = v(id); return x === DEF_TEXTOS[k] ? '' : x; };
      const fondo = k => { const f = d.querySelector(`[data-fondo="${k}"]`), tipo = f.querySelector('[data-fondo-tipo]').value, col = f.querySelector('[data-fondo-color]').value; return k === 'tarjeta' ? { tipo } : { tipo, color: col }; };
      const cambios = {
        fecha_limite: lim ? new Date(lim).toISOString() : null, idioma: q('#c-idioma').value,
        pases_max: Math.max(1, Math.min(50, parseInt(q('#c-max').value, 10) || 10)), permitir_nuevos: q('#c-nuevos').checked, pais_tel: q('#c-pais').value,
        formulario: { mostrar_saludo: q('#f-saludo').checked, mostrar_nombre_codigo: q('#f-nombre').checked,
                      logo: { mostrar: q('#f-logo').checked, ancho: parseInt(q('#f-logo-ancho').value, 10) || 140 }, escala_fuente: esc100(q('#f-escala').value), preguntar_pases: q('#f-pases').checked, pedir_acompanantes: q('#f-acomp').checked,
                      permitir_mensaje: q('#f-msg').checked, sugerir_nombres: q('#f-sugerir').checked,
                      mostrar_fechas: q('#f-fechas').checked, permitir_giro: q('#f-giro').checked, mostrar_voltear: q('#f-voltear').checked, preguntas: preguntasOut },
        tarjeta: { titulo: v('#t-titulo'), logo_qr: v('#t-logo'), fecha: v('#t-fecha'), lugar: v('#t-lugar'),
          colores: { papel: d.querySelector('[data-fondo="tarjeta"] [data-fondo-color]').value, tinta: q('#t-c-tinta').value, acento: q('#t-c-acento').value, suave: q('#t-c-suave').value, campo: q('#t-c-campo').value },
          campo_alfa: parseInt(q('#t-campo-alfa').value, 10), escala_texto: esc100(q('#t-escala').value), qr: leerQR(),
          fondos: { pagina: fondo('pagina'), formulario: fondo('formulario'), tarjeta: fondo('tarjeta') },
          textos: { etiqueta_pendiente: texto('#t-e-pend', 'etiqueta_pendiente'), etiqueta_si: texto('#t-e-si', 'etiqueta_si'), etiqueta_no: texto('#t-e-no', 'etiqueta_no'),
                    mensaje_pendiente: texto('#t-m-pend', 'mensaje_pendiente'), mensaje_si: texto('#t-m-si', 'mensaje_si'), mensaje_no: texto('#t-m-no', 'mensaje_no') },
          evento: { titulo: v('#t-ev-tit'), inicio: deLocal(q('#t-ini').value), fin: deLocal(q('#t-fin').value), lugar: v('#t-ev-lug'), detalle: v('#t-ev-det') } },
        mensaje_whatsapp: ta.value,
        reporte_activo: q('#c-rep').checked, reporte_destinatarios: correosValidos(dest.value).join(', '), reporte_hora: parseInt(q('#c-hora').value, 10)
      };
      if (admin) Object.assign(cambios, { nombre: v('#c-nombre') || c.nombre, url_invitacion: v('#c-uinv'), url_rsvp: v('#c-ursvp'), activo: q('#c-activo').checked, credito: q('#c-credito').value });
      return cambios;
    };
    const guardar = async () => {
      const cambios = leer(), err = q('#c-err'); err.textContent = '';
      const irA = (tab, msg) => { d.querySelector(`[data-tab="${tab}"]`).click(); err.textContent = t(msg); return false; };
      if (cambios.reporte_activo && !cambios.reporte_destinatarios) return irA('reporte', ERRORES_REPORTE.sin_destinatarios);
      const malas = cambios.formulario.preguntas.filter(p => ['opcion', 'multiple'].includes(p.tipo) && p.opciones.length < 2);
      if (malas.length) return irA('formulario', 'Las preguntas de opciones necesitan al menos 2 opciones.');
      if (!/\{link\}|\{link_rsvp\}/.test(cambios.mensaje_whatsapp)) return irA('whatsapp', 'El mensaje de WhatsApp debe incluir {link} o {link_rsvp}.');
      q('#c-ok').disabled = true;
      const { data, error } = await sb.from('proyectos').update(cambios).eq('id', c.id).select().single();
      q('#c-ok').disabled = false;
      if (error) { err.textContent = t(errorAmigable(error)); return false; }
      S.p = data; Object.assign(c, data);
      const it = S.proyectos.find(x => x.id === data.id); if (it) { it.nombre = data.nombre; it.activo = data.activo; }
      $('#titulo').innerHTML = selectorProyecto(); enlazarSelector();
      refrescar(); marcarSucio(false); q('#c-guardado').hidden = false;
      return true;
    };
    q('#f-cfg').addEventListener('submit', async e => { e.preventDefault(); if (await guardar()) toast(t('Configuración guardada')); });
    q('#c-probar').onclick = async ev => {
      const b = ev.currentTarget, err = q('#c-err');
      if (!correosValidos(dest.value).length) { err.textContent = t(ERRORES_REPORTE.sin_destinatarios); return; }
      b.disabled = true;
      try {
        if (!(await guardar())) return;
        const { data, error } = await sb.rpc('admin_reporte_probar', { p_proyecto: c.id });
        if (error) { err.textContent = t(errorAmigable(error)); return; }
        if (!data.ok) { err.textContent = t(ERRORES_REPORTE[data.error] || data.error); return; }
        toast(t('Reporte de prueba enviado'), 'info');
        setTimeout(() => estadoReporte(q('#c-rep-estado')), 3000);
      } finally { b.disabled = false; }
    };
  }, { fijo: true, antesDeCerrar: confirmarSalida });
}

async function estadoReporte(el) {
  if (!el) return;
  const { data, error } = await sb.rpc('admin_reporte_estado', { p_proyecto: S.p.id });
  if (!el.isConnected) return;
  if (error || !data) { el.innerHTML = `<span class="text-amber-700">${esc(t('No se pudo consultar el estado del reporte.'))}</span>`; return; }
  const avisos = [];
  if (!data.tiene_api_key) avisos.push('El servicio de correo aún no está configurado.');
  if (!data.programado) avisos.push('El envío automático no está activo en el servidor.');
  const r = data.respuesta, res = data.resultado;
  let ultimo = `<span>${esc(t('Aún no se ha enviado ningún reporte.'))}</span>`;
  if (res?.fecha) {
    const ok = r && r.status >= 200 && r.status < 300, falla = r && (r.status >= 300 || r.error || r.timeout);
    ultimo = `<span>${esc(t(res.prueba ? 'Último envío (prueba)' : 'Último envío'))}</span>: ${fmt(res.fecha)} · `
      + (ok ? `<span class="font-medium text-emerald-700">${esc(t('correo entregado'))}</span>`
         : falla ? `<span class="font-medium text-rose-700">${esc(t('no se pudo entregar'))}</span>`
         : `<span class="text-stone-500">${esc(t('en proceso'))}</span>`);
  }
  el.innerHTML = ultimo + (avisos.length ? `<ul class="mt-2 list-disc pl-5 text-amber-700">${avisos.map(a => `<li>${esc(t(a))}</li>`).join('')}</ul>` : '');
}

    n.addEventListener('input', () => { if (!tocado) { s.value = slugify(n.value).replace(/-/g, ''); urls(); } });
    s.addEventListener('input', () => { tocado = true; s.value = s.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); urls(); });
    n.focus();

      e.preventDefault(); const err = d.querySelector('#np-err'); err.textContent = '';

function sello() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
const fecha = iso => iso ? new Date(iso) : null;
function exportar(lista, sufijo) {
  if (!window.XLSX) return toast(t('La librería de Excel aún está cargando, intenta en un segundo'), 'info');
  if (!lista.length) return toast(t('No hay invitados para exportar'), 'info');
  const pq = preguntas();
  const filas = lista.map(i => {
    const o = { 'Nombre del invitado': i.nombre, 'Tratamiento': i.tratamiento, 'Código': i.codigo, 'Link': link(i), 'Link RSVP': linkRsvp(i), 'Categoría': i.categoria,
      'Asistencia a la boda': i.asistencia === 'si' ? 'Sí, asistiré' : i.asistencia === 'no' ? 'No podré asistir' : '',
      'Pases asignados': i.pases_asignados, 'Pases confirmados': i.pases_confirmados ?? '', 'Acompañantes': i.acompanantes };
    pq.forEach(q => { const v = (i.respuestas || {})[q.id]; o[q.etiqueta] = v == null ? '' : Array.isArray(v) ? v.join(', ') : q.tipo === 'sino' ? (v === 'si' ? 'Sí' : 'No') : v; });
    Object.assign(o, { 'Mensaje a los novios': i.mensaje,
      'Fecha registro': fecha(i.fecha_registro), 'Fecha primera vista': fecha(i.primera_vista), 'Fecha última vista': fecha(i.ultima_vista), 'N.º de vistas': i.vistas,
      'Fecha primera respuesta': fecha(i.primera_respuesta), 'Fecha última modificación': fecha(i.ultima_modificacion), 'N.º de ediciones': i.ediciones,
      'Respuesta de los novios': i.respuesta_novios, 'Número de mesa': i.mesa, 'WhatsApp': i.telefono, 'WhatsApp enviado': fecha(i.whatsapp_enviado),
      'Ingresaron (pases)': i.ingreso_pases || '', 'Hora de ingreso': fecha(i.ingreso_fecha) });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(filas, { dateNF: 'dd/mm/yyyy hh:mm' });
  ws['!cols'] = Object.keys(filas[0]).map(k => ({ wch: /Link/.test(k) ? 46 : /Mensaje|Respuesta de|Acompa/.test(k) ? 36 : /Nombre/.test(k) ? 28 : 14 }));
  ws['!autofilter'] = { ref: ws['!ref'] };
  filas.forEach((f, r) => { [3, 4].forEach(cI => { const a = XLSX.utils.encode_cell({ r: r + 1, c: cI }); if (ws[a]) ws[a].l = { Target: ws[a].v }; }); });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
  XLSX.writeFile(wb, `invitados_${S.p.slug}_${sufijo}_${sello()}.xlsx`);
  toast(`${lista.length} ${t('invitados exportados')}`);
}
const COLUMNAS = [
  ['nombre', 'Nombre del invitado', true, 'Nombre único. Si se repite, agrega apellido o parentesco: “Sr. Pérez (Padre)”.', ['nombre del invitado', 'nombre', 'invitado', 'nombre completo', 'nombres', 'guest name', 'name']],
  ['tratamiento', 'Tratamiento', false, 'Señor, Señora, Señorita, Familia… o vacío.', ['tratamiento', 'trato', 'title']],
  ['pases_asignados', 'Pases asignados', false, 'Número entero (1 si se deja vacío en registros nuevos).', ['pases asignados', 'pases', 'cupos', 'pases reservados', 'seats']],
  ['mesa', 'Número de mesa', false, 'Texto o número. Se muestra en la invitación.', ['numero de mesa', 'n de mesa', 'no de mesa', 'nro de mesa', 'mesa', 'table']],
  ['telefono', 'WhatsApp', false, 'Con o sin código de país: sin código se usa el país elegido al importar (945 709 988 → +51 945 709 988).', ['whatsapp', 'telefono', 'celular', 'movil', 'numero de whatsapp', 'numero de celular', 'phone']],
  ['categoria', 'Categoría', false, 'Etiquetas internas para filtrar y sumar (Familia novia, Amigos novio…). Varias separadas por comas. El invitado no la ve.', ['categoria', 'categorias', 'etiqueta', 'etiquetas', 'grupo', 'relacion', 'lado', 'category', 'group', 'tag', 'tags']],
  ['respuesta_novios', 'Respuesta de los novios', false, 'Se muestra al invitado en la invitación.', ['respuesta de los novios', 'respuesta novios']],
  ['codigo', 'Código', false, 'Clave para actualizar un invitado existente (aunque cambies su nombre). En nuevos: déjalo vacío y se genera.', ['codigo', 'cod', 'code']],
  ['asistencia', 'Asistencia a la boda', false, '“Sí” / “No” / vacío. Útil si alguien confirmó por teléfono.', ['asistencia a la boda', 'asistencia', 'asiste', 'rsvp']],
  ['pases_confirmados', 'Pases confirmados', false, 'No puede superar los pases asignados.', ['pases confirmados', 'confirmados']],
  ['acompanantes', 'Acompañantes', false, 'Nombres separados por comas.', ['acompanantes', 'acompañantes', 'guests']]

const normCab = tx => norm(tx).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function plantilla() {
  if (!window.XLSX) return toast(t('La librería de Excel aún está cargando, intenta en un segundo'), 'info');
  const cab = ['Nombre del invitado', 'Tratamiento', 'Pases asignados', 'Número de mesa', 'WhatsApp', 'Categoría', 'Respuesta de los novios', 'Código'];
  const ws = XLSX.utils.aoa_to_sheet([cab, ['Juan Pérez (Padre)', 'Señor', 2, '5', '987 654 321', 'Familia novio', '', ''], ['Familia Rojas', 'Familia', 4, '', '+1 305 310 1725', 'Amigos novia, Extranjero', '', '']]);
  ws['!cols'] = [30, 14, 15, 15, 18, 24, 36, 10].map(w => ({ wch: w }));
  const inst = XLSX.utils.aoa_to_sheet([['Columna', 'Obligatoria', 'Descripción'], ...COLUMNAS.map(c => [c[1], c[2] ? 'Sí' : 'No', c[3]]), [],
    ['Reglas'], ['• Un invitado por fila. Se reconoce por Código (si lo pones) o por Nombre.'], ['• Invitado existente: se reemplazan solo las columnas que incluyas. Nuevo: se agrega.'],
    ['• Puedes subir solo Nombre + Número de mesa (o + WhatsApp, o + Categoría) para actualizar esos datos.'], ['• WhatsApp: con código de país (+1 305…) o sin él; sin código se usa el país elegido al importar.'],
    ['• Columnas como Link, fechas o Mensaje a los novios se ignoran (el sistema las administra).'], ['• Sirve también para re-importar un Excel exportado desde este panel.']]);
  inst['!cols'] = [{ wch: 26 }, { wch: 12 }, { wch: 90 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados'); XLSX.utils.book_append_sheet(wb, inst, 'Instrucciones');
  XLSX.writeFile(wb, 'plantilla_invitados.xlsx');
}
function importar() {
  modal(`${cabecera('Importar invitados desde Excel', 'Agrega nuevos y actualiza existentes sin duplicar')}${cuerpo(`
    <div class="grid gap-4">
      <div class="rounded-xl bg-oro-50 p-3 text-sm text-stone-700"><p class="font-medium">Cómo funciona</p>
        <ul class="mt-1 list-disc space-y-0.5 pl-5">
          <li>La primera fila debe tener los títulos de columna. Solo “Nombre del invitado” es obligatorio.</li>
          <li>Cada fila se busca por Código (si la columna existe) o por Nombre: si existe se actualiza, si no se agrega.</li>
          <li>Solo se cambian las columnas que incluyas: para asignar mesas basta con Nombre + Número de mesa.</li>
          <li>Los WhatsApp sin código de país reciben el del país elegido abajo. Los dudosos se marcan en la vista previa.</li>
          <li>Verás una vista previa antes de guardar nada.</li></ul></div>
      <details class="rounded-xl ring-1 ring-stone-200"><summary class="cursor-pointer px-3 py-2 text-sm font-medium">Columnas reconocidas</summary>
        <div class="overflow-x-auto px-3 pb-3"><table class="w-full text-left text-xs"><thead class="text-stone-500"><tr><th class="py-1 pr-3">Columna</th><th class="py-1 pr-3">Oblig.</th><th class="py-1">Detalle</th></tr></thead>
        <tbody>${COLUMNAS.map(c => `<tr class="border-t border-stone-100 align-top"><td class="py-1.5 pr-3 font-medium">${c[1]}</td><td class="py-1.5 pr-3">${c[2] ? '<b class="text-rose-600">Sí</b>' : 'No'}</td><td class="py-1.5 text-stone-600">${c[3]}</td></tr>`).join('')}</tbody></table></div></details>
      <label class="flex items-start gap-2 text-sm"><input id="i-vacias" type="checkbox" class="${chk}"><span>Las celdas vacías borran el valor actual (si no, se ignoran y se conserva lo que había)</span></label>
      <div class="grid gap-1 sm:grid-cols-[auto_1fr] sm:items-center sm:gap-3"><label class="text-sm" for="i-pais">Para números sin código de país, usar:</label>
        <select id="i-pais" class="${campo}"><option value="">${t('No modificar los teléfonos')}</option>${opcionesPais(paisTel())}</select></div>
      <label id="i-zona" class="grid cursor-pointer place-items-center gap-1 rounded-2xl border-2 border-dashed border-stone-300 bg-stone-50 px-4 py-8 text-center hover:border-oro-400">
        <span class="text-oro-600">${ico('up', 'size-6')}</span><span class="font-medium">Elige o arrastra tu archivo</span><span class="text-xs text-stone-500">.xlsx, .xls, .csv</span>
        <input id="i-file" type="file" accept=".xlsx,.xls,.csv" class="sr-only"></label>
      <p id="i-err" class="min-h-5 text-sm text-rose-600" role="alert"></p></div>`)}${pie(`<button type="button" id="i-plant" class="${btnS} mr-auto">${ico('down')} Descargar plantilla</button><button type="button" class="${btnS}" data-cerrar>Cancelar</button>`)}`, d => {
    d.querySelector('#i-plant').onclick = plantilla;
    const zona = d.querySelector('#i-zona'), leer = f => f && procesarArchivo(f, d.querySelector('#i-vacias').checked, d.querySelector('#i-pais').value);
    d.querySelector('#i-file').onchange = e => leer(e.target.files[0]);
    zona.addEventListener('dragover', e => { e.preventDefault(); zona.classList.add('border-oro-500'); });
    zona.addEventListener('dragleave', () => zona.classList.remove('border-oro-500'));
    zona.addEventListener('drop', e => { e.preventDefault(); leer(e.dataTransfer.files[0]); });
  });
}
async function procesarArchivo(file, vacias, pais = '') {
  const err = $('#i-err');
  if (!window.XLSX) { err.textContent = t('La librería de Excel aún está cargando, intenta en un segundo'); return; }
  let filas;
  try { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false, blankrows: false }); }
  catch { err.textContent = t('No se pudo leer el archivo. ¿Es un Excel válido?'); return; }
  const h = filas.findIndex(r => r.some(c => COLUMNAS.some(col => col[4].includes(normCab(c)))));
  if (h < 0) { err.textContent = t('No encontramos la fila de títulos. La primera fila debe tener “Nombre del invitado” (o “Código”).'); return; }
  const mapa = {}, ignoradas = [];
  filas[h].forEach((c, k) => { const n = normCab(c); if (!n) return;
    const col = COLUMNAS.find(col => col[4].includes(n) || (n.startsWith('respuesta de los novios') && col[0] === 'respuesta_novios'));
    if (col && !Object.values(mapa).includes(col[0])) mapa[k] = col[0]; else ignoradas.push(String(c).trim()); });
  const claves = Object.values(mapa);
  if (!claves.includes('nombre') && !claves.includes('codigo')) { err.textContent = t('Falta la columna “Nombre del invitado”.'); return; }
  vistaPrevia(planificar(filas.slice(h + 1).map((r, k) => ({ r, fila: h + k + 2 })), mapa, vacias, pais), claves, ignoradas, vacias, file.name);
}
function planificar(filas, mapa, vacias, pais = '') {
  const porCod = new Map(S.lista.map(i => [i.codigo, i])), porNom = new Map(S.lista.map(i => [norm(i.nombre), i]));
  const vistos = new Map(), nombresFinales = new Map(S.lista.map(i => [norm(i.nombre), i.id]));
  const max = S.p.pases_max || 10, out = [];
  for (const { r, fila } of filas) {
    const o = { _fila: fila }; let vacia = true;
    for (const [k, cK] of Object.entries(mapa)) { const v = String(r[k] ?? '').trim(); o[cK] = v; if (v) vacia = false; }
    if (vacia) continue;
    const p = { fila, datos: o, errores: [] };
    if ('codigo' in o) o.codigo = o.codigo.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if ('nombre' in o) o.nombre = o.nombre.replace(/\s+/g, ' ');
    if ('categoria' in o) o.categoria = unicasEtiquetas(o.categoria);
    if ('telefono' in o && o.telefono && pais && window.PYD_TEL) {
      const r = PYD_TEL.normalizar(o.telefono, pais);
      p.telOriginal = o.telefono; p.tel = r;
      if (r.estado === 'ok' || r.estado === 'agregado') o.telefono = r.texto; else p.avisos = [...(p.avisos || []), 'WhatsApp: ' + (r.nota || 'revisar')];
    }
    if ('asistencia' in o && o.asistencia) { const a = norm(o.asistencia); o.asistencia = /^(si|s|yes|y|x|1|asist|confirm)/.test(a) ? 'si' : /^(no|n|0)/.test(a) ? 'no' : (p.errores.push('Asistencia no reconocida (usa Sí o No)'), ''); }
    for (const k of ['pases_asignados', 'pases_confirmados']) if (o[k]) { const n = Number(o[k]); if (!Number.isInteger(n) || n < (k === 'pases_asignados' ? 1 : 0) || n > max) p.errores.push(k === 'pases_asignados' ? 'Pases asignados fuera de rango.' : 'Pases confirmados fuera de rango.'); else o[k] = String(n); }
    const ex = (o.codigo && porCod.get(o.codigo)) || (o.nombre && porNom.get(norm(o.nombre))) || null;
    p.existente = ex; p.accion = ex ? 'actualizar' : 'nuevo';
    if (!ex && !o.nombre) p.errores.push(o.codigo ? 'El código no existe y falta el nombre' : 'Falta el nombre');
    const clave = ex ? 'id' + ex.id : 'n' + norm(o.nombre), repetido = vistos.has(clave);
    if (repetido) p.errores.push('Repetido en el archivo'); else vistos.set(clave, fila);
    if (o.nombre && !repetido) { const dueño = nombresFinales.get(norm(o.nombre)); if (dueño != null && dueño !== (ex?.id ?? -1)) p.errores.push('Nombre ya usado por otro invitado: agrega apellido o parentesco'); else nombresFinales.set(norm(o.nombre), ex?.id ?? -fila); }
    const usar = k => k in o && (vacias || o[k] !== '');
    const fin = { ...(ex || { pases_asignados: 1, asistencia: null, pases_confirmados: null }) };
    if (usar('pases_asignados') && o.pases_asignados) fin.pases_asignados = +o.pases_asignados;
    if (usar('asistencia')) fin.asistencia = o.asistencia || null;
    if (usar('pases_confirmados')) fin.pases_confirmados = o.pases_confirmados === '' ? null : +o.pases_confirmados;
    if (fin.asistencia === 'si' && fin.pases_confirmados > fin.pases_asignados) p.errores.push('Los pases confirmados no pueden superar los pases asignados.');
    if (ex && !p.errores.length) {
      const cambia = ['nombre', 'tratamiento', 'mesa', 'telefono', 'categoria', 'respuesta_novios', 'pases_asignados', 'asistencia', 'pases_confirmados', 'acompanantes'].some(k => {
        if (!(k in o)) return false; const v = o[k], a = String(ex[k] ?? '');
        if (v === '') return vacias && a !== '' && !['nombre', 'pases_asignados'].includes(k);
        return String(v) !== a; });
      if (!cambia) p.accion = 'igual';
    }
    if (p.errores.length) p.accion = 'error';
    out.push(p);
  }
  return out;
}
function vistaPrevia(plan, claves, ignoradas, vacias, archivo) {
  const c = a => plan.filter(p => p.accion === a).length, validos = plan.filter(p => p.accion === 'nuevo' || p.accion === 'actualizar');
  const etiqueta = { nuevo: ['Nuevo', 'bg-emerald-50 text-emerald-700'], actualizar: ['Actualiza', 'bg-sky-50 text-sky-700'], igual: ['Sin cambios', 'bg-stone-100 text-stone-500'], error: ['Error', 'bg-rose-50 text-rose-700'] };
  const orden = { error: 0, nuevo: 1, actualizar: 2, igual: 3 }, filas = [...plan].sort((a, b) => orden[a.accion] - orden[b.accion] || (b.avisos ? 1 : 0) - (a.avisos ? 1 : 0)).slice(0, 300);
  modal(`${cabecera('Vista previa de la importación', esc(archivo))}${cuerpo(`
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">${[['nuevo', 'Nuevos'], ['actualizar', 'Se actualizan'], ['igual', 'Sin cambios'], ['error', 'Con errores']].map(([a, tx]) => `<div class="rounded-xl p-3 ${etiqueta[a][1]}"><p class="text-2xl font-semibold tabular-nums">${c(a)}</p><p class="text-xs">${tx}</p></div>`).join('')}</div>
    ${(() => { const tl = plan.filter(p => p.tel), ag = tl.filter(p => p.tel.estado === 'agregado').length, du = tl.filter(p => p.tel.estado === 'dudoso').length, lim = tl.filter(p => p.tel.estado === 'ok' && p.tel.texto !== p.telOriginal).length;
      return tl.length ? `<p class="mt-3 rounded-xl bg-stone-50 p-2.5 text-xs text-stone-600"><b>WhatsApp</b> · ${ag} ${t('con código de país agregado')} · ${lim} ${t('con formato corregido')}${du ? ` · <b class="text-amber-700">${du} ${t('dudosos (se importan tal cual)')}</b>` : ''}</p>` : ''; })()}
    <p class="mt-3 text-xs text-stone-500"><span>Columnas usadas:</span> <b>${claves.map(k => t(COLUMNAS.find(x => x[0] === k)[1])).join(', ')}</b>${ignoradas.length ? ` · <span>Ignoradas:</span> <span data-notr>${esc(ignoradas.join(', '))}</span>` : ''}</p>
    ${c('error') ? `<p class="mt-2 rounded-xl bg-rose-50 p-2.5 text-xs text-rose-700">Las filas con error no se importarán. Corrígelas en el Excel y vuelve a subirlo, o continúa con el resto.</p>` : ''}
    <div class="mt-3 overflow-x-auto rounded-xl ring-1 ring-stone-200"><table class="min-w-full text-xs">
      <thead class="bg-stone-50 text-left text-stone-500"><tr><th class="px-2 py-2">Fila</th><th class="px-2 py-2">Acción</th><th class="px-2 py-2">Nombre</th>${claves.filter(k => k !== 'nombre').map(k => `<th class="px-2 py-2">${COLUMNAS.find(x => x[0] === k)[1]}</th>`).join('')}<th class="px-2 py-2">Detalle</th></tr></thead>
      <tbody class="divide-y divide-stone-100">${filas.map(p => `<tr class="align-top"><td class="px-2 py-1.5 tabular-nums text-stone-400">${p.fila}</td>
        <td class="px-2 py-1.5"><span class="whitespace-nowrap rounded-full px-2 py-0.5 ${etiqueta[p.accion][1]}">${etiqueta[p.accion][0]}</span></td>
        <td class="px-2 py-1.5 font-medium" data-notr>${esc(p.datos.nombre || p.existente?.nombre || '')}${p.existente && p.datos.nombre && norm(p.datos.nombre) !== norm(p.existente.nombre) ? `<div class="font-normal text-stone-400">← ${esc(p.existente.nombre)}</div>` : ''}</td>
        ${claves.filter(k => k !== 'nombre').map(k => { const v = p.datos[k] ?? '', a = p.existente ? String(p.existente[k] ?? '') : '', cambia = p.existente && v !== '' && String(v) !== a;
          return `<td class="px-2 py-1.5 ${cambia ? 'font-medium text-sky-700' : ''}" data-notr>${esc(k === 'asistencia' ? ({ si: 'Sí', no: 'No' }[v] || v) : v)}${cambia && a ? `<div class="font-normal text-stone-400 line-through">${esc(a)}</div>` : ''}</td>`; }).join('')}
        <td class="px-2 py-1.5 text-rose-700">${p.errores.map(e => `<div>${esc(e)}</div>`).join('')}${(p.avisos || []).map(e => `<div class="text-amber-700">⚠ ${esc(e)}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div>
    ${plan.length > 300 ? `<p class="mt-2 text-xs text-stone-500">300 / ${plan.length}</p>` : ''}`)}
    ${pie(`<button type="button" id="p-volver" class="${btnS} mr-auto">Elegir otro archivo</button><button type="button" class="${btnS}" data-cerrar>Cancelar</button>
      <button type="button" id="p-ok" class="${btnP}" ${validos.length ? '' : 'disabled'}><span>Importar</span> (${validos.length})</button>`)}`, d => {
    d.querySelector('#p-volver').onclick = importar;
    d.querySelector('#p-ok').onclick = async () => {
      const b = d.querySelector('#p-ok'); b.disabled = true; b.textContent = t('Importando…');
      const enviar = validos.map(p => { const o = { ...p.datos }; if (!o.codigo && p.existente) o.codigo = p.existente.codigo; return o; });
      const { data, error } = await sb.rpc('admin_importar', { p_proyecto: S.p.id, p_filas: enviar, p_vacias_borran: vacias });
      if (error) { b.disabled = false; b.textContent = t('Reintentar'); return toast(t(errorAmigable(error)), 'error'); }
      await recargar();
      if (data.errores?.length) modal(cabecera('Importación con observaciones') + cuerpo(`<p class="text-sm"><span>Nuevos</span>: <b>${data.nuevos}</b> · <span>Se actualizan</span>: <b>${data.actualizados}</b> · <span>Sin cambios</span>: <b>${data.sin_cambios}</b></p>
          <ul class="mt-3 space-y-1 text-sm text-rose-700">${data.errores.map(e => `<li data-notr>${e.fila}${e.nombre ? ` (${esc(e.nombre)})` : ''}: ${esc(e.error)}</li>`).join('')}</ul>`) + pie(`<button class="${btnP}" data-cerrar>Entendido</button>`));
      else { dlg.close(); toast(`${t('Importación lista')} · +${data.nuevos} · ↻${data.actualizados}`); }
    };
  });
}

/* =====================================================================================
   ARRANQUE

if (!P.configurado) {
  $('#app').innerHTML = `<p class="m-6 rounded-xl bg-amber-50 p-4 text-amber-800">Configura SUPABASE_URL y SUPABASE_ANON en assets/pyd-config.js.</p>`;
} else {
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; setTimeout(pantallaNuevaClave); return; }
    if (ses && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrar(ses));
    if (ev === 'SIGNED_OUT' || (ev === 'INITIAL_SESSION' && !ses)) {
      if (S.canal) { sb.removeChannel(S.canal); S.canal = null; }
      S.user = null; S.p = null; localStorage.removeItem('pyd.staff');
      if (S.recuperando && ev === 'INITIAL_SESSION') { S.recuperando = false; return pantallaLogin(t('El enlace venció o ya fue usado. Solicita uno nuevo.')); }
      altaPendiente() && ev === 'INITIAL_SESSION' ? pantallaAlta() : pantallaLogin();
    }
  });
}
