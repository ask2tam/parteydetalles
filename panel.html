const norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const slugify = t => norm(t).replace(/&/g, 'y').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);

function toast(msg, tipo = 'ok') {
  const c = { ok: 'bg-stone-900 text-white', error: 'bg-rose-600 text-white', info: 'bg-white text-stone-800 ring-1 ring-stone-200' }[tipo];
  const d = document.createElement('div');
  d.className = `pointer-events-auto max-w-md rounded-xl px-4 py-2.5 text-sm shadow-lg ${c}`;
  d.textContent = msg; $('#toasts').appendChild(d);
  setTimeout(() => { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, tipo === 'error' ? 6000 : 3200);
}
function errorAmigable(e) {
  const m = (e && (e.message || e.details)) || String(e);
  if (e?.code === '23505' && /miembros/.test(m)) return 'Ese correo ya tiene acceso a este evento.';
  if (e?.code === '23505' && /proyectos_slug|slug/.test(m)) return 'Ya existe un evento con ese identificador.';
  if (e?.code === '23505' || /duplicate key|nombre_uk|nombre_norm/.test(m)) return 'Ya existe un invitado con ese nombre. Agrega un apellido o el parentesco entre paréntesis, p. ej. “Pérez (Padre)”.';
  if (/pases_confirmados_max/.test(m)) return 'Los pases confirmados no pueden superar los pases asignados.';
  if (/slug/.test(m) && /check/.test(m)) return 'Identificador inválido: usa minúsculas, números y guiones (3 a 40 caracteres).';
  if (/check/.test(m)) return 'Hay un valor fuera de rango. Revisa los campos.';
  if (/JWT|session|permission|RLS|no_autorizado|row-level/i.test(m)) return 'Tu usuario no tiene permiso para esta acción.';
  return m;
}
function errorClave(e) {
  const c = e?.code || '', m = e?.message || '';
  if (c === 'same_password' || /different from the old/i.test(m)) return 'La nueva contraseña debe ser distinta de la actual.';
  if (c === 'weak_password' || /weak|at least/i.test(m)) return `Contraseña muy débil: usa al menos ${CLAVE_MIN} caracteres combinando letras y números.`;
  if (c === 'reauthentication_needed' || /reauthentic/i.test(m)) return 'Por seguridad debes volver a iniciar sesión antes de cambiar la contraseña.';
  if (/expired|invalid/i.test(m)) return 'El enlace o código venció. Solicita uno nuevo.';
  if (/rate|too many|seconds/i.test(m)) return 'Demasiados intentos. Espera un minuto y vuelve a intentarlo.';
  return m || 'No se pudo completar la operación.';
}

}

  <div class="min-w-0"><h2 class="text-lg font-semibold">${t}</h2>${sub ? `<p class="mt-0.5 text-sm text-stone-500">${sub}</p>` : ''}</div>

const cuerpo = h => `<div class="max-h-[calc(92dvh-9rem)] overflow-y-auto px-5 py-4">${h}</div>`;
const pie = h => `<div class="flex flex-wrap justify-end gap-2 border-t border-stone-200 bg-stone-50 px-5 py-3">${h}</div>`;
function confirmar({ titulo, texto, ok = 'Confirmar', peligro = false, palabra = null }) {
  return new Promise(res => {
    modal(cabecera(titulo) + cuerpo(`<p class="text-sm text-stone-600">${texto}</p>${palabra ? `<label class="${lbl} mt-4" for="cf-p">Escribe <b>${palabra}</b> para continuar</label><input id="cf-p" class="${campo}" autocomplete="off">` : ''}`) +
      pie(`<button type="button" class="${btnS}" data-cerrar>Cancelar</button><button type="button" id="cf-ok" class="${peligro ? btnD : btnP}" ${palabra ? 'disabled' : ''}>${ok}</button>`), d => {
      let r = false;
      d.querySelector('#cf-p')?.addEventListener('input', e => { d.querySelector('#cf-ok').disabled = e.target.value.trim() !== palabra; });
      d.querySelector('#cf-ok').addEventListener('click', () => { r = true; d.close(); });
      d.addEventListener('close', () => res(r), { once: true });
    });
  });
}
const piePagina = () => `<footer class="mt-10 flex flex-col items-center gap-1 pb-6 text-xs text-stone-500">

function pantallaLogin(msg = '') {
  S.user = null;
  $('#app').innerHTML = tarjetaAcceso(`<form id="login" class="mt-4">
      <label class="${lbl}" for="l-email">Correo</label><input id="l-email" type="email" autocomplete="email" required class="${campo}">
      <div class="mt-4 flex items-baseline justify-between"><label class="${lbl}" for="l-pass">Contraseña</label>
        <button type="button" id="l-olvide" class="${enlace} text-xs">¿Olvidaste tu contraseña?</button></div>
      <input id="l-pass" type="password" autocomplete="current-password" class="${campo}">
      <p id="l-msg" class="mt-3 min-h-5 text-sm text-rose-600" role="status">${esc(msg)}</p>
      <button class="${btnP} mt-2 w-full">Ingresar</button>
      <button type="button" id="l-magic" class="${btnS} mt-2 w-full">${ico('mail')} Enviarme un enlace de acceso</button></form>`);
  const m = $('#l-msg');
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); msgAcceso(m, 'Ingresando…', 'info');
    const { error } = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pass').value });
    if (error) msgAcceso(m, /confirm/i.test(error.message) ? 'Tu correo aún no está confirmado.' : 'Correo o contraseña incorrectos.');
  });
  $('#l-olvide').addEventListener('click', () => pantallaRecuperar($('#l-email').value.trim()));

async function entrar(session, forzar = false) {
  if (S.recuperando) return pantallaNuevaClave();
  if (!forzar && S.user && S.user.id === session.user.id) return;

  const { data, error } = await sb.rpc('mi_perfil');
  if (error || !data) { pantallaLogin('No se pudo verificar tu acceso.'); return; }
  S.perfil = data;
  const todos = data.proyectos || [];
  S.proyectos = todos.filter(x => x.rol === 'admin' || x.rol === 'novios');
  const staff = todos.filter(x => x.rol === 'staff');
  localStorage.setItem('pyd.staff', JSON.stringify({ proyectos: staff.map(x => x.slug) }));
  if (!S.proyectos.length && !data.admin) {
    if (staff.length) { location.replace(P.STAFF_URL + '?p=' + encodeURIComponent(staff[0].slug)); return; }
    await sb.auth.signOut(); pantallaLogin('Este correo no tiene acceso al panel.'); return;

  if (!S.proyectos.length) { pantallaSinProyectos(); return; }
  const pedido = new URLSearchParams(location.search).get('p') || localStorage.getItem('panel.proyecto');
  const elegido = S.proyectos.find(x => x.slug === pedido) || S.proyectos[0];
  await abrirProyecto(elegido.id);
}

async function abrirProyecto(id) {

  S.sel.clear(); S.q = ''; S.seg = 'todos';
  $('#app').innerHTML = `<div class="grid min-h-dvh place-items-center text-stone-500">Cargando invitados…</div>`;

  if (c.error || l.error) { $('#app').innerHTML = `<p class="p-6 text-rose-700">No se pudieron cargar los datos: ${esc(errorAmigable(c.error || l.error))}</p>`; return; }
  S.p = c.data; S.lista = l.data;
  localStorage.setItem('panel.proyecto', S.p.slug);
  const u = new URL(location.href); u.searchParams.set('p', S.p.slug); history.replaceState(null, '', u.toString());

async function recargar() {
  const { data, error } = await sb.from('invitados').select('*').eq('proyecto_id', S.p.id).order('id');
  if (!error) { S.lista = data; refrescar(); }
}
function suscribir() {
  const id = S.p.id;
  S.canal = sb.channel('invitados-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invitados', filter: `proyecto_id=eq.${id}` }, pl => {
      if (pl.eventType === 'DELETE') { S.lista = S.lista.filter(i => i.id !== pl.old.id); S.sel.delete(pl.old.id); }
      else if (pl.new.proyecto_id === S.p.id) { upsertLocal(pl.new); S.recientes.set(pl.new.id, Date.now()); }
      programar();
    })
    .subscribe(st => { if (st === 'SUBSCRIBED') recargar(); });   // al (re)conectar se sincroniza lo que pudo perderse
}
function upsertLocal(r) { const k = S.lista.findIndex(i => i.id === r.id); if (k >= 0) S.lista[k] = r; else S.lista.push(r); }

const preguntas = () => (S.p?.formulario?.preguntas || []);
function respuestasTxt(i, sep = ' · ') {
  const r = i.respuestas || {};
  return preguntas().filter(q => r[q.id] != null).map(q => `${q.etiqueta}: ${Array.isArray(r[q.id]) ? r[q.id].join(', ') : q.tipo === 'sino' ? (r[q.id] === 'si' ? 'Sí' : 'No') : r[q.id]}`).join(sep);
}
function coincide(i) {
  const e = estadoDe(i);
  switch (S.seg) {
    case 'pendiente': case 'si': case 'no': if (e !== S.seg) return false; break;
    case 'abrio': if (!(i.vistas > 0 && e === 'pendiente')) return false; break;
    case 'no_abrio': if (i.vistas > 0) return false; break;
    case 'sin_envio': if (i.whatsapp_enviado) return false; break;
    case 'con_mensaje': if (!i.mensaje) return false; break;
    case 'sin_mesa': if (!(e === 'si' && !i.mesa)) return false; break;
    case 'ingreso': if (!(i.ingreso_pases > 0)) return false; break;
  }
  if (!S.q.trim()) return true;
  const q = norm(S.q);
  return [i.nombre, i.tratamiento, i.codigo, i.mesa, i.telefono, i.mensaje, i.respuesta_novios, i.acompanantes, respuestasTxt(i)].some(v => norm(v).includes(q));
}
function visibles() {
  const k = S.orden, d = S.dir === 'asc' ? 1 : -1, ord = { si: 0, pendiente: 1, no: 2 };
  const val = i => k === 'estado' ? ord[estadoDe(i)] : i[k];
  return S.lista.filter(coincide).sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    if (typeof x === 'number') return (x - y) * d;
    return String(x).localeCompare(String(y), 'es', { numeric: true, sensitivity: 'base' }) * d;

}

    k('pendiente', 'Pendientes', pen.length, `${sum(pen, i => i.pases_asignados)} pases por confirmar`, 'text-amber-700') +
    `<div class="col-span-2 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 sm:col-span-1">
       <div class="flex items-baseline justify-between"><p class="text-xs font-medium text-stone-500">Tasa de respuesta</p><p class="text-2xl font-semibold tabular-nums">${pct}%</p></div>
       <div class="mt-2 flex h-2.5 overflow-hidden rounded-full bg-stone-100" role="img" aria-label="${si.length} asistirán, ${no.length} no asistirán, ${pen.length} pendientes">

       <p class="mt-2 text-xs text-stone-500">${resp} de ${L.length} respondieron</p></div>` +

    (ingresos ? k('ingreso', 'Ingresaron', ingresos, `de ${pc} pases confirmados`) : '');
}

   ===================================================================================== */
function mensajeWa(i, plantilla) {
  const p = S.p, fl = p.fecha_limite ? new Date(p.fecha_limite).toLocaleDateString('es-PE', { day: 'numeric', month: 'long' }) : '';
  let t = plantilla ?? p.mensaje_whatsapp ?? '';
  if (!fl) t = t.replace(/[ \t]*(antes del|hasta el)[ \t]*\{fecha_limite\}/gi, '').replace(/\{fecha_limite\}/g, '');
  const novios = fusionar(DEF_TARJETA, p.tarjeta).titulo || p.nombre;
  return t.replace(/\{(\w+)\}/g, (m, k) => ({
    tratamiento: i.tratamiento && !norm(i.nombre).startsWith(norm(i.tratamiento)) ? i.tratamiento : '', nombre: i.nombre, link: link(i), link_rsvp: linkRsvp(i),
    pases: plural(i.pases_asignados, 'pase', 'pases'), codigo: i.codigo, mesa: i.mesa, fecha_limite: fl, novios }[k] ?? m))
    .replace(/[ \t]{2,}/g, ' ').replace(/^ /gm, '').replace(/ ([,.:;!?])/g, '$1');
}
function numeroWa(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length <= 9 && S.p.codigo_pais) d = S.p.codigo_pais + d;
  return d;
}
async function whatsapp(i) {
  const n = numeroWa(i.telefono);
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(mensajeWa(i))}`, '_blank', 'noopener');
  if (!n) toast('Sin número: elige el contacto en WhatsApp', 'info');
  const { data, error } = await sb.from('invitados').update({ whatsapp_enviado: new Date().toISOString() }).eq('id', i.id).select().single();
  if (!error) { upsertLocal(data); refrescar(); }
}

/* IA: redacta el mensaje en vivo (Edge Function "generar-mensaje", respuesta en streaming) */
async function generarIA({ ta, instrucciones, tonos, base, alTexto, alFin }) {
  const { data: { session } } = await sb.auth.getSession();
  const ctl = new AbortController(); S.ia = ctl;
  let txt = '';
  try {
    const r = await fetch(P.SUPABASE_URL + '/functions/v1/generar-mensaje', {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', apikey: P.SUPABASE_ANON, Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ proyecto: S.p.id, instrucciones, tonos, base })
    });
    if (!r.ok || !r.body) {
      const j = await r.json().catch(() => ({}));
      throw new Error(r.status === 404 ? 'La función de IA no está desplegada (ver LEEME).' : j.error === 'sin_configurar' ? 'Falta configurar AI_API_KEY en Supabase.'
        : r.status === 403 ? 'Tu usuario no puede usar la IA en este evento.' : j.status === 429 ? 'La IA alcanzó su límite por ahora. Intenta en un minuto.' : 'La IA no respondió. Intenta de nuevo.');
    }
    ta.value = ''; ta.classList.add('escribiendo');
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n')) >= 0) {
        const linea = buf.slice(0, k).trim(); buf = buf.slice(k + 1);
        if (!linea.startsWith('data:')) continue;
        const dato = linea.slice(5).trim(); if (dato === '[DONE]') continue;
        try { const c = JSON.parse(dato).choices?.[0]?.delta?.content; if (c) { txt += c; ta.value = txt; ta.scrollTop = ta.scrollHeight; alTexto?.(); } } catch {}
      }
    }
    txt = txt.trim();
    if (!txt) throw new Error('La IA no devolvió texto. Intenta con otras indicaciones.');
    if (!/\{link\}/.test(txt)) txt += '\n\n{link}';
    ta.value = txt; alTexto?.(); return true;
  } catch (e) {
    if (e.name !== 'AbortError') toast(e.message, 'error');
    if (txt) { ta.value = txt; alTexto?.(); }
    return false;
  } finally { ta.classList.remove('escribiendo'); S.ia = null; alFin?.(); }
}

      const cambios = {
        nombre: v('#c-nombre') || c.nombre, url_invitacion: v('#c-uinv'), url_rsvp: v('#c-ursvp'), fecha_limite: lim ? new Date(lim).toISOString() : null,
        pases_max: Math.max(1, Math.min(50, parseInt(q('#c-max').value, 10) || 10)), codigo_pais: q('#c-pais').value.replace(/\D/g, ''), permitir_nuevos: q('#c-nuevos').checked,
        formulario: { preguntar_pases: q('#f-pases').checked, pedir_acompanantes: q('#f-acomp').checked, permitir_mensaje: q('#f-msg').checked, preguntas },
        tarjeta: { titulo: v('#t-titulo'), logo_qr: v('#t-logo'), fecha: v('#t-fecha'), lugar: v('#t-lugar'),
          colores: { papel: q('#t-c-papel').value, tinta: q('#t-c-tinta').value, acento: q('#t-c-acento').value, suave: q('#t-c-suave').value },
          textos: { etiqueta_pendiente: v('#t-e-pend'), etiqueta_si: v('#t-e-si'), etiqueta_no: v('#t-e-no'), mensaje_pendiente: v('#t-m-pend'), mensaje_si: v('#t-m-si'), mensaje_no: v('#t-m-no') },
          evento: { titulo: v('#t-ev-tit'), inicio: deLocal(q('#t-ini').value), fin: deLocal(q('#t-fin').value), lugar: v('#t-ev-lug'), detalle: v('#t-ev-det') } },
        mensaje_whatsapp: ta.value,
        reporte_activo: q('#c-rep').checked, reporte_destinatarios: correosValidos(dest.value).join(', '), reporte_hora: parseInt(q('#c-hora').value, 10)
      };
      if (q('#c-activo')) cambios.activo = q('#c-activo').checked;
      return cambios;
    };
    const guardar = async () => {
      const cambios = leer(), err = q('#c-err'); err.textContent = '';
      const irA = (tab, msg) => { d.querySelector(`[data-tab="${tab}"]`).click(); err.textContent = msg; return false; };
      if (cambios.reporte_activo && !cambios.reporte_destinatarios) return irA('reporte', ERRORES_REPORTE.sin_destinatarios);
      const malas = cambios.formulario.preguntas.filter(p => ['opcion', 'multiple'].includes(p.tipo) && p.opciones.length < 2);
      if (malas.length) return irA('formulario', `“${malas[0].etiqueta}” necesita al menos 2 opciones.`);
      if (!/\{link\}|\{link_rsvp\}/.test(cambios.mensaje_whatsapp)) return irA('whatsapp', 'El mensaje de WhatsApp debe incluir {link} o {link_rsvp}.');
      const { data, error } = await sb.from('proyectos').update(cambios).eq('id', c.id).select().single();
      if (error) { err.textContent = errorAmigable(error); return false; }
      S.p = data; const it = S.proyectos.find(x => x.id === data.id); if (it) { it.nombre = data.nombre; it.activo = data.activo; }
      $('#titulo').innerHTML = selectorProyecto(); $('#sel-p')?.addEventListener('change', e => { if (e.target.value === 'nuevo') { e.target.value = S.p.id; nuevoProyecto(); } else abrirProyecto(+e.target.value); });
      refrescar(); return true;
    };
    q('#f-cfg').addEventListener('submit', async e => { e.preventDefault(); if (await guardar()) { dlg.close(); toast('Configuración guardada'); } });
    q('#c-probar').onclick = async ev => {
      const b = ev.currentTarget, err = q('#c-err');
      if (!correosValidos(dest.value).length) { err.textContent = ERRORES_REPORTE.sin_destinatarios; return; }
      b.disabled = true;
      try {
        if (!(await guardar())) return;
        const { data, error } = await sb.rpc('admin_reporte_probar', { p_proyecto: c.id });
        if (error) { err.textContent = errorAmigable(error); return; }
        if (!data.ok) { err.textContent = ERRORES_REPORTE[data.error] || data.error; return; }
        toast(`Reporte de prueba enviado a ${plural(correosValidos(dest.value).length, 'destinatario', 'destinatarios')}`, 'info');
        setTimeout(() => estadoReporte(q('#c-rep-estado')), 3000);
      } finally { b.disabled = false; }
    };
  });
}

async function estadoReporte(el) {
  if (!el) return;
  const { data, error } = await sb.rpc('admin_reporte_estado', { p_proyecto: S.p.id });
  if (!el.isConnected) return;
  if (error || !data) { el.innerHTML = '<span class="text-amber-700">No se pudo consultar el estado del reporte.</span>'; return; }
  const avisos = [];
  if (!data.tiene_api_key) avisos.push('El servicio de correo aún no está configurado.');
  if (!data.programado) avisos.push('El envío automático no está activo en el servidor.');
  const r = data.respuesta, res = data.resultado;
  let ultimo = 'Aún no se ha enviado ningún reporte.';
  if (res?.fecha) {
    const ok = r && r.status >= 200 && r.status < 300, falla = r && (r.status >= 300 || r.error || r.timeout);
    ultimo = `Último envío${res.prueba ? ' (prueba)' : ''}: ${fmt(res.fecha)} · ${plural(res.cambios, 'cambio', 'cambios')} · `
      + (ok ? '<span class="font-medium text-emerald-700">correo entregado</span>'
         : falla ? '<span class="font-medium text-rose-700">no se pudo entregar</span>'
         : '<span class="text-stone-500">en proceso</span>');
  }
  el.innerHTML = ultimo + (avisos.length ? `<ul class="mt-2 list-disc pl-5 text-amber-700">${avisos.map(a => `<li>${a}</li>`).join('')}</ul>` : '');
}

function sello() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
const fecha = iso => iso ? new Date(iso) : null;
function exportar(lista, sufijo) {
  if (!window.XLSX) return toast('La librería de Excel aún está cargando, intenta en un segundo', 'info');
  if (!lista.length) return toast('No hay invitados para exportar', 'info');
  const pq = preguntas();
  const filas = lista.map(i => {
    const o = { 'Nombre del invitado': i.nombre, 'Tratamiento': i.tratamiento, 'Código': i.codigo, 'Link': link(i), 'Link RSVP': linkRsvp(i),
      'Asistencia a la boda': i.asistencia === 'si' ? 'Sí, asistiré' : i.asistencia === 'no' ? 'No podré asistir' : '',
      'Pases asignados': i.pases_asignados, 'Pases confirmados': i.pases_confirmados ?? '', 'Acompañantes': i.acompanantes };
    pq.forEach(q => { const v = (i.respuestas || {})[q.id]; o[q.etiqueta] = v == null ? '' : Array.isArray(v) ? v.join(', ') : q.tipo === 'sino' ? (v === 'si' ? 'Sí' : 'No') : v; });
    Object.assign(o, { 'Mensaje a los novios': i.mensaje,
      'Fecha registro': fecha(i.fecha_registro), 'Fecha primera vista': fecha(i.primera_vista), 'Fecha última vista': fecha(i.ultima_vista), 'N.º de vistas': i.vistas,
      'Fecha primera respuesta': fecha(i.primera_respuesta), 'Fecha última modificación': fecha(i.ultima_modificacion), 'N.º de ediciones': i.ediciones,
      'Respuesta de los novios': i.respuesta_novios, 'Número de mesa': i.mesa, 'WhatsApp': i.telefono, 'WhatsApp enviado': fecha(i.whatsapp_enviado),
      'Ingresaron (pases)': i.ingreso_pases || '', 'Hora de ingreso': fecha(i.ingreso_fecha) });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(filas, { dateNF: 'dd/mm/yyyy hh:mm' });
  ws['!cols'] = Object.keys(filas[0]).map(k => ({ wch: /Link/.test(k) ? 46 : /Mensaje|Respuesta de|Acompa/.test(k) ? 36 : /Nombre/.test(k) ? 28 : 14 }));
  ws['!autofilter'] = { ref: ws['!ref'] };
  filas.forEach((f, r) => { [3, 4].forEach(cI => { const a = XLSX.utils.encode_cell({ r: r + 1, c: cI }); if (ws[a]) ws[a].l = { Target: ws[a].v }; }); });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
  XLSX.writeFile(wb, `invitados_${S.p.slug}_${sufijo}_${sello()}.xlsx`);
  toast(plural(lista.length, 'invitado exportado', 'invitados exportados'));
}

const normCab = t => norm(t).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

async function procesarArchivo(file, vacias) {
  const err = $('#i-err');
  if (!window.XLSX) { err.textContent = 'La librería de Excel aún está cargando, intenta de nuevo.'; return; }
  let filas;
  try { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false, blankrows: false }); }
  catch { err.textContent = 'No se pudo leer el archivo. ¿Es un Excel válido?'; return; }
  const h = filas.findIndex(r => r.some(c => COLUMNAS.some(col => col[4].includes(normCab(c)))));
  if (h < 0) { err.textContent = 'No encontramos la fila de títulos. La primera fila debe tener “Nombre del invitado” (o “Código”).'; return; }
  const mapa = {}, ignoradas = [];
  filas[h].forEach((c, k) => { const n = normCab(c); if (!n) return;
    const col = COLUMNAS.find(col => col[4].includes(n) || (n.startsWith('respuesta de los novios') && col[0] === 'respuesta_novios'));
    if (col && !Object.values(mapa).includes(col[0])) mapa[k] = col[0]; else ignoradas.push(String(c).trim()); });
  const claves = Object.values(mapa);
  if (!claves.includes('nombre') && !claves.includes('codigo')) { err.textContent = 'Falta la columna “Nombre del invitado”.'; return; }
  vistaPrevia(planificar(filas.slice(h + 1).map((r, k) => ({ r, fila: h + k + 2 })), mapa, vacias), claves, ignoradas, vacias, file.name);
}
function planificar(filas, mapa, vacias) {
  const porCod = new Map(S.lista.map(i => [i.codigo, i])), porNom = new Map(S.lista.map(i => [norm(i.nombre), i]));
  const vistos = new Map(), nombresFinales = new Map(S.lista.map(i => [norm(i.nombre), i.id]));
  const max = S.p.pases_max || 10, out = [];
  for (const { r, fila } of filas) {
    const o = { _fila: fila }; let vacia = true;
    for (const [k, cK] of Object.entries(mapa)) { const v = String(r[k] ?? '').trim(); o[cK] = v; if (v) vacia = false; }
    if (vacia) continue;
    const p = { fila, datos: o, errores: [] };
    if ('codigo' in o) o.codigo = o.codigo.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if ('nombre' in o) o.nombre = o.nombre.replace(/\s+/g, ' ');
    if ('asistencia' in o && o.asistencia) { const a = norm(o.asistencia); o.asistencia = /^(si|s|yes|x|1|asist|confirm)/.test(a) ? 'si' : /^(no|n|0)/.test(a) ? 'no' : (p.errores.push('Asistencia no reconocida (usa Sí o No)'), ''); }
    for (const k of ['pases_asignados', 'pases_confirmados']) if (o[k]) { const n = Number(o[k]); if (!Number.isInteger(n) || n < (k === 'pases_asignados' ? 1 : 0) || n > max) p.errores.push(`${k === 'pases_asignados' ? 'Pases asignados' : 'Pases confirmados'} inválido (0–${max})`); else o[k] = String(n); }
    const ex = (o.codigo && porCod.get(o.codigo)) || (o.nombre && porNom.get(norm(o.nombre))) || null;
    p.existente = ex; p.accion = ex ? 'actualizar' : 'nuevo';
    if (!ex && !o.nombre) p.errores.push(o.codigo ? `Código ${o.codigo} no existe y falta el nombre` : 'Falta el nombre');
    const clave = ex ? 'id' + ex.id : 'n' + norm(o.nombre), repetido = vistos.has(clave);
    if (repetido) p.errores.push(`Repetido en el archivo (fila ${vistos.get(clave)})`); else vistos.set(clave, fila);
    if (o.nombre && !repetido) { const dueño = nombresFinales.get(norm(o.nombre)); if (dueño != null && dueño !== (ex?.id ?? -1)) p.errores.push('Nombre ya usado por otro invitado: agrega apellido o parentesco'); else nombresFinales.set(norm(o.nombre), ex?.id ?? -fila); }
    const usar = k => k in o && (vacias || o[k] !== '');
    const fin = { ...(ex || { pases_asignados: 1, asistencia: null, pases_confirmados: null }) };
    if (usar('pases_asignados') && o.pases_asignados) fin.pases_asignados = +o.pases_asignados;
    if (usar('asistencia')) fin.asistencia = o.asistencia || null;
    if (usar('pases_confirmados')) fin.pases_confirmados = o.pases_confirmados === '' ? null : +o.pases_confirmados;
    if (fin.asistencia === 'si' && fin.pases_confirmados > fin.pases_asignados) p.errores.push('Pases confirmados mayor que pases asignados');
    if (ex && !p.errores.length) {
      const cambia = ['nombre', 'tratamiento', 'mesa', 'telefono', 'respuesta_novios', 'pases_asignados', 'asistencia', 'pases_confirmados', 'acompanantes'].some(k => {
        if (!(k in o)) return false; const v = o[k], a = String(ex[k] ?? '');
        if (v === '') return vacias && a !== '' && !['nombre', 'pases_asignados'].includes(k);
        return String(v) !== a; });
      if (!cambia) p.accion = 'igual';
    }
    if (p.errores.length) p.accion = 'error';
    out.push(p);
  }
  return out;
}
function vistaPrevia(plan, claves, ignoradas, vacias, archivo) {
  const c = a => plan.filter(p => p.accion === a).length, validos = plan.filter(p => p.accion === 'nuevo' || p.accion === 'actualizar');
  const etiqueta = { nuevo: ['Nuevo', 'bg-emerald-50 text-emerald-700'], actualizar: ['Actualiza', 'bg-sky-50 text-sky-700'], igual: ['Sin cambios', 'bg-stone-100 text-stone-500'], error: ['Error', 'bg-rose-50 text-rose-700'] };
  const orden = { error: 0, nuevo: 1, actualizar: 2, igual: 3 }, filas = [...plan].sort((a, b) => orden[a.accion] - orden[b.accion]).slice(0, 300);
  modal(`${cabecera('Vista previa de la importación', esc(archivo))}${cuerpo(`
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">${[['nuevo', 'Nuevos'], ['actualizar', 'Se actualizan'], ['igual', 'Sin cambios'], ['error', 'Con errores']].map(([a, t]) => `<div class="rounded-xl p-3 ${etiqueta[a][1]}"><p class="text-2xl font-semibold tabular-nums">${c(a)}</p><p class="text-xs">${t}</p></div>`).join('')}</div>
    <p class="mt-3 text-xs text-stone-500">Columnas usadas: <b>${claves.map(k => COLUMNAS.find(x => x[0] === k)[1]).join(', ')}</b>.${ignoradas.length ? ` Ignoradas: ${esc(ignoradas.join(', '))}.` : ''} Celdas vacías: ${vacias ? '<b>borran</b> el valor' : 'se ignoran'}.</p>
    ${c('error') ? `<p class="mt-2 rounded-xl bg-rose-50 p-2.5 text-xs text-rose-700">Las filas con error no se importarán. Corrígelas en el Excel y vuelve a subirlo, o continúa con el resto.</p>` : ''}
    <div class="mt-3 overflow-x-auto rounded-xl ring-1 ring-stone-200"><table class="min-w-full text-xs">
      <thead class="bg-stone-50 text-left text-stone-500"><tr><th class="px-2 py-2">Fila</th><th class="px-2 py-2">Acción</th><th class="px-2 py-2">Nombre</th>${claves.filter(k => k !== 'nombre').map(k => `<th class="px-2 py-2">${COLUMNAS.find(x => x[0] === k)[1]}</th>`).join('')}<th class="px-2 py-2">Detalle</th></tr></thead>
      <tbody class="divide-y divide-stone-100">${filas.map(p => `<tr class="align-top"><td class="px-2 py-1.5 tabular-nums text-stone-400">${p.fila}</td>
        <td class="px-2 py-1.5"><span class="whitespace-nowrap rounded-full px-2 py-0.5 ${etiqueta[p.accion][1]}">${etiqueta[p.accion][0]}</span></td>
        <td class="px-2 py-1.5 font-medium">${esc(p.datos.nombre || p.existente?.nombre || '')}${p.existente && p.datos.nombre && norm(p.datos.nombre) !== norm(p.existente.nombre) ? `<div class="font-normal text-stone-400">antes: ${esc(p.existente.nombre)}</div>` : ''}</td>
        ${claves.filter(k => k !== 'nombre').map(k => { const v = p.datos[k] ?? '', a = p.existente ? String(p.existente[k] ?? '') : '', cambia = p.existente && v !== '' && String(v) !== a;
          return `<td class="px-2 py-1.5 ${cambia ? 'font-medium text-sky-700' : ''}">${esc(k === 'asistencia' ? ({ si: 'Sí', no: 'No' }[v] || v) : v)}${cambia && a ? `<div class="font-normal text-stone-400 line-through">${esc(a)}</div>` : ''}</td>`; }).join('')}
        <td class="px-2 py-1.5 text-rose-700">${p.errores.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div>
    ${plan.length > 300 ? `<p class="mt-2 text-xs text-stone-500">Mostrando 300 de ${plan.length} filas.</p>` : ''}`)}
    ${pie(`<button type="button" id="p-volver" class="${btnS} mr-auto">Elegir otro archivo</button><button type="button" class="${btnS}" data-cerrar>Cancelar</button>
      <button type="button" id="p-ok" class="${btnP}" ${validos.length ? '' : 'disabled'}>Importar ${plural(validos.length, 'fila', 'filas')}</button>`)}`, d => {
    d.querySelector('#p-volver').onclick = importar;
    d.querySelector('#p-ok').onclick = async () => {
      const b = d.querySelector('#p-ok'); b.disabled = true; b.textContent = 'Importando…';
      const enviar = validos.map(p => { const o = { ...p.datos }; if (!o.codigo && p.existente) o.codigo = p.existente.codigo; return o; });
      const { data, error } = await sb.rpc('admin_importar', { p_proyecto: S.p.id, p_filas: enviar, p_vacias_borran: vacias });
      if (error) { b.disabled = false; b.textContent = 'Reintentar'; return toast(errorAmigable(error), 'error'); }
      await recargar();
      if (data.errores?.length) modal(cabecera('Importación con observaciones') + cuerpo(`<p class="text-sm">Nuevos: <b>${data.nuevos}</b> · Actualizados: <b>${data.actualizados}</b> · Sin cambios: <b>${data.sin_cambios}</b></p>
          <ul class="mt-3 space-y-1 text-sm text-rose-700">${data.errores.map(e => `<li>Fila ${e.fila}${e.nombre ? ` (${esc(e.nombre)})` : ''}: ${esc(e.error)}</li>`).join('')}</ul>`) + pie(`<button class="${btnP}" data-cerrar>Entendido</button>`));
      else { dlg.close(); toast(`Importación lista · ${data.nuevos} nuevos · ${data.actualizados} actualizados`); }
    };
  });
}

/* =====================================================================================
   ARRANQUE
   ===================================================================================== */
if (P.SUPABASE_URL.includes('TU-PROYECTO')) {
  $('#app').innerHTML = `<p class="m-6 rounded-xl bg-amber-50 p-4 text-amber-800">Configura SUPABASE_URL y SUPABASE_ANON en assets/pyd-config.js.</p>`;
} else {
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; setTimeout(pantallaNuevaClave); return; }
    if (ses && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrar(ses));
    if (ev === 'SIGNED_OUT' || (ev === 'INITIAL_SESSION' && !ses)) {
      if (S.canal) { sb.removeChannel(S.canal); S.canal = null; }
      S.user = null; S.p = null; localStorage.removeItem('pyd.staff');
      if (S.recuperando && ev === 'INITIAL_SESSION') { S.recuperando = false; return pantallaLogin('El enlace venció o ya fue usado. Solicita uno nuevo.'); }
      pantallaLogin();
    }
  });
}
</script>
