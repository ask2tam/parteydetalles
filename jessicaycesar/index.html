  #btn-musica {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 70;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #f2ede5;
    border: none;
    color: #8a7f75;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  #btn-musica:hover { 
    transform: scale(1.05); 
    background-color: #e8e0d3; 
  }
  #btn-musica:active { transform: scale(0.95); }

  /* Animación Heartbeat corregida para aplicarse sobre el contenedor ID exacto de Canva (__id5) */
  @keyframes heartbeat {
    0% { transform: translate(144.2px, 116.725px) scale(1); }
    15% { transform: translate(144.2px, 116.725px) scale(1.12); }
    30% { transform: translate(144.2px, 116.725px) scale(1); }
    45% { transform: translate(144.2px, 116.725px) scale(1.08); }
    60% { transform: translate(144.2px, 116.725px) scale(1); }
    100% { transform: translate(144.2px, 116.725px) scale(1); }
  }

  #_id5_animado {
    animation: heartbeat 1.8s infinite ease-in-out !important;
    transform-origin: center center;
    cursor: pointer;
  }

  /* El enlace dentro del contenedor debe ocupar todo el espacio para ser clickeable */
  #__id5 a._3zDNwA {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    cursor: pointer;
  }

  /* Ocultar el bloque de pases por defecto hasta que ocurra el primer click */
  .bloque-pases-oculto {
    display: none !important;
  }

  /* Efecto de brillo desplazándose de izquierda a derecha con los grises definidos */
  @keyframes luzIzquierdaDerecha {
    0% {
      background-position: 200% 0;
    }
    100% {
      background-position: -200% 0;
    }
  }

  .efecto-luz-reluciente {
    background: linear-gradient(90deg, #9e958d 0%, #9e958d 35%, #ded6cc 50%, #9e958d 65%, #9e958d 100%);
    background-size: 200% auto;
    color: #9e958d;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: luzIzquierdaDerecha 3s linear infinite !important;
    cursor: pointer !important;
  }

  #LBxbkKyKLgDQym4n {

  }

<script>
  // Script para gestionar el parámetro 'pase' de la URL y actualizar el texto de los pases de manera dinámica
  const urlParams = new URLSearchParams(window.location.search);
  const numeroPases = urlParams.get('pase');
  const textoDinamicoPases = numeroPases !== null && numeroPases !== '' 
    ? `HEMOS RESERVADO ( ${numeroPases} ) ${(parseInt(numeroPases) === 1 ? "PASE" : "PASES")}`
    : "HEMOS RESERVADO ( 1 ) PASE";

  function configurarTextoPases() {
    const contenedorPases = document.getElementById('LBxbkKyKLgDQym4n');
    if (contenedorPases) {
      const parrafos = contenedorPases.querySelectorAll('p');
      if (parrafos.length >= 2) {
        parrafos[0].querySelector('span').innerText = textoDinamicoPases;
        parrafos[0].querySelector('span').classList.add('efecto-luz-reluciente');
        parrafos[1].querySelector('span').classList.add('efecto-luz-reluciente');
      }
    } else {
      setTimeout(configurarTextoPases, 200);
    }
  }

  window.addEventListener('DOMContentLoaded', configurarTextoPases);
  setTimeout(configurarTextoPases, 500);
</script>

<script>
  const musica = document.getElementById('musica-boda');
  const btnMusica = document.getElementById('btn-musica');
  const iconOn = document.getElementById('icon-sound-on');
  const iconOff = document.getElementById('icon-sound-off');

  // Lógica de Doble Toque y revelación del texto oculto
  function inicializarDobleToqueCanva() {
    const contenedorID5 = document.getElementById('__id5');
    const enlaceInvitacion = document.querySelector('a._3zDNwA');
    const contenedorPases = document.getElementById('LBxbkKyKLgDQym4n');

    if (enlaceInvitacion && contenedorID5 && contenedorPases && !enlaceInvitacion.dataset.estadoToques) {
      enlaceInvitacion.dataset.estadoToques = "1"; // Estado inicial: espera primer click

      // Añadimos la clase de animación directamente al ID contenedor exacto proporcionado
      contenedorID5.id = "_id5_animado";

      const ejecutarAccionDobleClick = function(e) {
        e.preventDefault();
        const urlDestino = enlaceInvitacion.href;
        const estadoActual = enlaceInvitacion.dataset.estadoToques;

        if (estadoActual === "1") {
          // --- PRIMER CLICK ---
          // 1. Reproducir música para evitar restricciones de iOS
          musica.play().then(() => {
            actualizarIconos(false);
          }).catch((error) => {
            console.log("Restricción de audio en iOS:", error);
            actualizarIconos(true);
          });

          // 2. Mostrar el botón flotante de control de música
          btnMusica.style.display = 'flex';

          // 3. Revelar el bloque oculto "HEMOS RESERVADO ... PARA USTEDES"
          contenedorPases.classList.remove('bloque-pases-oculto');

          // 4. Cambiar estado a preparado para el segundo click
          enlaceInvitacion.dataset.estadoToques = "2";

          // Cambiar sutilmente el latido a más rápido para indicar que la invitación está abierta
          const elementoAnimado = document.getElementById('_id5_animado');
          if(elementoAnimado) elementoAnimado.style.animationDuration = '1s';

        } else if (estadoActual === "2") {
          // --- SEGUNDO CLICK ---
          window.open(urlDestino, '_blank');
        }
      };

      // Escuchar click en el elemento interactivo
      enlaceInvitacion.addEventListener('click', ejecutarAccionDobleClick);

      // Vincular también el bloque de texto revelado para que sirva como segundo click o toque de apertura
      contenedorPases.addEventListener('click', (e) => {
        ejecutarAccionDobleClick(e);
      });

    } else {
      setTimeout(inicializarDobleToqueCanva, 200);
    }
  }

  window.addEventListener('DOMContentLoaded', inicializarDobleToqueCanva);
  setTimeout(inicializarDobleToqueCanva, 500);

  // Control manual del botón flotante inferior derecho
  btnMusica.addEventListener('click', function() {
    if (musica.paused) { 
      musica.play(); 
      actualizarIconos(false); 
    } else { 
      musica.pause(); 
      actualizarIconos(true); 
    }
  });

  function actualizarIconos(estaPausado) {
    if (estaPausado) {
      iconOn.style.display = 'none';
      iconOff.style.display = 'block';
    } else {
      iconOn.style.display = 'block';
      iconOff.style.display = 'none';
    }
  }
</script>
