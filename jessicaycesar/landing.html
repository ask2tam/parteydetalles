  <style>

    /* Fuentes locales requeridas */
    @font-face {
      font-family: 'JessicaCesarNames';

    /* Bloqueo estricto del scroll hasta abrir el sobre */
    html.overlay-active, 
    html.overlay-active body {
      overflow: hidden !important;
      height: 100vh !important;
      position: fixed !important;
      width: 100vw !important;
    }

    /* Capa flotante principal (Composición alineada a la parte superior) */
    #hero-screen-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-start !important;
      align-items: center !important;
      background-color: #f7f5f0 !important;
      background-image: url('assets/fondo.jpg') !important;
      background-repeat: no-repeat !important;
      background-size: cover !important;
      background-position: center !important;
      transition: opacity 1.2s ease-in-out, filter 1.2s ease-in-out !important;
      font-family: 'JessicaCesarText', sans-serif !important;

    }

    #hero-screen-overlay.fade-out {

      transition: opacity 1.2s ease-in-out !important;
    }

    #hero-screen-overlay.loaded .header-content-overlay,
    #hero-screen-overlay.loaded .envelope-wrapper-overlay {
      opacity: 1 !important;
    }

    /* Tipografía de la Portada */
    .header-content-overlay {

    /* ========================================================================== */

        background-position: -150% -150%;

      }
      30% { 
        opacity: 0.8; 
      }

        opacity: 1; 
      }

        opacity: 0.8; 
      }

    .logo-shimmer-container {
      position: relative !important;
      display: inline-block !important;
      margin-bottom: 10% !important;
      margin-top: 10% !important;
    }

    .logo-shimmer-container::after {
      content: '' !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-image: linear-gradient(135deg, transparent 20%, rgba(255,255,255,0.3) 40%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0.3) 60%, transparent 80%) !important;
      background-size: 300% 300% !important;
      background-repeat: no-repeat !important;

      mask-image: url('assets/25da6e32e3e9cc248e8ef6c30790937d.png') !important;
      -webkit-mask-size: contain !important;
      mask-size: contain !important;
      -webkit-mask-repeat: no-repeat !important;
      mask-repeat: no-repeat !important;
      -webkit-mask-position: center !important;
      mask-position: center !important;

    .envelope-flap-back {
      position: absolute !important;
      top: -55% !important;
      left: 0% !important;
      width: 100% !important;
      height: 55% !important;

    /* ========================================================================== */
    /* SECCIÓN DEL SELLO AISLADO (Contenedor + Imagen)                             */
    /* ========================================================================== */
    .envelope-sello-container {
      position: absolute !important;
      bottom: 27% !important;
      left: 65% !important;
      transform: translateX(-50%) !important;
      width: 50% !important;
      height: auto !important;
      z-index: 6 !important;
      pointer-events: none !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-sello-container {
      animation: romperSelloContainer 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    .envelope-sello {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.18)) !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-sello {
      animation: romperSelloRotacion 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    @keyframes romperSelloContainer {
      0% {
        bottom: 27% !important;
        transform: translateX(-50%) !important;
        opacity: 1;
      }
      40% {
        bottom: calc(27% + 17px) !important;
        transform: translateX(-50%) !important;
        opacity: 0.9;
      }
      100% {
        bottom: calc(27% + 17px) !important;
        transform: translateX(-70%) !important;
        opacity: 0;
      }
    }

    @keyframes romperSelloRotacion {
      0% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 3px 6px rgba(0,0,0,0.18));
      }
      40% {
        transform: scale(1.2) rotate(-8deg);
      }
      100% {
        transform: scale(0.6) rotate(35deg);
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4));
      }
    }

    @keyframes heartbeatOverlay {
      0% { transform: scale(1); }
      15% { transform: scale(1.02); }
      30% { transform: scale(1); }
      45% { transform: scale(1.02); }
      60% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .envelope-wrapper-overlay.ready {
      animation: heartbeatOverlay 2.5s infinite ease-in-out !important;
    }

    .envelope-wrapper-overlay.opening-sequence {
      animation: none !important;
    }

    .btn-abrir-status-overlay {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      opacity: 1 !important;
      z-index: 10 !important;
      padding: 12px 28px !important;
      border-radius: 28px !important;
      background: rgb(173, 165, 155) !important;
      color: #ffffff !important;
      font-family: 'JessicaCesarText', sans-serif !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      letter-spacing: 2.5px !important;
      text-transform: uppercase !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15) !important;

    .btn-abrir-status-overlay.animating {

    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay,

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay:hover,
    .btn-abrir-status-overlay.ready-btn:hover {
      background: #736f68 !important;
    }

    .envelope-wrapper-overlay.opening-sequence ~ .btn-abrir-status-overlay {

    #btn-musica-overlay {

      bottom: 20px !important;

      z-index: 2147483647 !important;

<body>

  <button id="btn-musica-overlay" aria-label="Silenciar música">
    <svg id="icon-sound-on-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    <svg id="icon-sound-off-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
  </button>

  <!-- PORTADA OVERLAY -->
  <div id="hero-screen-overlay">
    <div class="hero-overlay-bg"></div>

    <header class="header-content-overlay">
      <div class="logo-shimmer-container">
        <img src="assets/25da6e32e3e9cc248e8ef6c30790937d.png" alt="Escudo J&C" class="logo-escudo-overlay">

      <div class="envelope-back-interior"></div>
      <div class="envelope-card">
        <span class="card-reserved-title efecto-luz-reluciente" id="card-seats-target" data-text="HEMOS RESERVADO ( 1 ) PASE">HEMOS RESERVADO ( 1 ) PASE</span>
        <span class="card-reserved-title efecto-luz-reluciente" id="card-seats-target-2" data-text="PARA USTEDES">PARA USTED</span>

  <!-- PEGA AQUÍ TODO EL CONTENIDO ORIGINAL QUE VIENE DE CANVA -->

  <script>
    // --- SCRIPT 1: OCULTAR INMEDIATAMENTE AL CARGAR EL DOM ---
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('LBg2Sz7y58w59hxw');
      el.getAnimations().forEach(anim => anim.cancel());
      el.style.opacity = '0';
      el.style.transform = 'translate(84.26px, 188.225px) scale(1, 1)';
    });

    // --- SCRIPT 2: LÓGICA DE APERTURA, AUDIO Y ANIMACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {

      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeWrapper = document.getElementById('envelope-wrapper-overlay');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const btnVerInvitacionFinal = document.getElementById('btn-ver-invitacion-final');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarImagen(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(url);
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      function obtenerPosicionBoton() {
        const rect = envelopeWrapper.getBoundingClientRect();
        return `${rect.top + (rect.height * 0.80)}px`;
      }
	  
      function pintarDatosEnTarjeta() {
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPases = urlParams.get('pase');
        const parsedPases = numeroPases !== null && numeroPases !== '' ? parseInt(numeroPases, 10) : 1;
        const esUnPase = isNaN(parsedPases) || parsedPases === 1;

        const textoDinamicoPases = `HEMOS RESERVADO ( ${isNaN(parsedPases) ? 1 : parsedPases} ) ${esUnPase ? "PASE" : "PASES"}`;
        const textoDestinatario = esUnPase ? "PARA USTED" : "PARA USTEDES";

        const seatsTarget = document.getElementById('card-seats-target');
        const seatsTarget2 = document.getElementById('card-seats-target-2');
        if (seatsTarget) {
          seatsTarget.innerText = textoDinamicoPases;
          seatsTarget.setAttribute('data-text', textoDinamicoPases);
        }
        if (seatsTarget2) {
          seatsTarget2.innerText = textoDestinatario;
          seatsTarget2.setAttribute('data-text', textoDestinatario);
        }
      }

      Promise.all([
        precargarImagen('assets/fondo.jpg'),
        precargarImagen('assets/sobre_adelante.png'),
        precargarImagen('assets/sobre_fondo.png'),
        precargarImagen('assets/solapa_frontal.png'),
        precargarImagen('assets/solapa_reverso.png'),
        precargarImagen('assets/25da6e32e3e9cc248e8ef6c30790937d.png'),
        precargarImagen('assets/sello.png'),
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve(),
      ]).then(() => {
	    pintarDatosEnTarjeta();
        heroScreen.classList.add('loaded');
        setTimeout(() => {
          btnAbrirText.classList.add('animating');
          void btnAbrirText.offsetHeight; 
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeWrapper.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 650);
        }, 2000);
      });
	  
      window.addEventListener('resize', () => {
        if (envelopeWrapper.classList.contains('ready')) {
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
        }
      });

      function abrirSobre(e) {
        if (!envelopeWrapper.classList.contains('ready')) return;
        if (e) e.stopPropagation();
        
        envelopeWrapper.classList.remove('ready');
        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        envelopeWrapper.classList.add('opening-sequence');
      }

	  function desplegarCanva(e) {
        if (e) e.stopPropagation();
        
        if (typeof reajustarLienzo === 'function') {
          reajustarLienzo();
        }

        setTimeout(() => {
          heroScreen.classList.add('fade-out');
          
          setTimeout(() => {
            heroScreen.remove();
            document.documentElement.classList.remove('overlay-active');
            window.scrollTo(0, 0);

			// Animación
			const el = document.getElementById('LBg2Sz7y58w59hxw');
			el.getAnimations().forEach(anim => anim.cancel());
			el.animate([
				{ opacity: 0, transform: 'translate(84.26px, 188.225px) scale(1, 1)' },
				{ opacity: 1, transform: 'translate(84.26px, 128.225px) scale(1, 1)' }
			], {
				duration: 4800,
				easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
				fill: 'forwards'
			});
			console.log("✨ Slide-up activado por scroll en #LBg2Sz7y58w59hxw");

          }, 1200);
          
        }, 400);
      }

      envelopeWrapper.addEventListener('click', abrirSobre);
      btnAbrirText.addEventListener('click', abrirSobre);
      btnVerInvitacionFinal.addEventListener('click', desplegarCanva);

      btnMusica.addEventListener('click', function(e) {
        e.stopPropagation();
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
