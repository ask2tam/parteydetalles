<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>María José & Manuel</title>
<link rel="icon" href="favicon.ico" type="image/x-icon"/>

  <style>
    @font-face {
      font-family: 'WeddingSansOverlay';
      src: url('assets/bcf845bc9976372da10183c67cc300c0.woff') format('woff');
      font-weight: 900; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingCursiveOverlay';
      src: url('assets/3a6ec30357a8b95ffef229e12d435f02.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingPassOverlay';
      src: url('assets/d03c54154a623d2ee20a92055206f9ee.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    html.overlay-active, 
    html.overlay-active body {
      overflow: hidden !important;
      height: 100vh !important;
      position: fixed !important;
      width: 100vw !important;
    }

    #hero-screen-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2147483647 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      background-color: #f5f0e6 !important;
      background-image: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, rgba(225, 215, 200, 0.2) 100%),
                        url('assets/fondo.png') !important;
      background-repeat: repeat !important;
      background-size: 300px !important;
      transition: opacity 1.6s ease-in-out, filter 1.6s ease-in-out !important;
      font-family: 'WeddingSansOverlay', sans-serif !important;
      color: #3b3a36 !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 15px 20px 20px 20px !important;
      gap: 14px !important;
    }

    #hero-screen-overlay.fade-out {
      opacity: 0 !important;
      filter: blur(6px) !important;
      pointer-events: none !important;
    }

    .header-top-overlay,
    .header-bottom-overlay,
    .envelope-container-overlay {
      opacity: 0 !important;
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out !important;
    }

    #hero-screen-overlay.loaded .header-top-overlay,
    #hero-screen-overlay.loaded .header-bottom-overlay,
    #hero-screen-overlay.loaded .envelope-container-overlay {
      opacity: 1 !important;
    }

    /* Textos Superiores (Nombres y Fecha con tamaño duplicado) */
    .header-top-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }

    #hero-screen-overlay.opening .header-top-overlay,
    #hero-screen-overlay.opening .header-bottom-overlay {
      opacity: 0 !important;
      transform: translateY(-10px) !important;
    }

    .main-title-overlay {
      font-family: 'WeddingCursiveOverlay', serif !important;
      font-size: 45px !important;
      line-height: 1.15 !important;
      font-weight: 400 !important;
      color: #4a5042 !important;
      margin: 0 !important;
      text-transform: none !important;
    }

    /* La letra ampersand (&) en su propia línea con la fuente de bcf845bc9976372da10183c67cc300c0.woff */
    .conjunction-y {
      font-family: 'WeddingSansOverlay', sans-serif !important;
      font-style: italic !important;
      font-weight: 900 !important;
      font-size: 30px !important;
      display: block !important;
      margin: 4px 0 !important;
      color: #5a5d55 !important;
    }

    .sub-date-overlay {
      font-family: 'WeddingSansOverlay', sans-serif !important;
      font-size: 20px !important;
      letter-spacing: 0.22em !important;
      color: #5a5d55 !important;
      margin-top: 8px !important;
      font-weight: 700 !important;
    }

    @media (min-width: 601px) {
      .main-title-overlay { font-size: 75px !important; }
      .conjunction-y { font-size: 45px !important; }
      .sub-date-overlay { font-size: 30px !important; }
    }

    /* Contenedor del Sobre Simple */
    .envelope-container-overlay {
      position: relative !important;
      z-index: 3 !important;
      width: 86% !important;
      max-width: 390px !important;
      margin: 6px 0 !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
    }

    .envelope-container-overlay.ready {
      cursor: pointer !important;
      pointer-events: auto !important;
    }

    .envelope-image-overlay {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      filter: drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.15)) !important;
      transform-origin: center center !important;
      will-change: transform, opacity !important;
    }

    /* Animaciones */
    @keyframes heartbeatOverlay {
      0% { transform: translateY(0) scale(1); }
      15% { transform: translateY(-4px) scale(1.02); }
      30% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-4px) scale(1.02); }
      60% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes zoomCinematicOverlay {
      0% { transform: scale(1); opacity: 1; filter: drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.15)); }
      50% { opacity: 0.8; }
      100% { transform: scale(22); opacity: 0; filter: drop-shadow(0px 0px 60px rgba(0, 0, 0, 0.4)) blur(8px); }
    }

    .envelope-container-overlay.ready .envelope-image-overlay {
      animation: heartbeatOverlay 2.5s infinite ease-in-out !important;
    }

    .envelope-container-overlay.zoom-envelope .envelope-image-overlay {
      animation: zoomCinematicOverlay 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    /* Texto Inferior con la fuente requerida y tamaño original */
    .header-bottom-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 6px !important;
      margin: 0 !important;
    }

	.pass-title-overlay, 
	#pass-text-overlay {
	  font-family: 'WeddingPassOverlay', sans-serif !important;
	  font-size: 16px !important;
	  letter-spacing: 0.2em !important;
	  color: #3b4035 !important;
	  text-transform: uppercase !important;
	  font-weight: 700 !important;
	  margin: 0 !important;
	}

    .pass-info-overlay {
      font-family: 'WeddingPassOverlay', sans-serif !important;
      font-size: 14px !important;
      letter-spacing: 0.2em !important;
      color: #3b4035 !important;
      text-transform: uppercase !important;
      font-weight: 700 !important;
      margin: 0 !important;
    }

    /* Botón de Apertura con tamaño original */
    .btn-abrir-status-overlay {
      position: fixed !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      opacity: 1 !important;
      z-index: 10 !important;
      padding: 12px 30px !important;
      border-radius: 30px !important;
      background: #5A6351 !important;
      color: #ffffff !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 2.5px !important;
      text-transform: uppercase !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.15) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      display: inline-block !important;
      text-align: center !important;
      white-space: nowrap !important;
      cursor: default !important;
      transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease !important;
    }

    .btn-abrir-status-overlay.moved-down {
      transform: translate(-50%, calc(39vh - env(safe-area-inset-bottom))) !important;
    }

    .envelope-container-overlay.ready ~ .btn-abrir-status-overlay,
    .btn-abrir-status-overlay.ready-btn {
      cursor: pointer !important;
    }

    .envelope-container-overlay.ready ~ .btn-abrir-status-overlay:hover,
    .btn-abrir-status-overlay.ready-btn:hover {
      background: #4A5341 !important;
    }

    .envelope-container-overlay.zoom-envelope ~ .btn-abrir-status-overlay {
      opacity: 0 !important;
      transform: translate(-50%, calc(39vh - env(safe-area-inset-bottom))) scale(0.95) !important;
      transition: opacity 0.4s ease, transform 0.4s ease !important;
    }

    #btn-musica-overlay {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 2147483647 !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background-color: #5A6351 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: white !important;
      display: none;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15) !important;
    }
  </style>

  <script>document.documentElement.classList.add('overlay-active');</script>
</head>
<body>

  <audio id="musica-boda-overlay" src="assets/musica.mp3" preload="auto" loop></audio>

  <button id="btn-musica-overlay" aria-label="Silenciar música">
    <svg id="icon-sound-on-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    <svg id="icon-sound-off-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
  </button>

  <div id="hero-screen-overlay">
    <!-- Nombres, el ampersand (&) en línea aparte con fuente bcf845bc y Fecha Arriba -->
    <header class="header-top-overlay">
      <h1 class="main-title-overlay">María José</h1>
      <span class="conjunction-y">&amp;</span>
      <h1 class="main-title-overlay">Manuel</h1>
      <p class="sub-date-overlay">09 . 01 . 27</p>
    </header>

    <!-- Sobre limpio sin elementos flotantes extra -->
    <div id="envelope-container-overlay" class="envelope-container-overlay">
      <img id="envelope-img-overlay" src="assets/sobre.png" alt="Sobre invitación" class="envelope-image-overlay">
    </div>

    <!-- Pases Abajo con fuente unificada y tamaño original -->
	<div class="header-bottom-overlay">
	  <p class="pass-title-overlay">HEMOS RESERVADO</p>
	  <p id="pass-text-overlay" class="pass-title-overlay">( 1 ) PASE PARA TI</p>
	</div>

    <span id="btn-abrir-text-overlay" class="btn-abrir-status-overlay">Cargando...</span>
  </div>

  <!-- PEGA AQUÍ TU CONTENIDO DE CANVA -->

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const numeroPase = urlParams.get('pase');
      
      if (numeroPase) {
        const passElement = document.getElementById('pass-text-overlay');
        passElement.innerText = `( ${numeroPase} ) PASE PARA TI`;
      }

      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeContainer = document.getElementById('envelope-container-overlay');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      Promise.all([
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]).then(() => {
        heroScreen.classList.add('loaded');

        setTimeout(() => {
          btnAbrirText.classList.add('moved-down');

          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeContainer.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 800);

        }, 2000);
      });

      function abrirInvitacion() {
        if (!envelopeContainer.classList.contains('ready')) return;

        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        heroScreen.classList.add('opening');
        envelopeContainer.classList.add('zoom-envelope');

        setTimeout(() => {
          heroScreen.classList.add('fade-out');
        }, 200);

        setTimeout(() => {
          heroScreen.remove();
          document.documentElement.classList.remove('overlay-active');
          window.scrollTo(0, 0);

          if (typeof window.iniciarEfectosTexto === 'function') {
            window.iniciarEfectosTexto();
          }
        }, 1600);
      }

      envelopeContainer.addEventListener('click', abrirInvitacion);
      btnAbrirText.addEventListener('click', abrirInvitacion);

      btnMusica.addEventListener('click', function() {
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
