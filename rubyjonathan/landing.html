    .envelope-sello-container {

      height: auto !important;

    }

    .envelope-wrapper-overlay.ready .envelope-sello-container {
      pointer-events: auto !important;
      cursor: pointer !important;
    }

    .envelope-sello {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) !important;
      transition: transform 0.2s ease !important;
    }

    .envelope-wrapper-overlay.ready .envelope-sello-container:hover .envelope-sello {
      transform: scale(1.08) !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-sello-container {
      animation: romperSelloContainer 1s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-sello {
      animation: romperSelloRotacion 1s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    @keyframes romperSelloContainer {
      0% {
        top: 15% !important;
        transform: translateX(-50%) !important;
        opacity: 1;
      }
      40% {
        top: calc(15% - 15px) !important;
        transform: translateX(-50%) !important;
        opacity: 0.9;
      }
      100% {
        top: calc(15% - 15px) !important;
        transform: translateX(-70%) !important;
        opacity: 0;
      }
    }

    @keyframes romperSelloRotacion {
      0% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      }
      40% {
        transform: scale(1.2) rotate(-8deg);
      }
      100% {
        transform: scale(0.6) rotate(35deg);
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4));
      }
    }

    .btn-abrir-status-overlay {

  <!-- PEGA AQUÍ TODO EL CONTENIDO ORIGINAL QUE VIENE DE CANVA -->


  <script>
  
	window.datosInvitadoGlobal = {
	  nombre: "Invitado Especial",
	  pases: 1,
	  asistencia: "",
	  mensaje: "",
	  encontrado: false
	};

	let googleFetchFinished = false; // 👈 Bandera para saber cuándo terminó Google

	const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxiEUwDCrZ75-lAraVsAkq5nv28bXUpvupxJctsr_I9k8ZiXE6DJEye0qp0mYmssTdLkA/exec";
	const urlParams = new URLSearchParams(window.location.search);
	const codigoInvitado = urlParams.get('to') || urlParams.get('invitado');

	// Promesa para el fetch de Google Sheets
	const promesaDatosGoogle = new Promise((resolve) => {
	  if (!codigoInvitado) {
		console.log("[RSVP] No hay código de invitado en la URL. Saltando fetch.");
		googleFetchFinished = true;
		resolve();
		return;
	  }
	  const urlFinal = `${WEB_APP_URL}?to=${encodeURIComponent(codigoInvitado)}`;
	  fetch(urlFinal)
		.then(res => {
		  console.log("[RSVP] Respuesta recibida del servidor. Status:", res.status);
		  return res.json();
		})
		.then(data => {
		  console.log("[RSVP] Datos JSON procesados con éxito:", data);
		  if (data.found) {
			window.datosInvitadoGlobal = {
			  nombre: data.nombre,
			  pases: data.pases || 1,
			  encontrado: true
			};
		  } else {
			console.log("[RSVP] El servidor respondió pero el invitado no fue encontrado.");
		  }
		  googleFetchFinished = true;
		  resolve();
		})
		.catch(err => {
		  console.error("[RSVP] ❌ Error crítico en el fetch o parseo JSON:", err);
		  googleFetchFinished = true;
		  resolve(); 
		});
	});

	// Promesa estricta SOLO para los elementos obligatorios de la tarjeta de portada
	const promesaElementosCriticos = new Promise((resolve) => {
	  const intervalCriticos = setInterval(() => {
		const cardTarget = document.getElementById('card-name-target');
		const seatsTarget = document.getElementById('card-seats-target');
		if (cardTarget && seatsTarget) {
		  clearInterval(intervalCriticos);
		  resolve();
		}
	  }, 200);
	});

	// Ocultar preventivamente tanto la foto principal como los contenedores de texto antes de animar
	document.addEventListener('DOMContentLoaded', () => {
		const hideStyleId = "console-hide-style";
		let styleSheet = document.getElementById(hideStyleId);
		if (!styleSheet) {
		  styleSheet = document.createElement("style");
		  styleSheet.id = hideStyleId;
		  document.head.appendChild(styleSheet);
		}
		
		// Agregamos todos los IDs separados por comas para ocultarlos simultáneamente
		styleSheet.innerHTML = `
		  #LB1CCVpSkRQXgV93, 
		  #LBQgLDqzkbnQxf9f, 
		  #LBhCv4LHX4984Rsz, 
		  #LBPmNSPVYsh81ZLx, 
		  #LBG2pTbzZpTkQfLc { 
			opacity: 0 !important; 
		  }
		`;
	});

    // LÓGICA DE APERTURA, AUDIO Y ANIMACIÓN
    document.addEventListener('DOMContentLoaded', () => {

      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeWrapper = document.getElementById('envelope-wrapper-overlay');
      const envelopeSelloContainer = document.querySelector('.envelope-sello-container');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const btnVerInvitacionFinal = document.getElementById('btn-ver-invitacion-final');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarImagen(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(url);
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      function obtenerPosicionBoton() {
        const rect = envelopeWrapper.getBoundingClientRect();
        return `${rect.top + (rect.height * 0.80)}px`;
      }
	  
	  function pintarDatosEnTarjeta() {
        const cardTarget = document.getElementById('card-name-target');
        const seatsTarget = document.getElementById('card-seats-target');
        const nombreFinal = window.datosInvitadoGlobal.encontrado ? window.datosInvitadoGlobal.nombre : "Invitado Especial";
        
        if (cardTarget) {
          cardTarget.innerText = nombreFinal;
          cardTarget.setAttribute('data-text', nombreFinal);
        }
        
        const pasesFinal = parseInt(window.datosInvitadoGlobal.pases, 10) || 1;
        const textoPases = pasesFinal > 1 ? `Pase para ( ${pasesFinal} ) persona` : `Pase para ( 1 ) persona`;
        if (seatsTarget) seatsTarget.innerText = textoPases;
      }

      Promise.all([
        precargarImagen('assets/fondo.png'),
        precargarImagen('assets/sobre_adelante.png'),
        precargarImagen('assets/sobre_fondo.png'),
        precargarImagen('assets/solapa_frontal.png'),
        precargarImagen('assets/solapa_reverso.png'),
        precargarImagen('assets/letra_y.png'),
        precargarImagen('assets/365d9e3a7a8d9119e7f48b5fe551d17c.png'),
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve(),					   
		promesaDatosGoogle,
		promesaElementosCriticos					   
      ]).then(() => {
	    pintarDatosEnTarjeta();								   
        heroScreen.classList.add('loaded');
        setTimeout(() => {
          btnAbrirText.classList.add('animating');
          void btnAbrirText.offsetHeight; 
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeWrapper.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 650);
        }, 2000);
      });
	  
      window.addEventListener('resize', () => {
        if (envelopeWrapper.classList.contains('ready')) {
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
        }
      });

      function abrirSobre(e) {
        if (!envelopeWrapper.classList.contains('ready')) return;
        if (e) e.stopPropagation();
        
        envelopeWrapper.classList.remove('ready');
        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        envelopeWrapper.classList.add('opening-sequence');
      }

	  function abrirSobre(e) {
        if (!envelopeWrapper.classList.contains('ready')) return;
        if (e) e.stopPropagation();
        
        // Enviar petición POST para registrar la visita en Google Sheets
        if (codigoInvitado) {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Evita problemas de CORS con Google Apps Script
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ to: codigoInvitado })
          }).catch(err => console.error("[RSVP] Error al registrar visita:", err));
        }

        envelopeWrapper.classList.remove('ready');
        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        envelopeWrapper.classList.add('opening-sequence');
      }

	  function desplegarCanva(e) {
        if (e) e.stopPropagation();
        
        if (typeof reajustarLienzo === 'function') {
          reajustarLienzo();
        }

        setTimeout(() => {
          heroScreen.classList.add('fade-out');
          
          setTimeout(() => {
            heroScreen.remove();
            document.documentElement.classList.remove('overlay-active');
            window.scrollTo(0, 0);

            // SCRIPT DE ANIMACIÓN DE EMERGENCIA 
            animaciondeentrada()

          }, 1200);
          
        }, 400);
      }

      btnAbrirText.addEventListener('click', abrirSobre);
      if (envelopeSelloContainer) {
        envelopeSelloContainer.addEventListener('click', abrirSobre);
      }
      btnVerInvitacionFinal.addEventListener('click', desplegarCanva);

      btnMusica.addEventListener('click', function(e) {
        e.stopPropagation();
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
