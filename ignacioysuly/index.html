  #rsvp-seccion > :not(.textura) { position: relative; z-index: 1; }
  .rsvp-cab { text-align: center; padding: 0 calc(24px * var(--esc)); }
  .rsvp-idiomas { display: inline-flex; margin-bottom: calc(14px * var(--esc)); border: 1px solid #b9b3ad; border-radius: 999px; overflow: hidden; }

  #rsvp { width: 100%; --rsvp-relleno: 0 calc(18px * var(--esc)) 0; }

     y la tarjeta se ubican en % de ese escenario, así quedan alineados en cualquier pantalla.
     ===================================================================================== -->
<template id="portada-plantilla">
<style>

  .gate *, .gate *::before, .gate *::after { box-sizing: border-box; }
  /* Franjas laterales (pantallas anchas): el mismo papel del sobre, ampliado y desenfocado */
  .bandas { position: absolute; inset: -40px; background: #f3f0ea url('assets/poster.jpg') center / cover no-repeat;

  #stage { position: absolute; left: 0; top: 0; container-type: inline-size; box-shadow: 0 0 60px rgba(60,50,40,.12); }

  #video { z-index: 1; background: transparent; }
  #poster { z-index: 2; }                       /* tapa el video hasta que pinte su primer fotograma: sin salto */
  #final { z-index: 3; opacity: 0; }            /* último fotograma: queda fijo al terminar (algunos Android ponen negro) */
  #final.ver { opacity: 1; }
  #poster.fuera { opacity: 0; transition: opacity .25s linear; }

  /* Sello: área táctil sobre el sello del fotograma 0 */
  #sello { position: absolute; z-index: 5; transform: translate(-50%, -50%); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%;
           background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
  #sello::after { content: ""; position: absolute; inset: 15%; border-radius: 50%; pointer-events: none;
                  border: 1px solid rgba(201,172,120,.95); box-shadow: 0 0 10px rgba(201,172,120,.55);
                  animation: onda 2.2s ease-out infinite; }
  @keyframes onda { from { transform: scale(1); opacity: .95; } to { transform: scale(1.45); opacity: 0; } }
  #sello:focus-visible { outline: 2px solid #8a7040; outline-offset: 4px; }
  /* "TOCA PARA ABRIR": oro con un reflejo que lo recorre */
  .pista { position: absolute; z-index: 5; left: 50%; transform: translate(-50%, -50%); margin: 0; padding: .8em 1.2em; cursor: pointer;
           font: 500 2.6cqw/1 'YAFdJi-0PQg_0', Georgia, serif; letter-spacing: .3em; text-indent: .3em; white-space: nowrap;

           background-size: 200% 100%, 100% 100%; background-repeat: no-repeat;
           -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
           filter: drop-shadow(0 1px 2px rgba(60,45,20,.25));
           animation: reluce 2.6s linear infinite; transition: opacity .3s; }
  @keyframes reluce { from { background-position: 125% 0, 0 0; } to { background-position: -25% 0, 0 0; } }

  .gate.lista #sello, .gate.lista .pista { opacity: 1; }
  .gate.abriendo #sello, .gate.abriendo .pista { opacity: 0; transition: opacity .25s; pointer-events: none; }
  .gate.abriendo #sello::after, .gate.abriendo .pista { animation: none; }

  .t-trat { margin-top: 4.4cqw; font: 400 4.8cqw/1.2 'YAFdJhX-538_0', Georgia, serif; letter-spacing: .18em; text-transform: uppercase; color: #4d4842; }
  .t-trat:empty { display: none; }
  .t-nombre { max-width: 100%; margin: 3cqw 0 3.2cqw; white-space: nowrap; font: 400 9.6cqw/1.12 'YAFdJhX-538_0', Georgia, serif; text-transform: uppercase; letter-spacing: .03em; color: #1E1B18; }
  .t-trat:empty + .t-nombre { margin-top: 5cqw; }
  .t-nombre.multilinea { white-space: normal; }
  .t-linea { display: block; width: 26%; height: 1px; background: rgba(42,38,34,.35); }
  .t-pases { margin-top: 3.4cqw; font: 400 4cqw/1.2 'YAFdJi-0PQg_0', Georgia, serif; letter-spacing: .2em; text-indent: .2em; text-transform: uppercase; color: #4d4842; }
  .t-ver { margin-top: 5.6cqw; padding: 1em 2.4em; border: 0; border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none;
           background: #BCB8B5; color: #1E1B18; font: 400 3.6cqw/1 'YAFdJi-0PQg_0', Georgia, serif; letter-spacing: .22em; text-indent: .22em; text-transform: uppercase;
           box-shadow: 0 3px 10px rgba(60,50,40,.18); transition: opacity 1s ease, transform .2s ease, background .2s ease; }

    return '<div class="pyd-contador" aria-live="off"><div class="tick" data-did-init="pydContadorInit" data-credits="false" aria-label="Cuenta regresiva">' +
      '<div data-repeat="true" data-layout="horizontal fit" data-transform="preset(d, h, m, s) -> delay">' +
      '<div class="tick-group"><div data-key="value" data-repeat="true" data-transform="pad(00) -> split -> delay"><span data-view="flip"></span></div>' +
      '<span data-key="label" data-view="text" class="tick-label"></span></div></div></div></div>';
  }
  function ponerContador() {
    var el = raices.a && raices.a.getElementById(CONFIG.contador.id);
    if (!el) return console.warn('[contador] No existe', CONFIG.contador.id);
    el.innerHTML = contadorHtml();
  }
  var ticks = [];
  window.pydContadorInit = function (tick) {
    var et = CONFIG.contador.etiquetas[lang] || CONFIG.contador.etiquetas.es;
    ['DAY', 'HOUR', 'MINUTE', 'SECOND'].forEach(function (k, i) { tick.setConstant(k + '_PLURAL', et[i]); tick.setConstant(k + '_SINGULAR', et[i]); });
    var c = Tick.count.down(new Date(CONFIG.contador.fecha), { format: ['d', 'h', 'm', 's'] });
    c.onupdate = function (v) { tick.value = v; };
    c.onended = function () { tick.value = [0, 0, 0, 0]; };
    ticks.push(tick);
  };
  function cargarScript(src) {
    return new Promise(function (res) {
      var s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = function () { console.warn('[libs] No se pudo cargar', src); res(); };
      document.head.appendChild(s);
    });
  }

  /* ---------------------------------------------------------------- tarea principal: Canva */
  function esperarImg(img) {
    return new Promise(function (res) {
      var ok = function () { (img.decode ? img.decode().catch(function () {}) : Promise.resolve()).then(res); };
      if (img.complete) ok(); else { img.addEventListener('load', ok, { once: true }); img.addEventListener('error', res, { once: true }); }
    });
  }
  var puertas = {}, abiertaInv = false, colaInv = [], regalos = null;
  var puertaInv = function (fn) { abiertaInv ? fn() : colaInv.push(fn); };
  window.addEventListener('invitacion:visible', function () { abiertaInv = true; colaInv.splice(0).forEach(function (f) { f(); }); }, { once: true });

  function tareaCanva() {
    return Promise.all([
      fetch(CONFIG.invitacion).then(function (r) { if (!r.ok) throw new Error(CONFIG.invitacion + ' → HTTP ' + r.status); return r.text(); }),
      fetch('assets/flip.min.css').then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; })
    ]).then(function (res) {
      avance('docs', 1); flipCss = res[1];
      var partes = partirCanva(res[0]);
      montar('a', 'inv-a', partes.a, partes.css);
      montar('b', 'inv-b', partes.b, partes.css);
      ponerContador();
      regalos = prepararRegalos(raices.b);
      $('fuentes-canva').textContent = Array.from(reglasFuente).join('\n');
      avance('montaje', .5);
      return new Promise(requestAnimationFrame);
    }).then(function () {
      var imgs = [].concat(Array.prototype.slice.call(raices.a.querySelectorAll('img')), Array.prototype.slice.call(raices.b.querySelectorAll('img')));
      var ni = 0, nf = 0;
      var tImgs = Promise.all(imgs.map(function (i) { return esperarImg(i).then(function () { avance('imgs', ++ni / imgs.length); }); }));
      if (!imgs.length) avance('imgs', 1);
      var faces = Array.from(document.fonts).filter(function (f) { return familias.has(f.family.replace(/["']/g, '')); });
      var tFuentes = Promise.all(faces.map(function (f) { return f.load().catch(function () {}).then(function () { avance('fuentes', ++nf / faces.length); }); }));
      if (!faces.length) avance('fuentes', 1);
      return Promise.all([tImgs, tFuentes, cargarScript('assets/flip.min.js').then(function () { avance('libs', 1); })]);
    }).then(function () {
      if (window.Tick && Tick.DOM && Tick.DOM.parse) Tick.DOM.parse(raices.a);
      ajustes.a = Responsive.montar(raices.a, { anchoOriginal: CONFIG.anchoCanva, anchoMaximo: CONFIG.anchoMaximo, modo: 'ancho' });
      ajustes.b = Responsive.montar(raices.b, { anchoOriginal: CONFIG.anchoCanva, anchoMaximo: CONFIG.anchoMaximo, modo: 'ancho' });
      ['a', 'b'].forEach(function (c) {
        var o = soloExistentes(raices[c], CONFIG.anim[c]);
        Animacion.montar(raices[c], Object.assign({ cuandoVisible: puertaInv }, o));
      });
      enlazarEventos();
      medirRsvp();
      return document.fonts && document.fonts.ready;
    }).then(function () {
      ajustes.a && ajustes.a.reajustar(); ajustes.b && ajustes.b.reajustar(); medirRsvp();
      avance('montaje', 1);
    });
  }
  // Cada lista solo con los ids que existen en esa mitad (evita avisos falsos de animacion.js)
  function soloExistentes(raiz, o) {
    var r = {}, falt = [];
    Object.keys(o).forEach(function (k) {
      if (!Array.isArray(o[k])) { r[k] = o[k]; return; }
      r[k] = o[k].filter(function (x) { var id = typeof x === 'string' ? x : x.id, ok = !!raiz.getElementById(id); if (!ok) falt.push(id); return ok; });
    });
    if (falt.length) console.warn('[animacion] ids que no existen en esta parte:', falt);
    return r;
  }
  // El RSVP mide lo mismo que el lienzo escalado: --ancho-canva y --esc siguen al responsive
  function medirRsvp() {
    var w = Math.min($('inv-a').clientWidth || document.documentElement.clientWidth, CONFIG.anchoMaximo);
    document.documentElement.style.setProperty('--ancho-canva', w + 'px');
    document.documentElement.style.setProperty('--esc', (w / CONFIG.anchoCanva).toFixed(4));
  }
  window.addEventListener('resize', medirRsvp);

  /* ---------------------------------------------------------------- carga total */
  var tareaLoad = new Promise(function (res) { if (document.readyState === 'complete') res(); else window.addEventListener('load', res, { once: true }); });
  var tareaDatos = Promise.race([cargarDatos(), new Promise(function (r) { setTimeout(r, DATOS_MAX_MS); })]).then(function () { avance('datos', 1); pintarTarjeta(); });
  Promise.race([
    Promise.all([tareaCanva(), tareaVideo, tareaDatos, tareaLoad]),
    new Promise(function (res) { setTimeout(res, LIMITE_MS); })
  ]).catch(function (e) {
    console.error('[carga]', e);
    $('cargador-txt').textContent = 'No se pudo cargar. Abre la página desde un servidor (http/https), no con doble clic.';
    throw e;
  }).then(function () { Object.keys(T).forEach(function (k) { avance(k, 1); }); }, function () {});

  var circ = $('anillo-avance'), pctTxt = $('anillo-pct'), C = 2 * Math.PI * 46;
  circ.style.strokeDasharray = C.toFixed(2); circ.style.strokeDashoffset = C.toFixed(2);
  var t0 = Date.now(), mostrado = 0;
  (function tick() {
    var obj = total();
    mostrado = Math.min(obj, mostrado + Math.max(.004, (obj - mostrado) * .08));
    circ.style.strokeDashoffset = (C * (1 - mostrado)).toFixed(2);
    pctTxt.textContent = Math.round(mostrado * 100) + '%';
    if (mostrado >= .999 && Date.now() - t0 >= MIN_MS) {
      circ.style.strokeDashoffset = '0'; pctTxt.textContent = '100%';
      setTimeout(function () {
        $('cargador').classList.add('fuera');
        encuadre(); pintarTarjeta();
        setTimeout(function () { gate.classList.add('lista'); }, 300);
        setTimeout(function () { var c = $('cargador'); c && c.parentNode && c.parentNode.removeChild(c); }, 1000);
      }, 280);
      return;
    }
    requestAnimationFrame(tick);
  })();

  /* ---------------------------------------------------------------- SECUENCIA: sello → video → tarjeta → invitación */
  var started = false, tarjetaVista = false, saliendo = false, intentos = 0, safety = 0, stall = 0;
  function abrirSobre() {
    if (started || !gate.classList.contains('lista')) return;
    started = true; intentos++;
    if (videoFallo) { gate.classList.add('abriendo'); return mostrarTarjeta(true); }
    var vp;
    try { video.currentTime = 0; } catch (e) {}
    video.muted = !V.sonido;
    try { vp = video.play(); } catch (e) { vp = Promise.reject(e); }     // primero, y dentro del gesto (iPhone)
    gate.classList.add('abriendo');
    Promise.resolve(vp).catch(function (e) {
      if (!video.muted) { video.muted = true; return video.play(); }       // sonido bloqueado: sigue en silencio
      throw e;
    }).catch(function () {
      clearTimeout(stall); clearTimeout(safety);
      if (intentos < 2) { started = false; gate.classList.remove('abriendo'); pista.textContent = tx('abrirOtra'); }   // iOS a veces pide un 2.º toque
      else mostrarTarjeta(true);
    });
    clearTimeout(stall); clearTimeout(safety);
    stall = setTimeout(function () { if (!tarjetaVista && video.currentTime < .05) mostrarTarjeta(true); }, 5000);
    safety = setTimeout(function () { mostrarTarjeta(true); }, V.maxMs);
  }
  sello.addEventListener('click', abrirSobre);
  pista.addEventListener('click', abrirSobre);
  // El póster se retira cuando el video ya pintó su primer fotograma (sin parpadeo negro)
  video.addEventListener('timeupdate', function () { if (video.currentTime > .04) poster.classList.add('fuera'); });
  video.addEventListener('timeupdate', function () {
    if (started && !tarjetaVista && video.duration && video.duration - video.currentTime <= V.tarjetaAntes) mostrarTarjeta(false);
  });
  video.addEventListener('ended', function () { imgFinal.classList.add('ver'); mostrarTarjeta(false); });
  video.addEventListener('error', function () { if (started) mostrarTarjeta(true); });

  function mostrarTarjeta(sinVideo) {
    if (tarjetaVista) return; tarjetaVista = true;
    clearTimeout(stall); clearTimeout(safety);
    if (sinVideo) { try { video.pause(); } catch (e) {} imgFinal.classList.add('ver'); poster.classList.add('fuera'); }
    pintarTarjeta();
    tarjeta.classList.add('ver');
    btnVer.tabIndex = 0;
    setTimeout(ajustarNombre, 60);
  }
  tarjeta.addEventListener('click', function () { if (tarjeta.classList.contains('ver')) verInvitacion(); });

  /* Fundido portada → invitación (fotograma a fotograma, opacidad en línea: nada la pisa) */
  var suave = function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; };
  function animar(ms, paso, fin) {
    var ini = performance.now(), hecho = false;
    var terminar = function () { if (hecho) return; hecho = true; paso(1); fin && fin(); };
    (function f(now) { if (hecho) return; var p = Math.min(1, (now - ini) / ms); paso(suave(p)); if (p < 1) requestAnimationFrame(f); else terminar(); })(ini);
    setTimeout(terminar, ms + 1500);
  }
  function verInvitacion() {
    if (saliendo) return; saliendo = true;
    medirRsvp(); ajustes.a && ajustes.a.reajustar(); ajustes.b && ajustes.b.reajustar();
    var inv = $('invitacion'); inv.classList.add('visible'); inv.removeAttribute('aria-hidden');
    hostP.style.setProperty('pointer-events', 'none', 'important');
    var revelado = false;
    animar(CONFIG.salida.ms, function (p) {
      hostP.style.setProperty('opacity', (1 - p).toFixed(4), 'important');
      if (!revelado && p >= CONFIG.salida.revelarEn) { revelado = true; revelar(); }
    }, function () {
      if (!revelado) revelar();
      try { video.pause(); } catch (e) {}
      hostP.parentNode && hostP.parentNode.removeChild(hostP);
    });
  }
  function revelar() {
    document.documentElement.classList.remove('bloqueado');
    window.scrollTo(0, 0);
    window.__invitacionVisible = true;
    window.dispatchEvent(new Event('invitacion:visible'));    // arranca animacion.js en las dos mitades
    animarCabeceraRsvp();
    creditoAlFinal();
  }
  /* El crédito ("Hecho con amor") no aparece al abrir: se muestra solo cuando el invitado llega al final de la invitación */
  function creditoAlFinal() {
    var fin = document.querySelector('#invitacion [data-credito]');
    if (!fin || !P.credito || modoCredito === 'oculto' || !window.IntersectionObserver) return;
    fin.style.minHeight = '1px';
    var io = new IntersectionObserver(function (en) {
      if (!en.some(function (e) { return e.isIntersecting; })) return;
      io.disconnect();
      window.PYD_SIN_CREDITO = false;
      P.credito({ modo: modoCredito, lang: lang });
    });
    io.observe(fin);
  }

  /* ---------------------------------------------------------------- RSVP nativo: cabecera, idioma y crédito */
  var modoCredito = 'flotante';
  function animarCabeceraRsvp() {
    var els = document.querySelectorAll('#rsvp-seccion .rsvp-anim');
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: .3 });
    els.forEach(function (e) { io.observe(e); });
  }
  function aplicarIdioma(l) {
    lang = TXT[l] ? l : 'es';
    document.documentElement.lang = lang;
    document.querySelectorAll('#rsvp-idiomas button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === lang)); });
    pintarTarjeta();
    regalos && regalos.idioma();
    var et = CONFIG.contador.etiquetas[lang] || CONFIG.contador.etiquetas.es;
    ticks.forEach(function (t) { ['DAY', 'HOUR', 'MINUTE', 'SECOND'].forEach(function (k, i) { t.setConstant(k + '_PLURAL', et[i]); t.setConstant(k + '_SINGULAR', et[i]); }); t.redraw && t.redraw(); });
  }
  window.addEventListener('rsvp:idioma', function (e) { aplicarIdioma(e.detail); });
  window.addEventListener('rsvp:proyecto', function (e) {
    var p = e.detail || {};
    modoCredito = p.credito || 'flotante';
    $('rsvp-idiomas').hidden = String(p.idioma || 'es').split(',').length < 2;
  });
  $('rsvp-idiomas').addEventListener('click', function (e) { var b = e.target.closest('[data-l]'); if (b && window.RSVP_IDIOMA) RSVP_IDIOMA.cambiar(b.dataset.l); });

  /* ---------------------------------------------------------------- enlaces dentro de Canva */
  function enlazarEventos() {
    ['a', 'b'].forEach(function (c) {
      raices[c].addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a'), h = a ? a.getAttribute('href') || '' : '';
        var dest = CONFIG.enlaces.find(function (x) { return e.target.closest && e.target.closest('#' + x.id); });
        if (dest) { e.preventDefault(); if (dest.accion === 'regalos' && regalos) regalos.voltear(true); else if (dest.url) window.open(dest.url, '_blank', 'noopener'); return; }
        if (a && h.charAt(0) === '#') e.preventDefault();                 // anclas internas del export (#page-1…)
      });
    });
  }
})();
</script>
