<style>
  :root { --crema: #FFFBF4; --tinta: #1E1B18; --gris: #BCB8B5; --suave: #7E7A76;
          --ancho-canva: min(100vw, 700px); --esc: 1; }

                  background: rgb(255, 251, 244); padding: calc(46px * var(--esc)) 0 calc(40px * var(--esc)); }
  /* opacity .6 = igual que el papel de las secciones de Canva; el 3 % vertical oculta la franja gris plana que trae el borde superior de la imagen */

                  padding: 11px 20px 7px; border-radius: 22px; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .9s ease; color: #fff;
                  background: rgba(34, 30, 26, .46); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 6px 22px rgba(0,0,0,.18); }   /* fondo translúcido: se lee sobre la foto y sobre el papel claro */

  #pista-scroll .ps-fl { position: relative; display: block; width: 22px; height: 26px; }

                           transform: rotate(45deg); opacity: 0; animation: ps-baja 1.9s ease-in-out infinite; }
  #pista-scroll .ps-fl i:nth-child(2) { animation-delay: .28s; }
  @keyframes ps-baja { 0% { opacity: 0; transform: translateY(-5px) rotate(45deg); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(13px) rotate(45deg); } }

  /* ---------- Portada (sobre en HTML/CSS/JS) ---------- */

  /* ---------- Pantalla de carga ---------- */

<!-- =====================================================================================
     PORTADA EN SHADOW DOM: ningún estilo de Canva ni del RSVP la alcanza (ni ella a ellos).
     El sobre se arma con imágenes PNG + CSS + JS (sin video). El escenario (#stage) mide 640 × 1392 de referencia:
     cabecera, sobre, sello y pista se ubican en % de ese escenario, así quedan alineados en cualquier pantalla.
     El sobre sigue el esquema del proyecto de ejemplo: capas (fondo · tarjeta · frente) + solapa que gira (exterior→interior)
     + sello que se despega + tarjeta que sube; más un «movimiento de cámara» (la cabecera sube y el sobre baja y se acerca).
     ===================================================================================== -->
<template id="portada-plantilla">
<style>
  :host { all: initial; display: block; position: fixed; inset: 0; }
  .gate { position: absolute; inset: 0; overflow: hidden; background: #f3f0ea url('assets/portada_fondo.jpg') center / cover no-repeat; font-synthesis: none;
          -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
          /* tiempos de la apertura (los pone CONFIG.sobre.tiempos) */
          --t-solapa: .9s; --t-reverso: .9s; --d-tarjeta: 1.8s; --t-tarjeta: 1.2s; --d-camara: 1.7s; --t-camara: 1.9s; --d-cab: .6s; --t-cab: 1.5s; --d-boton: 3s; --d-titulo: .35s; --t-titulo: 2.4s; }
  .gate *, .gate *::before, .gate *::after { box-sizing: border-box; }
  #stage { position: absolute; left: 0; top: 0; container-type: inline-size; }

  /* ---------- Cabecera: imagen «NUESTRA BODA · IGNACIO & SULY» (assets/logo_portada_hd.png, fondo transparente) ----------
     Aparece de izquierda a derecha con una máscara que se desliza (-webkit-mask para Safari/iPhone). La imagen mide 74 % del ancho del escenario. */
  .cab { position: absolute; inset: 0; pointer-events: none; transform: translateY(0);
         transition: transform var(--t-cab) cubic-bezier(.45,.05,.25,1) var(--d-cab); }
  .gate.abierto .cab { transform: translateY(-42.5cqw); }
  .cab-h { position: absolute; left: 50%; top: 28.6%; width: 74%; margin: 0; transform: translateX(-50%); }
  .cab-logo { display: block; width: 100%; height: auto; -webkit-user-drag: none;
              -webkit-mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 58.3%, transparent 100%);
                      mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 58.3%, transparent 100%);
              -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
              -webkit-mask-position: 100% 0; mask-position: 100% 0; }
  .gate.lista .cab-logo { -webkit-mask-position: 0 0; mask-position: 0 0;
              transition: -webkit-mask-position var(--t-titulo) cubic-bezier(.45,.05,.2,1) var(--d-titulo), mask-position var(--t-titulo) cubic-bezier(.45,.05,.2,1) var(--d-titulo); }

  /* ---------- El sobre ---------- */
  .cam-pos { position: absolute; left: 9.0625%; width: 81.5625%; top: 41.164%; }
  .cam { transform-origin: 50% 100%; opacity: 0;
         transition: opacity 1.2s ease, transform var(--t-camara) cubic-bezier(.45,.05,.25,1) var(--d-camara); }
  .gate.lista .cam { opacity: 1; }
  .gate.abierto .cam { transform: translateY(47%) scale(1.21); }            /* la «cámara» baja y se acerca: 170 px de referencia y 121 % */
  .env { position: relative; width: 100%; aspect-ratio: 1.44 / 1; }
  .env.listo { animation: latido 2.5s infinite ease-in-out; }
  @keyframes latido { 0% { transform: scale(1); } 15% { transform: scale(1.02); } 30% { transform: scale(1); } 45% { transform: scale(1.02); } 60% { transform: scale(1); } 100% { transform: scale(1); } }

  .capa { position: absolute; left: 0; top: -66%; width: 100%; height: 166%; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; }
  .fondo  { background-image: url('assets/sobre_fondo.webp'); z-index: 1; }
  .frente { background-image: url('assets/sobre_adelante.webp'); z-index: 4; filter: drop-shadow(0 6px 9px rgba(70,60,45,.20)); }

  /* Solapa: exterior (cerrada, hacia abajo) → de canto a los 90° → interior (abierta, hacia arriba) */
  .solapa, .solapa-rev { position: absolute; left: 0; width: 100%; top: -73%; height: 73%; background-size: 100% 100%; background-repeat: no-repeat; transform-origin: 50% 100%; pointer-events: none; }
  .solapa { background-image: url('assets/solapa_frontal.webp'); z-index: 5; filter: drop-shadow(3px -4px 4px rgba(46,36,22,.42));   /* el filtro se aplica antes del giro (rotateX 180°): el desplazamiento vertical va invertido → la sombra cae abajo a la derecha */
            transform: perspective(1500px) rotateX(180deg); opacity: 1;
            transition: transform var(--t-solapa) cubic-bezier(.4,0,.2,1), opacity .1s linear calc(var(--t-solapa) - .05s); }
  .gate.abierto .solapa { transform: perspective(1500px) rotateX(90deg); opacity: 0; }
  .solapa-rev { background-image: url('assets/solapa_reverso.webp'); z-index: 2; filter: drop-shadow(0 4px 6px rgba(60,45,30,.18));
                transform: perspective(1500px) rotateX(90deg) scaleY(.86); opacity: 0;
                transition: transform var(--t-reverso) cubic-bezier(.4,0,.2,1) var(--t-solapa), opacity .1s linear var(--t-solapa); }
  .gate.abierto .solapa-rev { transform: perspective(1500px) rotateX(0deg) scaleY(.86); opacity: 1; }

  /* Sello: se despega, se levanta un poco y cae a la esquina inferior derecha del sobre */
  .sello-caja { position: absolute; left: 51.34%; top: 65.5%; width: 22.4%; z-index: 6; transform: translate(-50%, -50%); pointer-events: none; }
  .sello-lat { width: 100%; transform-origin: 50% 50%; }
  .sello-img { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 5px rgba(60,45,30,.28)); }
  /* Latido del sello: dos pulsos seguidos (el segundo más suave) y reposo. Lo activa CONFIG.sobre.latido.sello (clase .lat-sello del contenedor);
     escala y duración salen de CONFIG.sobre.latido (--lat-esc / --lat-ciclo). Corre siempre, aunque el sistema pida reducir movimiento. */
  .gate.lat-sello:not(.abierto) .sello-lat { animation: sello-latido var(--lat-ciclo, 1.7s) infinite ease-in-out; }
  @keyframes sello-latido {
    0%   { transform: scale(1); }
    12%  { transform: scale(var(--lat-esc, 1.1)); }
    24%  { transform: scale(1); }
    36%  { transform: scale(var(--lat-esc2, 1.07)); }
    52%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .gate.abierto .sello-caja { animation: romper-caja .95s cubic-bezier(.25,1,.5,1) forwards; }
  .gate.abierto .sello-img { animation: romper-img .95s cubic-bezier(.25,1,.5,1) forwards; }
  @keyframes romper-caja {
    0%   { transform: translate(-50%, -50%); }
    30%  { transform: translate(-50%, -62%); }
    100% { transform: translate(calc(-50% + 164%), calc(-50% + 117%)); }
  }
  @keyframes romper-img {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.16) rotate(-7deg); filter: drop-shadow(0 12px 12px rgba(60,45,30,.38)); }
    100% { transform: scale(.84) rotate(22deg); filter: drop-shadow(0 3px 5px rgba(60,45,30,.28)); }
  }

  /* Área táctil (invisible) sobre el sello + «TOCA PARA ABRIR». Sin círculo: el que invita al toque es el propio sello, que late (ver .sello-lat) */
  #sello { position: absolute; z-index: 8; transform: translate(-50%, -50%); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%;
           background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
  #sello:focus-visible { outline: 2px solid #1E1B18; outline-offset: 4px; }
  .pista { position: absolute; z-index: 8; left: 50%; transform: translate(-50%, -50%); margin: 0; padding: .8em 1.2em; cursor: pointer;
           font: 500 2.6cqw/1 'YAFdJi-0PQg_0', Georgia, serif; letter-spacing: .3em; text-indent: .3em; white-space: nowrap;
           background: linear-gradient(105deg, transparent 36%, rgba(118,112,104,.85) 45%, #8a847b 50%, rgba(118,112,104,.85) 55%, transparent 64%),
                       linear-gradient(105deg, #1E1B18 0%, #1E1B18 100%);
           background-size: 200% 100%, 100% 100%; background-repeat: no-repeat;
           -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
           filter: drop-shadow(0 1px 2px rgba(30,27,24,.14));
           animation: reluce 2.6s linear infinite; transition: opacity .3s; }
  @keyframes reluce { from { background-position: 125% 0, 0 0; } to { background-position: -25% 0, 0 0; } }
  #sello, .pista { opacity: 0; transition: opacity .9s ease .5s; }
  .gate.lista #sello, .gate.lista .pista { opacity: 1; }
  .gate.abriendo #sello, .gate.abriendo .pista { opacity: 0; transition: opacity .25s; pointer-events: none; }
  .gate.abriendo .pista { animation: none; }

  /* ---------- La tarjeta: sube del sobre y trae los datos del invitado ---------- */
  .tarjeta { position: absolute; z-index: 3; left: 12%; width: 76%; top: 13%; height: 84%; container-type: inline-size;
             background: url('assets/tarjeta.webp') 0 0 / 100% 100% no-repeat; filter: drop-shadow(0 6px 8px rgba(60,46,32,.16));
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             padding: 6.6% 7.6% 6.8%; text-align: center; color: #2a2622; cursor: pointer;
             transition: transform var(--t-tarjeta) cubic-bezier(.25,1,.5,1) var(--d-tarjeta); }

  .gate.abierto .tarjeta > * { opacity: 1; transform: none; }
  .gate.abierto .tarjeta > :nth-child(1) { transition-delay: calc(var(--d-tarjeta) + .35s); } .gate.abierto .tarjeta > :nth-child(2) { transition-delay: calc(var(--d-tarjeta) + .5s); }
  .gate.abierto .tarjeta > :nth-child(3) { transition-delay: calc(var(--d-tarjeta) + .65s); } .gate.abierto .tarjeta > :nth-child(4) { transition-delay: calc(var(--d-tarjeta) + .8s); }
  .gate.abierto .tarjeta > :nth-child(5) { transition-delay: calc(var(--d-tarjeta) + .9s); } .gate.abierto .tarjeta > :nth-child(6) { transition-delay: calc(var(--d-tarjeta) + 1.1s); }
  .t-etiqueta { font: 400 3.9cqw/1.2 'YAFdJi-0PQg_0', Georgia, serif; letter-spacing: .28em; text-indent: .28em; text-transform: uppercase; color: #7E7A76; }
  .t-trat { margin-top: 4.4cqw; font: 400 4.8cqw/1.2 'YAFdJhX-538_0', Georgia, serif; letter-spacing: .18em; text-transform: uppercase; color: #4d4842; }

  var invListo = false, invFallo = null, tareaInv = null;
  function iniciarInvitacion() {
    if (tareaInv) return tareaInv;
    tareaInv = tareaCanva().then(function () {
      invListo = true;
      cargarScripts([P.ruta('qr'), P.ruta('rsvp')]);                  // el RSVP queda para el final: está debajo de la 1.ª pantalla y no debe competir con ella
    }, function (e) { invFallo = e; console.error('[carga] invitación:', e); btnVer.textContent = tx('reintentar'); throw e; });
    return tareaInv;
  }
  function tareaCanva() {
    return fetch(CONFIG.invitacion).then(function (r) { if (!r.ok) throw new Error(CONFIG.invitacion + ' → HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      return enReposo(function () { var partes = partirCanva(html); montar('a', 'inv-a', partes.a, partes.css); return partes; });
    }).then(function (partes) {
      return enReposo(function () {
        montar('b', 'inv-b', partes.b, partes.css);
        ponerContador();
        regalos = prepararRegalos(raices.b);
        $('fuentes-canva').textContent = unirFuentes(Array.from(reglasFuente)).join('\n');
        return new Promise(requestAnimationFrame);
      });
    }).then(function () {
      /* Para abrir solo hace falta lo que se ve primero: las 2 primeras secciones y las tipografías. El resto de imágenes sigue bajando. */
      var arriba = Array.prototype.slice.call(raices.a.querySelectorAll('section'), 0, 2), imgs = [];
      arriba.forEach(function (sec) { imgs = imgs.concat(Array.prototype.slice.call(sec.querySelectorAll('img'))); });
      var tImgs = Promise.all(imgs.map(esperarImg));
      /* Solo las caras «normal»: las «italic» del export apuntan al mismo archivo y bajarlo dos veces no aporta nada (si hubiera cursiva, baja al usarse) */
      var faces = Array.from(document.fonts).filter(function (f) { return f.style === 'normal' && familias.has(f.family.replace(/["']/g, '')); });
      var tFuentes = Promise.all(faces.map(function (f) { return f.load().catch(function () {}); }));
      return Promise.all([tImgs, tFuentes]);
    }).then(function () {
      ajustes.a = Responsive.montar(raices.a, { anchoOriginal: CONFIG.anchoCanva, anchoMaximo: CONFIG.anchoMaximo, modo: 'ancho', selectorPaginaCanva: CONFIG.canva.selectorPagina });
      ajustes.b = Responsive.montar(raices.b, { anchoOriginal: CONFIG.anchoCanva, anchoMaximo: CONFIG.anchoMaximo, modo: 'ancho', selectorPaginaCanva: CONFIG.canva.selectorPagina });
      ['a', 'b'].forEach(function (c) {
        var o = soloExistentes(raices[c], CONFIG.anim[c]);
        Animacion.montar(raices[c], Object.assign({ cuandoVisible: puertaInv, selectorTexto: CONFIG.canva.selectorTexto }, o));
      });
      enlazarEventos();
      medirRsvp();
      return document.fonts && document.fonts.ready;
    }).then(function () {
      ajustes.a && ajustes.a.reajustar(); ajustes.b && ajustes.b.reajustar(); medirRsvp();
    });
  }
  // Cada lista solo con los ids que existen en esa mitad (evita avisos falsos de animacion.js)
  function soloExistentes(raiz, o) {
    var r = {}, falt = [];
    Object.keys(o).forEach(function (k) {
      if (!Array.isArray(o[k])) { r[k] = o[k]; return; }
      r[k] = o[k].filter(function (x) { var id = typeof x === 'string' ? x : x.id, ok = !!raiz.getElementById(id); if (!ok) falt.push(id); return ok; });
    });
    if (falt.length) console.warn('[animacion] ids que no existen en esta parte:', falt);
    return r;
  }
  // El RSVP mide lo mismo que el lienzo escalado: --ancho-canva y --esc siguen al responsive
  function medirRsvp() {
    var w = Math.min($('inv-a').clientWidth || document.documentElement.clientWidth, CONFIG.anchoMaximo);
    document.documentElement.style.setProperty('--ancho-canva', w + 'px');
    document.documentElement.style.setProperty('--esc', (w / CONFIG.anchoCanva).toFixed(4));
  }
  window.addEventListener('resize', medirRsvp);

  /* ---------------------------------------------------------------- carga: SOLO lo indispensable para mostrar el sobre */
  var pDatos = cargarDatos().then(idiomaInicial).then(function () { pintarTarjeta(); });          // si llegan tarde, la tarjeta se actualiza sola
  var tareaDatos = Promise.race([pDatos, new Promise(function (r) { setTimeout(r, DATOS_MAX_MS); })]).then(function () { avance('datos', 1); });
  Promise.race([
    Promise.all([tareaVideo, tareaFuentes, tareaDatos]),
    new Promise(function (res) { setTimeout(res, LIMITE_MS); })
  ]).then(function () { Object.keys(T).forEach(function (k) { avance(k, 1); }); });

  var circ = $('anillo-avance'), pctTxt = $('anillo-pct'), C = 2 * Math.PI * 46;
  circ.style.strokeDasharray = C.toFixed(2); circ.style.strokeDashoffset = C.toFixed(2);
  var t0 = Date.now(), mostrado = 0;
  (function tick() {
    var obj = total();
    mostrado = Math.min(obj, mostrado + Math.max(.004, (obj - mostrado) * .08));
    circ.style.strokeDashoffset = (C * (1 - mostrado)).toFixed(2);
    pctTxt.textContent = Math.round(mostrado * 100) + '%';
    if (mostrado >= .999 && Date.now() - t0 >= MIN_MS) {
      circ.style.strokeDashoffset = '0'; pctTxt.textContent = '100%';
      setTimeout(function () {
        $('cargador').classList.add('fuera');
        encuadre(); pintarTarjeta();
        setTimeout(function () {
          gate.classList.add('lista');
          setTimeout(function () {                                          // cuando ya se ve todo, empieza a latir lo que esté activado en CONFIG.sobre.latido
            if (abierta) return;
            if (L.sello) gate.classList.add('lat-sello');
            if (L.sobre) env.classList.add('listo');
          }, 1300);
        }, 300);
        setTimeout(iniciarInvitacion, 450);                                   // ya se ve el sobre: ahora sí, la invitación en segundo plano
        setTimeout(function () { var c = $('cargador'); c && c.parentNode && c.parentNode.removeChild(c); }, 1000);
      }, 280);
      return;
    }
    requestAnimationFrame(tick);
  })();

  /* ---------------------------------------------------------------- SECUENCIA: toque → apertura del sobre → tarjeta → invitación */
  var abierta = false, tarjetaVista = false, saliendo = false;
  gate.addEventListener('transitionend', function () {});     // (reservado)
  function abrirSobre() {
    if (abierta || !gate.classList.contains('lista')) return;
    abierta = true;
    gate.classList.add('abriendo');
    /* Los latidos se detienen suavemente (sin «salto» de escala) en el instante del toque */
    var pararLatido = function (nodo, activo) {
      var m = getComputedStyle(nodo).transform; activo();
      if (m && m !== 'none') { nodo.style.transform = m; void nodo.offsetWidth; nodo.style.transition = 'transform .28s ease'; nodo.style.transform = 'none'; }
    };
    pararLatido(selloLat, function () { gate.classList.remove('lat-sello'); });
    pararLatido(env, function () { env.classList.remove('listo'); });
    gate.classList.add('abierto');                           // dispara todas las transiciones (CSS)
    setTimeout(function () { gate.classList.add('boton'); btnVer.tabIndex = 0; tarjetaVista = true; ajustarNombre(); }, E.tiempos['d-boton'] * 1000);
    setTimeout(function () { if (!tarjetaVista) { gate.classList.add('boton'); btnVer.tabIndex = 0; tarjetaVista = true; } }, E.maxMs);
  }
  sello.addEventListener('click', abrirSobre);
  pista.addEventListener('click', abrirSobre);
  env.addEventListener('click', function (e) { if (!abierta) abrirSobre(); });
  tarjeta.addEventListener('click', function () { if (tarjetaVista) verInvitacion(); });

  /* Fundido portada → invitación (fotograma a fotograma, opacidad en línea: nada la pisa) */
  var suave = function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; };
  function animar(ms, paso, fin) {
    var ini = performance.now(), hecho = false;
    var terminar = function () { if (hecho) return; hecho = true; paso(1); fin && fin(); };
    (function f(now) { if (hecho) return; var p = Math.min(1, (now - ini) / ms); paso(suave(p)); if (p < 1) requestAnimationFrame(f); else terminar(); })(ini);
    setTimeout(terminar, ms + 1500);
  }
  var esperando = false;
  function verInvitacion() {
    if (saliendo) return;
    if (invFallo) { location.reload(); return; }
    if (!invListo) {                                          // el invitado llegó antes de que terminara la carga: se espera sin perder el toque
      if (esperando) return; esperando = true; btnVer.classList.add('espera');
      iniciarInvitacion().then(function () { esperando = false; btnVer.classList.remove('espera'); verInvitacion(); },
        function () { esperando = false; btnVer.classList.remove('espera'); btnVer.textContent = tx('reintentar');
                      console.error('No se pudo cargar la invitación. Si abriste el archivo con doble clic, ábrelo desde un servidor (http/https).'); });
      return;
    }
    saliendo = true;
    medirRsvp(); ajustes.a && ajustes.a.reajustar(); ajustes.b && ajustes.b.reajustar();
    var inv = $('invitacion'); inv.classList.add('visible'); inv.removeAttribute('aria-hidden');
    hostP.style.setProperty('pointer-events', 'none', 'important');
    var revelado = false;
    animar(CONFIG.salida.ms, function (p) {
      hostP.style.setProperty('opacity', (1 - p).toFixed(4), 'important');
      if (!revelado && p >= CONFIG.salida.revelarEn) { revelado = true; revelar(); }
    }, function () {
      if (!revelado) revelar();
      hostP.parentNode && hostP.parentNode.removeChild(hostP);
    });
  }
  function revelar() {
    document.documentElement.classList.remove('bloqueado');
    window.scrollTo(0, 0);
    window.__invitacionVisible = true;
    window.dispatchEvent(new Event('invitacion:visible'));    // arranca animacion.js en las dos mitades
    animarCabeceraRsvp();
    creditoAlFinal();
    setTimeout(pistaScroll, 2200);
  }
  /* Gesto «desliza»: aparece una sola vez, cuando la invitación ya se ve, y se va en cuanto el invitado empieza a desplazarse (o a los 16 s) */
  function pistaScroll() {
    var el = $('pista-scroll'); if (!el || window.scrollY > 30) return;
    $('ps-txt').textContent = tx('desliza');
    el.hidden = false; void el.offsetWidth;
    /* Si la primera foto termina antes que la pantalla (celulares altos), el gesto se apoya sobre la foto y no tapa el título que sigue */
    var sec = raices.a && raices.a.querySelector('section'), r = sec && sec.getBoundingClientRect();
    if (r && r.bottom < window.innerHeight - 8) { el.style.bottom = 'auto'; el.style.top = Math.max(60, r.bottom - 16 - el.offsetHeight) + 'px'; }
    el.classList.add('ver');
    var fin = function () {
      window.removeEventListener('scroll', alMover); window.removeEventListener('wheel', fin); window.removeEventListener('touchmove', fin); window.removeEventListener('keydown', fin);
      clearTimeout(t); el.classList.remove('ver'); setTimeout(function () { el.hidden = true; }, 1000);
    };
    var alMover = function () { if (window.scrollY > 30) fin(); };
    var t = setTimeout(fin, 16000);
    window.addEventListener('scroll', alMover, { passive: true }); window.addEventListener('wheel', fin, { passive: true });
    window.addEventListener('touchmove', fin, { passive: true }); window.addEventListener('keydown', fin);
  }
  /* El crédito ("Hecho con amor") no aparece al abrir: se muestra solo cuando el invitado llega al final de la invitación */
  function creditoAlFinal() {
    var fin = document.querySelector('#invitacion [data-credito]');
    if (!fin || !P.credito || modoCredito === 'oculto' || !window.IntersectionObserver) return;
    fin.style.minHeight = '1px';
    var io = new IntersectionObserver(function (en) {
      if (!en.some(function (e) { return e.isIntersecting; })) return;
      io.disconnect();
      window.PYD_SIN_CREDITO = false;
      P.credito({ modo: modoCredito, lang: lang });
    });
    io.observe(fin);
  }

  /* ---------------------------------------------------------------- RSVP nativo: cabecera, idioma y crédito */
  var modoCredito = 'flotante';
  function animarCabeceraRsvp() {
    var els = document.querySelectorAll('#rsvp-seccion .rsvp-anim');
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: .3 });
    els.forEach(function (e) { io.observe(e); });
  }
  function aplicarIdioma(l) {
    lang = TXT[l] ? l : 'es';
    document.documentElement.lang = lang;
    document.querySelectorAll('#rsvp-idiomas button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === lang)); });
    pintarTarjeta();
    regalos && regalos.idioma();
    contador && contador.etiquetas();
    var psl = $('ps-txt'); if (psl) psl.textContent = tx('desliza');
  }
  window.addEventListener('rsvp:idioma', function (e) { aplicarIdioma(e.detail); });
  window.addEventListener('rsvp:proyecto', function (e) {
    var p = e.detail || {};
    modoCredito = p.credito || 'flotante';
    $('rsvp-idiomas').hidden = String(p.idioma || 'es').split(',').length < 2;
  });
  $('rsvp-idiomas').addEventListener('click', function (e) { var b = e.target.closest('[data-l]'); if (b && window.RSVP_IDIOMA) RSVP_IDIOMA.cambiar(b.dataset.l); });

  /* ---------------------------------------------------------------- enlaces dentro de Canva */
  function enlazarEventos() {
    ['a', 'b'].forEach(function (c) {
      raices[c].addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a'), h = a ? a.getAttribute('href') || '' : '';
        var dest = CONFIG.enlaces.find(function (x) { return e.target.closest && e.target.closest('#' + x.id); });
        if (dest) { e.preventDefault(); if (dest.accion === 'regalos' && regalos) regalos.voltear(true); else if (dest.url) window.open(dest.url, '_blank', 'noopener'); return; }
        if (a && h.charAt(0) === '#') e.preventDefault();                 // anclas internas del export (#page-1…)
      });
    });
  }
})();
