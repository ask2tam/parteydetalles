<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>Panel de invitados</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-oro-50: #fbf7f0; --color-oro-100: #f3e8d6; --color-oro-200: #e7d3b2; --color-oro-400: #c9a87f;
    --color-oro-500: #b9966f; --color-oro-600: #a3825c; --color-oro-700: #84683f;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script src="../assets/qr.js" defer></script>
<style>
  dialog::backdrop { background: rgb(28 25 23 / .55); }
  dialog[open] { animation: aparecer .16s ease-out; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } }
  @keyframes destello { from { background-color: #fdf3d9; } to { background-color: transparent; } }
  .destello { animation: destello 2.4s ease-out; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  @media (prefers-reduced-motion: reduce) { dialog[open], .destello { animation: none; } }
</style>
</head>
<body class="min-h-dvh bg-stone-100 text-stone-800 antialiased">
<div id="app" class="min-h-dvh"></div>
<div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
<dialog id="dlg" class="m-auto w-[min(100%-1rem,44rem)] max-h-[92dvh] overflow-hidden rounded-2xl bg-white p-0 text-stone-800 shadow-2xl"></dialog>
<dialog id="dlg2" class="m-auto h-[92dvh] w-[min(100%-1rem,44rem)] overflow-hidden rounded-2xl bg-white p-0 shadow-2xl"></dialog>

<script>
/* =====================================================================================
   CONFIGURACIÓN (mismos datos que assets/boda-api.js)
   ===================================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://wpnhiwiqlhzbykqecjkw.supabase.co',
  SUPABASE_ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwbmhpd2lxbGh6YnlrcWVjamt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjY2NTEsImV4cCI6MjEwOTAwMjY1MX0.j8plQ_bVg-cmYcHUgQ03sNtR-ld-Y7udwElKwevJ2VA',
  NOVIOS: 'Ignacio & Suly',
  TRATAMIENTOS: ['Señor', 'Señora', 'Señorita', 'Sr. y Sra.', 'Familia', 'Doctor', 'Doctora', 'Joven'],
  CLAVE_MIN: 8
};
/* ===================================================================================== */

/* El enlace de "olvidé mi contraseña" llega con #...type=recovery: se detecta ANTES de crear el cliente */
const VIENE_DE_RECUPERACION = /type=recovery/.test(location.hash);
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);
const S = {
  user: null, rol: null, lista: [], config: null, sel: new Set(), canal: null, recientes: new Map(),
  q: '', seg: 'todos', orden: 'fecha_registro', dir: 'desc', recuperando: VIENE_DE_RECUPERACION,
  vista: localStorage.getItem('panel.vista') || (innerWidth < 768 ? 'tarjetas' : 'tabla')
};
const URL_PANEL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const estadoDe = i => i.asistencia === 'si' ? 'si' : i.asistencia === 'no' ? 'no' : 'pendiente';
const link = i => (S.config?.url_base || '') + i.codigo;
const conTrato = i => i.tratamiento && !norm(i.nombre).startsWith(norm(i.tratamiento)) ? `<span class="font-normal text-stone-500">${esc(i.tratamiento)} </span>` : '';
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const fmt = iso => iso ? new Date(iso).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
function hace(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if (s < 86400 * 30) return `hace ${Math.floor(s / 86400)} d`;
  return fmt(iso);
}

/* ------------------------------------------------------------------ iconos */
const P = {
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  wa: '<path d="M3 21l1.7-4.6A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c.3 1.6 2.4 4 4.5 4.7l1.2-1.2 2 .9c-.2 1.3-1.2 1.9-2.4 1.8-3.3-.4-6.6-3.7-6.9-6.9-.1-1.2.6-2.2 1.8-2.4l.9 2-1.1 1.1z"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', down: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M17 6l3 3M14 9l2 2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>',
  cards: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  sort: '<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'
};
const ico = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const BADGE = {
  si: ['Asistirá', 'bg-emerald-50 text-emerald-700 ring-emerald-600/20'],
  no: ['No asistirá', 'bg-rose-50 text-rose-700 ring-rose-600/20'],
  pendiente: ['Pendiente', 'bg-amber-50 text-amber-700 ring-amber-600/20']
};
const badge = i => { const [t, c] = BADGE[estadoDe(i)]; return `<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${c}">${t}</span>`; };
const btn = 'inline-flex items-center justify-center gap-2 rounded-xl px-3.5 py-2 text-sm font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-oro-500 disabled:opacity-50';
const btnP = `${btn} bg-oro-600 text-white hover:bg-oro-700`;
const btnS = `${btn} bg-white text-stone-700 ring-1 ring-stone-300 hover:bg-stone-50`;
const btnD = `${btn} bg-rose-600 text-white hover:bg-rose-700`;
const icoBtn = 'inline-grid size-9 place-items-center rounded-lg text-stone-500 hover:bg-stone-100 hover:text-stone-800 focus-visible:outline-2 focus-visible:outline-oro-500';
const campo = 'block w-full rounded-xl border-0 bg-white px-3 py-2 text-base sm:text-sm ring-1 ring-stone-300 focus:ring-2 focus:ring-oro-500 focus:outline-none';
const lbl = 'mb-1 block text-sm font-medium text-stone-700';
const enlace = 'text-sm font-medium text-oro-700 underline underline-offset-2 hover:text-oro-600';

function toast(msg, tipo = 'ok') {
  const c = { ok: 'bg-stone-900 text-white', error: 'bg-rose-600 text-white', info: 'bg-white text-stone-800 ring-1 ring-stone-200' }[tipo];
  const d = document.createElement('div');
  d.className = `pointer-events-auto max-w-md rounded-xl px-4 py-2.5 text-sm shadow-lg ${c}`;
  d.textContent = msg; $('#toasts').appendChild(d);
  setTimeout(() => { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, tipo === 'error' ? 6000 : 3200);
}
function errorAmigable(e) {
  const m = (e && (e.message || e.details)) || String(e);
  if (e?.code === '23505' || /duplicate key|nombre_norm/.test(m)) return 'Ya existe un invitado con ese nombre. Agrega un apellido o el parentesco entre paréntesis, p. ej. “Pérez (Padre)”.';
  if (/pases_confirmados_max/.test(m)) return 'Los pases confirmados no pueden superar los pases asignados.';
  if (/ingreso_max/.test(m)) return 'Los ingresos registrados no pueden superar los pases asignados.';
  if (/check/.test(m)) return 'Hay un valor fuera de rango. Revisa los campos.';
  if (/JWT|session|permission|RLS|no_autorizado/i.test(m)) return 'Tu sesión no tiene permisos. Vuelve a iniciar sesión.';
  return m;
}
function errorClave(e) {
  const c = e?.code || '', m = e?.message || '';
  if (c === 'same_password' || /different from the old/i.test(m)) return 'La nueva contraseña debe ser distinta de la actual.';
  if (c === 'weak_password' || /weak|at least/i.test(m)) return `Contraseña muy débil: usa al menos ${CONFIG.CLAVE_MIN} caracteres combinando letras y números.`;
  if (c === 'reauthentication_needed' || /reauthentic/i.test(m)) return 'Por seguridad debes volver a iniciar sesión antes de cambiar la contraseña.';
  if (/expired|invalid/i.test(m)) return 'El enlace o código venció. Solicita uno nuevo.';
  if (/rate|too many|seconds/i.test(m)) return 'Demasiados intentos. Espera un minuto y vuelve a intentarlo.';
  return m || 'No se pudo completar la operación.';
}

/* ------------------------------------------------------------------ modal */
const dlg = $('#dlg'), dlg2 = $('#dlg2');
function modal(html, alAbrir) {
  dlg.innerHTML = html; if (!dlg.open) dlg.showModal();
  dlg.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => dlg.close()));
  alAbrir?.(dlg);
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg2.addEventListener('click', e => { if (e.target === dlg2) dlg2.close(); });
const cabecera = (t, sub = '') => `<div class="flex items-start justify-between gap-4 border-b border-stone-200 px-5 py-4">
  <div><h2 class="text-lg font-semibold">${t}</h2>${sub ? `<p class="mt-0.5 text-sm text-stone-500">${sub}</p>` : ''}</div>
  <button type="button" class="${icoBtn}" data-cerrar aria-label="Cerrar">${ico('x')}</button></div>`;
const cuerpo = h => `<div class="max-h-[calc(92dvh-9rem)] overflow-y-auto px-5 py-4">${h}</div>`;
const pie = h => `<div class="flex flex-wrap justify-end gap-2 border-t border-stone-200 bg-stone-50 px-5 py-3">${h}</div>`;
function confirmar({ titulo, texto, ok = 'Confirmar', peligro = false, palabra = null }) {
  return new Promise(res => {
    modal(cabecera(titulo) + cuerpo(`<p class="text-sm text-stone-600">${texto}</p>${palabra ? `<label class="${lbl} mt-4" for="cf-p">Escribe <b>${palabra}</b> para continuar</label><input id="cf-p" class="${campo}" autocomplete="off">` : ''}`) +
      pie(`<button type="button" class="${btnS}" data-cerrar>Cancelar</button><button type="button" id="cf-ok" class="${peligro ? btnD : btnP}" ${palabra ? 'disabled' : ''}>${ok}</button>`), d => {
      let r = false;
      d.querySelector('#cf-p')?.addEventListener('input', e => { d.querySelector('#cf-ok').disabled = e.target.value.trim() !== palabra; });
      d.querySelector('#cf-ok').addEventListener('click', () => { r = true; d.close(); });
      d.addEventListener('close', () => res(r), { once: true });
    });
  });
}

/* =====================================================================================
   ACCESO: ingreso, olvidé mi contraseña, nueva contraseña
   ===================================================================================== */
const tarjetaAcceso = (contenido) => `<main class="grid min-h-dvh place-items-center px-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-sm ring-1 ring-stone-200">
    <p class="text-xs font-semibold uppercase tracking-[.2em] text-oro-600">Panel de invitados</p>
    <h1 class="mt-1 text-2xl font-semibold">${esc(CONFIG.NOVIOS)}</h1>${contenido}</div></main>`;
const msgAcceso = (el, t, tipo = 'error') => { el.className = `mt-3 min-h-5 text-sm ${{ error: 'text-rose-600', ok: 'text-emerald-700', info: 'text-stone-500' }[tipo]}`; el.textContent = t; };

function pantallaLogin(msg = '') {
  S.user = null;
  $('#app').innerHTML = tarjetaAcceso(`<form id="login" class="mt-6">
      <label class="${lbl}" for="l-email">Correo</label>
      <input id="l-email" type="email" autocomplete="email" required class="${campo}">
      <div class="mt-4 flex items-baseline justify-between"><label class="${lbl}" for="l-pass">Contraseña</label>
        <button type="button" id="l-olvide" class="${enlace} text-xs">¿Olvidaste tu contraseña?</button></div>
      <input id="l-pass" type="password" autocomplete="current-password" class="${campo}">
      <p id="l-msg" class="mt-3 min-h-5 text-sm text-rose-600" role="status">${esc(msg)}</p>
      <button class="${btnP} mt-2 w-full">Ingresar</button>
      <button type="button" id="l-magic" class="${btnS} mt-2 w-full">${ico('mail')} Enviarme un enlace de acceso</button>
    </form>`);
  const m = $('#l-msg');
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); msgAcceso(m, 'Ingresando…', 'info');
    const { error } = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pass').value });
    if (error) msgAcceso(m, /confirm/i.test(error.message) ? 'Tu correo aún no está confirmado.' : 'Correo o contraseña incorrectos.');
  });
  $('#l-olvide').addEventListener('click', () => pantallaRecuperar($('#l-email').value.trim()));
  $('#l-magic').addEventListener('click', async () => {
    const email = $('#l-email').value.trim();
    if (!email) return msgAcceso(m, 'Escribe tu correo primero.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: URL_PANEL, shouldCreateUser: false } });
    error ? msgAcceso(m, errorClave(error)) : msgAcceso(m, 'Si el correo tiene acceso, te llegará un enlace. Ábrelo en este dispositivo.', 'ok');
  });
}

function pantallaRecuperar(email = '') {
  $('#app').innerHTML = tarjetaAcceso(`
    <h2 class="mt-5 font-semibold">Restablecer contraseña</h2>
    <p class="mt-1 text-sm text-stone-500">Te enviaremos un correo con un enlace y un código para crear una contraseña nueva.</p>
    <form id="r-form" class="mt-4">
      <label class="${lbl}" for="r-email">Correo</label>
      <input id="r-email" type="email" autocomplete="email" required class="${campo}" value="${esc(email)}">
      <button class="${btnP} mt-4 w-full" id="r-enviar">Enviar correo</button>
    </form>
    <form id="r-codigo" class="mt-5 hidden border-t border-stone-200 pt-4">
      <label class="${lbl}" for="r-otp">¿El enlace no funcionó? Escribe el código del correo</label>
      <input id="r-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" class="${campo} tracking-[.4em] text-center font-mono text-lg" placeholder="••••••">
      <button class="${btnS} mt-3 w-full">Verificar código</button>
    </form>
    <p id="r-msg" class="mt-3 min-h-5 text-sm" role="status"></p>
    <button type="button" id="r-volver" class="${enlace} mt-2">← Volver al ingreso</button>`);
  const m = $('#r-msg');
  $('#r-volver').onclick = () => pantallaLogin();
  $('#r-form').addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#r-enviar'); b.disabled = true; msgAcceso(m, 'Enviando…', 'info');
    const { error } = await sb.auth.resetPasswordForEmail($('#r-email').value.trim(), { redirectTo: URL_PANEL });
    b.disabled = false;
    if (error) return msgAcceso(m, errorClave(error));
    msgAcceso(m, 'Si el correo tiene acceso al panel, recibirás un mensaje en unos minutos. Revisa también Spam.', 'ok');
    $('#r-codigo').classList.remove('hidden'); b.textContent = 'Reenviar correo';
  });
  $('#r-codigo').addEventListener('submit', async e => {
    e.preventDefault();
    const token = $('#r-otp').value.replace(/\D/g, '');
    if (token.length < 6) return msgAcceso(m, 'Escribe el código completo.');
    msgAcceso(m, 'Verificando…', 'info');
    S.recuperando = true;
    const { error } = await sb.auth.verifyOtp({ email: $('#r-email').value.trim(), token, type: 'recovery' });
    if (error) { S.recuperando = false; return msgAcceso(m, errorClave(error)); }
    pantallaNuevaClave();
  });
}

function formClave(id) {
  return `<form id="${id}" class="mt-4 grid gap-3" novalidate>
    <div><label class="${lbl}" for="${id}-1">Nueva contraseña</label><input id="${id}-1" type="password" autocomplete="new-password" minlength="${CONFIG.CLAVE_MIN}" class="${campo}"></div>
    <div><label class="${lbl}" for="${id}-2">Repite la contraseña</label><input id="${id}-2" type="password" autocomplete="new-password" class="${campo}"></div>
    <p class="text-xs text-stone-500">Mínimo ${CONFIG.CLAVE_MIN} caracteres. Evita reutilizar contraseñas de otros servicios.</p>
    <p id="${id}-msg" class="min-h-5 text-sm text-rose-600" role="alert"></p>
    <button class="${btnP} w-full" id="${id}-ok">Guardar contraseña</button></form>`;
}
async function guardarClave(id) {
  const a = $(`#${id}-1`).value, b = $(`#${id}-2`).value, m = $(`#${id}-msg`);
  if (a.length < CONFIG.CLAVE_MIN) { m.textContent = `Usa al menos ${CONFIG.CLAVE_MIN} caracteres.`; return false; }
  if (a !== b) { m.textContent = 'Las contraseñas no coinciden.'; return false; }
  $(`#${id}-ok`).disabled = true; m.textContent = '';
  const { error } = await sb.auth.updateUser({ password: a });
  $(`#${id}-ok`).disabled = false;
  if (error) { m.textContent = errorClave(error); return false; }
  return true;
}
function pantallaNuevaClave() {
  $('#app').innerHTML = tarjetaAcceso(`<h2 class="mt-5 font-semibold">Crea tu nueva contraseña</h2>${formClave('nc')}`);
  $('#nc').addEventListener('submit', async e => {
    e.preventDefault();
    if (!(await guardarClave('nc'))) return;
    S.recuperando = false;
    history.replaceState(null, '', URL_PANEL);
    toast('Contraseña actualizada');
    const { data } = await sb.auth.getSession();
    data.session ? entrar(data.session, true) : pantallaLogin();
  });
}
function cambiarClave() {
  modal(cabecera('Cambiar contraseña', esc(S.user?.email || '')) + cuerpo(formClave('cc')), d => {
    d.querySelector('#cc-1').focus();
    d.querySelector('#cc').addEventListener('submit', async e => {
      e.preventDefault();
      if (await guardarClave('cc')) { dlg.close(); toast('Contraseña actualizada'); }
    });
  });
}

async function entrar(session, forzar = false) {
  if (S.recuperando) return pantallaNuevaClave();
  if (!forzar && S.user && S.user.id === session.user.id) return;
  S.user = session.user;
  const { data } = await sb.rpc('rol_actual');
  S.rol = data || null;
  if (!S.rol) { await sb.auth.signOut(); pantallaLogin('Este correo no tiene acceso al panel.'); return; }
  if (S.rol === 'seguridad') {
    $('#app').innerHTML = `<main class="grid min-h-dvh place-items-center px-6 text-center"><div class="max-w-sm">
      <p class="text-xs font-semibold uppercase tracking-[.2em] text-oro-600">Modo recepción</p>

      <div class="mt-6 flex justify-center gap-2"><button id="clave" class="${btnS}">${ico('key')} Cambiar contraseña</button><button id="salir" class="${btnS}">${ico('out')} Cerrar sesión</button></div></div></main>`;
    $('#salir').onclick = () => sb.auth.signOut();
    $('#clave').onclick = cambiarClave;
    return;
  }
  $('#app').innerHTML = `<div class="grid min-h-dvh place-items-center text-stone-500">Cargando invitados…</div>`;
  await cargar();
}

/* =====================================================================================
   DATOS + TIEMPO REAL
   ===================================================================================== */
async function cargar() {
  const [l, c] = await Promise.all([sb.from('invitados').select('*').order('id'), sb.from('config').select('*').eq('id', 1).single()]);
  if (l.error || c.error) { $('#app').innerHTML = `<p class="p-6 text-rose-700">No se pudieron cargar los datos: ${esc(errorAmigable(l.error || c.error))}</p>`; return; }
  S.lista = l.data; S.config = c.data;
  if (!$('#lista')) layout();
  refrescar(); suscribir();
}
async function recargar() {
  const { data, error } = await sb.from('invitados').select('*').order('id');
  if (!error) { S.lista = data; refrescar(); }
}
function suscribir() {
  if (S.canal) return;
  S.canal = sb.channel('invitados-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invitados' }, p => {
      if (p.eventType === 'DELETE') { S.lista = S.lista.filter(i => i.id !== p.old.id); S.sel.delete(p.old.id); }
      else { upsertLocal(p.new); S.recientes.set(p.new.id, Date.now()); }
      programar();
    })
    .subscribe(st => {
      const ok = st === 'SUBSCRIBED', el = $('#rt');
      if (el) el.innerHTML = `<span class="size-2 rounded-full ${ok ? 'bg-emerald-500' : 'bg-stone-400'}"></span>${ok ? 'En vivo' : 'Sin conexión en vivo'}`;
      if (ok) recargar();   // al reconectar se sincroniza lo que pudo perderse
    });
}
function upsertLocal(r) { const k = S.lista.findIndex(i => i.id === r.id); if (k >= 0) S.lista[k] = r; else S.lista.push(r); }
let pendiente = 0;
function programar() { cancelAnimationFrame(pendiente); pendiente = requestAnimationFrame(refrescar); }

function cambiarVista(v) { S.vista = v; localStorage.setItem('panel.vista', v); refrescar(); }

function coincide(i) {
  const e = estadoDe(i);
  switch (S.seg) {
    case 'pendiente': case 'si': case 'no': if (e !== S.seg) return false; break;
    case 'abrio': if (!(i.vistas > 0 && e === 'pendiente')) return false; break;
    case 'no_abrio': if (i.vistas > 0) return false; break;
    case 'sin_envio': if (i.whatsapp_enviado) return false; break;
    case 'con_mensaje': if (!i.mensaje) return false; break;
    case 'sin_mesa': if (!(e === 'si' && !i.mesa)) return false; break;
    case 'ingreso': if (!(i.ingreso_pases > 0)) return false; break;
  }
  if (!S.q.trim()) return true;
  const q = norm(S.q);
  return [i.nombre, i.tratamiento, i.codigo, i.mesa, i.telefono, i.mensaje, i.respuesta_novios].some(v => norm(v).includes(q));
}
function visibles() {
  const k = S.orden, d = S.dir === 'asc' ? 1 : -1, ord = { si: 0, pendiente: 1, no: 2 };
  const val = i => k === 'estado' ? ord[estadoDe(i)] : i[k];
  return S.lista.filter(coincide).sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    if (typeof x === 'number') return (x - y) * d;
    return String(x).localeCompare(String(y), 'es', { numeric: true, sensitivity: 'base' }) * d;
  });
}

function kpis() {
  const L = S.lista, sum = (a, f) => a.reduce((s, i) => s + (f(i) || 0), 0);
  const si = L.filter(i => i.asistencia === 'si'), no = L.filter(i => i.asistencia === 'no'), pen = L.filter(i => !i.asistencia);
  const abiertos = L.filter(i => i.vistas > 0), resp = si.length + no.length, pct = L.length ? Math.round(resp / L.length * 100) : 0;
  const enviados = L.filter(i => i.whatsapp_enviado).length, conMesa = si.filter(i => i.mesa).length, ingresos = sum(L, i => i.ingreso_pases);
  const pc = sum(si, i => i.pases_confirmados);
  const k = (seg, titulo, valor, sub, acento = '') => `<button type="button" data-seg="${seg}" class="group rounded-2xl bg-white p-4 text-left shadow-sm ring-1 ${S.seg === seg ? 'ring-2 ring-oro-500' : 'ring-stone-200'} hover:ring-oro-400 focus-visible:outline-2 focus-visible:outline-oro-500">

    k('todos', 'Invitados', L.length, `${sum(L, i => i.pases_asignados)} pases asignados`) +
    k('si', 'Asistirán', pc, `pases · ${plural(si.length, 'registro', 'registros')}`, 'text-emerald-700') +
    k('no', 'No asistirán', no.length, `${sum(no, i => i.pases_asignados)} pases liberados`, 'text-rose-700') +
    k('pendiente', 'Pendientes', pen.length, `${sum(pen, i => i.pases_asignados)} pases por confirmar`, 'text-amber-700') +
    `<div class="col-span-2 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 sm:col-span-1">
       <div class="flex items-baseline justify-between"><p class="text-xs font-medium text-stone-500">Tasa de respuesta</p><p class="text-2xl font-semibold tabular-nums">${pct}%</p></div>
       <div class="mt-2 flex h-2.5 overflow-hidden rounded-full bg-stone-100" role="img" aria-label="${si.length} asistirán, ${no.length} no asistirán, ${pen.length} pendientes">
         <div class="bg-emerald-500" style="width:${L.length ? si.length / L.length * 100 : 0}%"></div><div class="bg-rose-400" style="width:${L.length ? no.length / L.length * 100 : 0}%"></div></div>
       <p class="mt-2 text-xs text-stone-500">${resp} de ${L.length} respondieron</p></div>` +
    k('abrio', 'Abrieron la invitación', abiertos.length, `${abiertos.filter(i => !i.asistencia).length} sin responder aún`) +
    k('sin_envio', 'WhatsApp enviados', `${enviados}<span class="text-base text-stone-400">/${L.length}</span>`, `${L.length - enviados} por enviar`) +
    k('sin_mesa', 'Mesas asignadas', `${conMesa}<span class="text-base text-stone-400">/${si.length}</span>`, `${si.length - conMesa} confirmados sin mesa`) +
    (ingresos ? k('ingreso', 'Ingresaron', ingresos, `de ${pc} pases confirmados`) : '');
}

function refrescar() {
  if (!$('#lista')) return;

  const v = visibles(), ahora = Date.now();

  $('#seg').value = S.seg; $('#orden').value = S.orden;

function tarjetas(v) {

function barraSeleccion() {
  const n = S.sel.size, b = $('#selbar');
  b.classList.toggle('hidden', !n); b.classList.toggle('flex', !!n);
  if (!n) return;
  b.innerHTML = `<span class="font-medium">${plural(n, 'seleccionado', 'seleccionados')}</span>

function mensajeWa(i) {
  const c = S.config, fl = c.fecha_limite ? new Date(c.fecha_limite).toLocaleDateString('es-PE', { day: 'numeric', month: 'long' }) : '';
  const pases = plural(i.pases_asignados, 'pase', 'pases');

    tratamiento: i.tratamiento && !norm(i.nombre).startsWith(norm(i.tratamiento)) ? i.tratamiento : '', nombre: i.nombre, link: link(i), pases, codigo: i.codigo, mesa: i.mesa,
    fecha_limite: fl, novios: CONFIG.NOVIOS }[k] ?? m)).replace(/ {2,}/g, ' ').replace(/^ /gm, '');

function numeroWa(t) {

}

async function estadoReporte(el) {
  if (!el) return;
  const { data, error } = await sb.rpc('admin_reporte_estado');
  if (!el.isConnected) return;
  if (error || !data) { el.innerHTML = `<span class="text-amber-700">No se pudo consultar el estado del reporte. ¿Ejecutaste <span class="font-mono">02_reporte_diario.sql</span>?</span>`; return; }
  const avisos = [];
  if (!data.tiene_api_key) avisos.push('Falta la API key de Resend en Vault.');
  if (!data.programado) avisos.push('La tarea programada (pg_cron) no está activa.');
  const r = data.respuesta, res = data.resultado;
  let ultimo = 'Aún no se ha enviado ningún reporte.';
  if (res?.fecha) {
    const ok = r && r.status >= 200 && r.status < 300, falla = r && (r.status >= 300 || r.error || r.timeout);
    ultimo = `Último envío${res.prueba ? ' (prueba)' : ''}: ${fmt(res.fecha)} · ${plural(res.cambios, 'cambio', 'cambios')} · `
      + (ok ? '<span class="font-medium text-emerald-700">entregado a Resend</span>'
         : falla ? `<span class="font-medium text-rose-700">falló (${esc(r.status || r.error || 'tiempo agotado')})</span>${r.detalle ? `<br><span class="font-mono text-xs text-rose-700">${esc(r.detalle)}</span>` : ''}`
         : '<span class="text-stone-500">en proceso o sin datos (Supabase guarda la respuesta ~6 h)</span>');
  }
  el.innerHTML = `${ultimo}${data.ultima_revision ? `<br><span class="text-xs text-stone-500">Última revisión diaria: ${esc(data.ultima_revision)}</span>` : ''}`
    + (avisos.length ? `<ul class="mt-2 list-disc pl-5 text-amber-700">${avisos.map(a => `<li>${a}</li>`).join('')}</ul>` : '');
}
async function vistaPreviaReporte() {

/* =====================================================================================
   EXCEL: exportar, plantilla e importar
   ===================================================================================== */
function sello() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
const fecha = iso => iso ? new Date(iso) : null;
function exportar(lista, sufijo) {
  if (!window.XLSX) return toast('La librería de Excel aún está cargando, intenta en un segundo', 'info');
  if (!lista.length) return toast('No hay invitados para exportar', 'info');
  const filas = lista.map(i => ({
    'Nombre del invitado': i.nombre, 'Tratamiento': i.tratamiento, 'Código': i.codigo, 'Link': link(i),
    'Asistencia a la boda': i.asistencia === 'si' ? 'Sí, asistiré' : i.asistencia === 'no' ? 'No podré asistir' : '',
    'Pases asignados': i.pases_asignados, 'Pases confirmados': i.pases_confirmados ?? '', 'Mensaje a los novios': i.mensaje,
    'Fecha registro': fecha(i.fecha_registro), 'Fecha primera vista': fecha(i.primera_vista), 'Fecha última vista': fecha(i.ultima_vista), 'N.º de vistas': i.vistas,
    'Fecha primera respuesta': fecha(i.primera_respuesta), 'Fecha última modificación': fecha(i.ultima_modificacion), 'N.º de ediciones': i.ediciones,
    'Respuesta de los novios': i.respuesta_novios, 'Número de mesa': i.mesa, 'WhatsApp': i.telefono, 'WhatsApp enviado': fecha(i.whatsapp_enviado),
    'Ingresaron (pases)': i.ingreso_pases || '', 'Hora de ingreso': fecha(i.ingreso_fecha)
  }));
  const ws = XLSX.utils.json_to_sheet(filas, { dateNF: 'dd/mm/yyyy hh:mm' });
  ws['!cols'] = [28, 12, 8, 46, 18, 9, 10, 40, 16, 16, 16, 8, 16, 16, 8, 40, 9, 14, 16, 9, 16].map(w => ({ wch: w }));
  ws['!autofilter'] = { ref: ws['!ref'] };
  filas.forEach((f, r) => { const a = XLSX.utils.encode_cell({ r: r + 1, c: 3 }); if (ws[a]) ws[a].l = { Target: f.Link }; });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
  XLSX.writeFile(wb, `invitados_${sufijo}_${sello()}.xlsx`);
  toast(`${plural(lista.length, 'invitado exportado', 'invitados exportados')}`);
}
const COLUMNAS = [
  ['nombre', 'Nombre del invitado', true, 'Nombre único. Si se repite, agrega apellido o parentesco: “Sr. Pérez (Padre)”.', ['nombre del invitado', 'nombre', 'invitado', 'nombre completo', 'nombres']],
  ['tratamiento', 'Tratamiento', false, 'Señor, Señora, Señorita, Familia… o vacío.', ['tratamiento', 'trato']],
  ['pases_asignados', 'Pases asignados', false, 'Número entero (1 si se deja vacío en registros nuevos).', ['pases asignados', 'pases', 'cupos', 'pases reservados']],
  ['mesa', 'Número de mesa', false, 'Texto o número. Se muestra en la invitación.', ['numero de mesa', 'n de mesa', 'no de mesa', 'nro de mesa', 'mesa']],
  ['telefono', 'WhatsApp', false, 'Con o sin código de país: 987654321 o +51 987 654 321.', ['whatsapp', 'telefono', 'celular', 'movil', 'numero de whatsapp']],
  ['respuesta_novios', 'Respuesta de los novios', false, 'Se muestra al invitado en la invitación.', ['respuesta de los novios', 'respuesta novios']],
  ['codigo', 'Código', false, 'Clave para actualizar un invitado existente (aunque cambies su nombre). En nuevos: déjalo vacío y se genera.', ['codigo', 'cod', 'code']],
  ['asistencia', 'Asistencia a la boda', false, '“Sí” / “No” / vacío. Útil si alguien confirmó por teléfono.', ['asistencia a la boda', 'asistencia', 'asiste']],
  ['pases_confirmados', 'Pases confirmados', false, 'No puede superar los pases asignados.', ['pases confirmados', 'confirmados']]
];
const normCab = t => norm(t).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function plantilla() {
  if (!window.XLSX) return toast('La librería de Excel aún está cargando', 'info');
  const cab = ['Nombre del invitado', 'Tratamiento', 'Pases asignados', 'Número de mesa', 'WhatsApp', 'Respuesta de los novios', 'Código'];
  const ws = XLSX.utils.aoa_to_sheet([cab, ['Juan Pérez (Padre)', 'Señor', 2, '5', '987654321', '', ''], ['Familia Rojas', 'Familia', 4, '', '+51 912 345 678', '', '']]);
  ws['!cols'] = [30, 14, 15, 15, 18, 36, 10].map(w => ({ wch: w }));
  const inst = XLSX.utils.aoa_to_sheet([['Columna', 'Obligatoria', 'Descripción'], ...COLUMNAS.map(c => [c[1], c[2] ? 'Sí' : 'No', c[3]]), [],
    ['Reglas'], ['• Un invitado por fila. Se reconoce por Código (si lo pones) o por Nombre.'], ['• Invitado existente: se reemplazan solo las columnas que incluyas. Nuevo: se agrega.'],
    ['• Puedes subir solo Nombre + Número de mesa (o + WhatsApp) para actualizar esos datos.'], ['• Columnas como Link, fechas o Mensaje a los novios se ignoran (el sistema las administra).'],
    ['• Sirve también para re-importar un Excel exportado desde este panel.']]);
  inst['!cols'] = [{ wch: 26 }, { wch: 12 }, { wch: 90 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados'); XLSX.utils.book_append_sheet(wb, inst, 'Instrucciones');
  XLSX.writeFile(wb, 'plantilla_invitados.xlsx');
}

function importar() {
  modal(`${cabecera('Importar invitados desde Excel', 'Agrega nuevos y actualiza existentes sin duplicar')}${cuerpo(`
    <div class="grid gap-4">
      <div class="rounded-xl bg-oro-50 p-3 text-sm text-stone-700">
        <p class="font-medium">Cómo funciona</p>
        <ul class="mt-1 list-disc space-y-0.5 pl-5">
          <li>La primera fila debe tener los <b>títulos de columna</b>. Solo <b>Nombre del invitado</b> es obligatorio.</li>
          <li>Cada fila se busca por <b>Código</b> (si la columna existe) o por <b>Nombre</b>: si existe se <b>actualiza</b>, si no se <b>agrega</b>.</li>
          <li>Solo se cambian las columnas que incluyas: para asignar mesas basta con <b>Nombre</b> + <b>Número de mesa</b>.</li>
          <li>Verás una vista previa antes de guardar nada.</li>
        </ul></div>
      <details class="rounded-xl ring-1 ring-stone-200"><summary class="cursor-pointer px-3 py-2 text-sm font-medium">Columnas reconocidas</summary>
        <div class="overflow-x-auto px-3 pb-3"><table class="w-full text-left text-xs"><thead class="text-stone-500"><tr><th class="py-1 pr-3">Columna</th><th class="py-1 pr-3">Oblig.</th><th class="py-1">Detalle</th></tr></thead>
        <tbody>${COLUMNAS.map(c => `<tr class="border-t border-stone-100 align-top"><td class="py-1.5 pr-3 font-medium">${c[1]}</td><td class="py-1.5 pr-3">${c[2] ? '<b class="text-rose-600">Sí</b>' : 'No'}</td><td class="py-1.5 text-stone-600">${c[3]}</td></tr>`).join('')}</tbody></table></div></details>
      <label class="flex items-start gap-2 text-sm"><input id="i-vacias" type="checkbox" class="mt-0.5 size-4 accent-oro-600">
        <span>Las celdas vacías <b>borran</b> el valor actual <span class="text-stone-500">(si no, se ignoran y se conserva lo que había)</span></span></label>
      <label id="i-zona" class="grid cursor-pointer place-items-center gap-1 rounded-2xl border-2 border-dashed border-stone-300 bg-stone-50 px-4 py-8 text-center hover:border-oro-400">
        <span class="text-oro-600">${ico('up', 'size-6')}</span><span class="font-medium">Elige o arrastra tu archivo</span><span class="text-xs text-stone-500">.xlsx, .xls o .csv</span>
        <input id="i-file" type="file" accept=".xlsx,.xls,.csv" class="sr-only"></label>
      <p id="i-err" class="min-h-5 text-sm text-rose-600" role="alert"></p>
    </div>`)}${pie(`<button type="button" id="i-plant" class="${btnS} mr-auto">${ico('down')} Descargar plantilla</button><button type="button" class="${btnS}" data-cerrar>Cancelar</button>`)}`, d => {
    d.querySelector('#i-plant').onclick = plantilla;
    const zona = d.querySelector('#i-zona'), leer = f => f && procesarArchivo(f, d.querySelector('#i-vacias').checked);
    d.querySelector('#i-file').onchange = e => leer(e.target.files[0]);
    zona.addEventListener('dragover', e => { e.preventDefault(); zona.classList.add('border-oro-500'); });
    zona.addEventListener('dragleave', () => zona.classList.remove('border-oro-500'));
    zona.addEventListener('drop', e => { e.preventDefault(); leer(e.dataTransfer.files[0]); });
  });
}
async function procesarArchivo(file, vacias) {
  const err = $('#i-err');
  if (!window.XLSX) { err.textContent = 'La librería de Excel aún está cargando, intenta de nuevo.'; return; }
  let filas;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false, blankrows: false });
  } catch { err.textContent = 'No se pudo leer el archivo. ¿Es un Excel válido?'; return; }
  const h = filas.findIndex(r => r.some(c => COLUMNAS.some(col => col[4].includes(normCab(c)))));
  if (h < 0) { err.textContent = 'No encontramos la fila de títulos. La primera fila debe tener “Nombre del invitado” (o “Código”).'; return; }
  const mapa = {}, ignoradas = [];
  filas[h].forEach((c, k) => {
    const n = normCab(c); if (!n) return;
    const col = COLUMNAS.find(col => col[4].includes(n) || (n.startsWith('respuesta de los novios') && col[0] === 'respuesta_novios'));
    if (col && !Object.values(mapa).includes(col[0])) mapa[k] = col[0]; else ignoradas.push(String(c).trim());
  });
  const claves = Object.values(mapa);
  if (!claves.includes('nombre') && !claves.includes('codigo')) { err.textContent = 'Falta la columna “Nombre del invitado”.'; return; }
  const plan = planificar(filas.slice(h + 1).map((r, k) => ({ r, fila: h + k + 2 })), mapa, vacias);
  vistaPrevia(plan, claves, ignoradas, vacias, file.name);
}
function planificar(filas, mapa, vacias) {
  const porCod = new Map(S.lista.map(i => [i.codigo, i])), porNom = new Map(S.lista.map(i => [norm(i.nombre), i]));
  const vistos = new Map(), nombresFinales = new Map(S.lista.map(i => [norm(i.nombre), i.id]));
  const max = S.config.pases_max || 10, out = [];
  for (const { r, fila } of filas) {
    const o = { _fila: fila }; let vacia = true;
    for (const [k, campoK] of Object.entries(mapa)) { const v = String(r[k] ?? '').trim(); o[campoK] = v; if (v) vacia = false; }
    if (vacia) continue;
    const p = { fila, datos: o, errores: [] };
    if ('codigo' in o) o.codigo = o.codigo.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if ('nombre' in o) o.nombre = o.nombre.replace(/\s+/g, ' ');
    if ('asistencia' in o && o.asistencia) {
      const a = norm(o.asistencia);
      o.asistencia = /^(si|s|yes|x|1|asist|confirm)/.test(a) ? 'si' : /^(no|n|0)/.test(a) ? 'no' : (p.errores.push('Asistencia no reconocida (usa Sí o No)'), '');
    }
    for (const k of ['pases_asignados', 'pases_confirmados']) if (o[k]) { const n = Number(o[k]); if (!Number.isInteger(n) || n < (k === 'pases_asignados' ? 1 : 0) || n > max) p.errores.push(`${k === 'pases_asignados' ? 'Pases asignados' : 'Pases confirmados'} inválido (0–${max})`); else o[k] = String(n); }
    const ex = (o.codigo && porCod.get(o.codigo)) || (o.nombre && porNom.get(norm(o.nombre))) || null;
    p.existente = ex; p.accion = ex ? 'actualizar' : 'nuevo';
    if (!ex && !o.nombre) p.errores.push(o.codigo ? `Código ${o.codigo} no existe y falta el nombre` : 'Falta el nombre');
    const clave = ex ? 'id' + ex.id : 'n' + norm(o.nombre);
    const repetido = vistos.has(clave);
    if (repetido) p.errores.push(`Repetido en el archivo (fila ${vistos.get(clave)})`); else vistos.set(clave, fila);
    if (o.nombre && !repetido) { const dueño = nombresFinales.get(norm(o.nombre)); if (dueño != null && dueño !== (ex?.id ?? -1)) p.errores.push('Nombre ya usado por otro invitado: agrega apellido o parentesco'); else nombresFinales.set(norm(o.nombre), ex?.id ?? -fila); }
    const usar = k => k in o && (vacias || o[k] !== '');
    const fin = { ...(ex || { pases_asignados: 1, asistencia: null, pases_confirmados: null }) };
    if (usar('pases_asignados') && o.pases_asignados) fin.pases_asignados = +o.pases_asignados;
    if (usar('asistencia')) fin.asistencia = o.asistencia || null;
    if (usar('pases_confirmados')) fin.pases_confirmados = o.pases_confirmados === '' ? null : +o.pases_confirmados;
    if (fin.asistencia === 'si' && fin.pases_confirmados > fin.pases_asignados) p.errores.push('Pases confirmados mayor que pases asignados');
    if (ex && !p.errores.length) {
      const cambia = ['nombre', 'tratamiento', 'mesa', 'telefono', 'respuesta_novios', 'pases_asignados', 'asistencia', 'pases_confirmados'].some(k => {
        if (!(k in o)) return false;
        const v = o[k], a = String(ex[k] ?? '');
        if (v === '') return vacias && a !== '' && !['nombre', 'pases_asignados'].includes(k);
        return String(v) !== a;
      });
      if (!cambia) p.accion = 'igual';
    }
    if (p.errores.length) p.accion = 'error';
    out.push(p);
  }
  return out;
}
function vistaPrevia(plan, claves, ignoradas, vacias, archivo) {
  const c = a => plan.filter(p => p.accion === a).length, validos = plan.filter(p => p.accion === 'nuevo' || p.accion === 'actualizar');
  const etiqueta = { nuevo: ['Nuevo', 'bg-emerald-50 text-emerald-700'], actualizar: ['Actualiza', 'bg-sky-50 text-sky-700'], igual: ['Sin cambios', 'bg-stone-100 text-stone-500'], error: ['Error', 'bg-rose-50 text-rose-700'] };
  const nombresCol = claves.map(k => COLUMNAS.find(x => x[0] === k)[1]);
  const orden = { error: 0, nuevo: 1, actualizar: 2, igual: 3 };
  const filas = [...plan].sort((a, b) => orden[a.accion] - orden[b.accion]).slice(0, 300);
  modal(`${cabecera('Vista previa de la importación', esc(archivo))}${cuerpo(`
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
      ${[['nuevo', 'Nuevos'], ['actualizar', 'Se actualizan'], ['igual', 'Sin cambios'], ['error', 'Con errores']].map(([a, t]) => `<div class="rounded-xl p-3 ${etiqueta[a][1]}"><p class="text-2xl font-semibold tabular-nums">${c(a)}</p><p class="text-xs">${t}</p></div>`).join('')}</div>
    <p class="mt-3 text-xs text-stone-500">Columnas usadas: <b>${nombresCol.join(', ')}</b>.${ignoradas.length ? ` Ignoradas: ${esc(ignoradas.join(', '))}.` : ''} Celdas vacías: ${vacias ? '<b>borran</b> el valor' : 'se ignoran'}.</p>
    ${c('error') ? `<p class="mt-2 rounded-xl bg-rose-50 p-2.5 text-xs text-rose-700">Las filas con error no se importarán. Corrígelas en el Excel y vuelve a subirlo, o continúa con el resto.</p>` : ''}
    <div class="mt-3 overflow-x-auto rounded-xl ring-1 ring-stone-200"><table class="min-w-full text-xs">
      <thead class="bg-stone-50 text-left text-stone-500"><tr><th class="px-2 py-2">Fila</th><th class="px-2 py-2">Acción</th><th class="px-2 py-2">Nombre</th>${claves.filter(k => k !== 'nombre').map(k => `<th class="px-2 py-2">${COLUMNAS.find(x => x[0] === k)[1]}</th>`).join('')}<th class="px-2 py-2">Detalle</th></tr></thead>
      <tbody class="divide-y divide-stone-100">${filas.map(p => `<tr class="align-top">
        <td class="px-2 py-1.5 tabular-nums text-stone-400">${p.fila}</td>
        <td class="px-2 py-1.5"><span class="whitespace-nowrap rounded-full px-2 py-0.5 ${etiqueta[p.accion][1]}">${etiqueta[p.accion][0]}</span></td>
        <td class="px-2 py-1.5 font-medium">${esc(p.datos.nombre || p.existente?.nombre || '')}${p.existente && p.datos.nombre && norm(p.datos.nombre) !== norm(p.existente.nombre) ? `<div class="font-normal text-stone-400">antes: ${esc(p.existente.nombre)}</div>` : ''}</td>
        ${claves.filter(k => k !== 'nombre').map(k => { const v = p.datos[k] ?? '', a = p.existente ? String(p.existente[k] ?? '') : ''; const cambia = p.existente && v !== '' && String(v) !== a;
          return `<td class="px-2 py-1.5 ${cambia ? 'font-medium text-sky-700' : ''}">${esc(k === 'asistencia' ? ({ si: 'Sí', no: 'No' }[v] || v) : v)}${cambia && a ? `<div class="font-normal text-stone-400 line-through">${esc(a)}</div>` : ''}</td>`; }).join('')}
        <td class="px-2 py-1.5 text-rose-700">${p.errores.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div>
    ${plan.length > 300 ? `<p class="mt-2 text-xs text-stone-500">Mostrando 300 de ${plan.length} filas.</p>` : ''}`)}
    ${pie(`<button type="button" id="p-volver" class="${btnS} mr-auto">Elegir otro archivo</button><button type="button" class="${btnS}" data-cerrar>Cancelar</button>
      <button type="button" id="p-ok" class="${btnP}" ${validos.length ? '' : 'disabled'}>Importar ${plural(validos.length, 'fila', 'filas')}</button>`)}`, d => {
    d.querySelector('#p-volver').onclick = importar;
    d.querySelector('#p-ok').onclick = async () => {
      const b = d.querySelector('#p-ok'); b.disabled = true; b.textContent = 'Importando…';
      const enviar = validos.map(p => { const o = { ...p.datos }; if (!o.codigo && p.existente) o.codigo = p.existente.codigo; return o; });
      const { data, error } = await sb.rpc('admin_importar', { p_filas: enviar, p_vacias_borran: vacias });
      if (error) { b.disabled = false; b.textContent = 'Reintentar'; return toast(errorAmigable(error), 'error'); }
      await recargar();
      if (data.errores?.length) {
        modal(cabecera('Importación con observaciones') + cuerpo(`<p class="text-sm">Nuevos: <b>${data.nuevos}</b> · Actualizados: <b>${data.actualizados}</b> · Sin cambios: <b>${data.sin_cambios}</b></p>
          <ul class="mt-3 space-y-1 text-sm text-rose-700">${data.errores.map(e => `<li>Fila ${e.fila}${e.nombre ? ` (${esc(e.nombre)})` : ''}: ${esc(e.error)}</li>`).join('')}</ul>`) + pie(`<button class="${btnP}" data-cerrar>Entendido</button>`));
      } else { dlg.close(); toast(`Importación lista · ${data.nuevos} nuevos · ${data.actualizados} actualizados`); }
    };
  });
}

(async () => {
  if (CONFIG.SUPABASE_URL.includes('TU-PROYECTO')) {
    $('#app').innerHTML = `<p class="m-6 rounded-xl bg-amber-50 p-4 text-amber-800">Configura SUPABASE_URL y SUPABASE_ANON al inicio de este archivo.</p>`;
    return;
  }
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; setTimeout(pantallaNuevaClave); return; }
    if (ses && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrar(ses));
    if (ev === 'SIGNED_OUT' || (ev === 'INITIAL_SESSION' && !ses)) {
      if (S.canal) { sb.removeChannel(S.canal); S.canal = null; }
      S.user = null;
      if (S.recuperando && ev === 'INITIAL_SESSION') { S.recuperando = false; return pantallaLogin('El enlace venció o ya fue usado. Solicita uno nuevo.'); }
      pantallaLogin();
    }
  });
})();
