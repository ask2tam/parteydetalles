<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Confirma tu asistencia</title>
<!-- Página directa del RSVP (destino del QR). Genérica: sirve para cualquier proyecto.
     El proyecto se toma de la carpeta (/ignacioysuly/rsvp.html) o de ?p=slug. -->
<script src="../assets/pyd-config.js"></script>   <!-- incluye la redirección del rol staff -->
<script src="../assets/boda-api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root { --papel: #FBF8F3; --tinta: #2B2622; --acento: #B08D57; --suave: #8A7F75; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: color-mix(in srgb, var(--papel) 70%, #e9e1d6); color: var(--tinta);
         font-family: Georgia, "Times New Roman", serif; display: flex; justify-content: center;
         padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom)); }
  .pagina { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
  .cab { text-align: center; padding: 8px 24px 22px; }
  .pre { margin: 0; font: 600 11px/1.4 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--acento); }
  h1 { margin: 10px 0 6px; font: 400 clamp(34px, 10vw, 46px)/1.05 "Titulo Boda", "Snell Roundhand", Georgia, serif; }
  .sub { margin: 0; font-size: 15px; letter-spacing: .12em; color: var(--suave); min-height: 1.2em; }
  #rsvp { width: 100%; --rsvp-relleno: 0 16px 8px; }
  .ver { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 12px 22px; border-radius: 999px;
         border: 1.5px solid var(--acento); color: var(--acento); background: #fff; text-decoration: none;
         font: 600 13px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .ver:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }
  .ver svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { margin-top: 26px; font: 12px/1.5 system-ui, sans-serif; color: var(--suave); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main class="pagina">
  <header class="cab">
    <p class="pre">Confirmación de asistencia</p>
    <h1 id="titulo">&nbsp;</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div id="rsvp"></div>

  <a class="ver" id="ver" href="#" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 8h8M8 12h5"/></svg>
    Ver invitación completa
  </a>
  <footer>Hecho con amor por <a id="ig" href="#" target="_blank" rel="noopener">Parte y Detalles</a></footer>
</main>
<script>
  (function () {
    document.getElementById('ig').href = (window.PYD && PYD.INSTAGRAM) || '#';
    var urlInv = '';
    function enlace() {
      var cod = new URLSearchParams(location.search).get('to'), u;
      try { u = new URL(urlInv, location.href); } catch (e) { return; }
      if (cod) u.searchParams.set('to', cod);
      document.getElementById('ver').href = u.toString();
    }
    window.addEventListener('rsvp:proyecto', function (e) {
      var p = e.detail || {}, t = p.tarjeta || {}, c = t.colores || {}, r = document.documentElement.style;
      ['papel', 'tinta', 'acento', 'suave'].forEach(function (k) { if (c[k]) r.setProperty('--' + k, c[k]); });
      document.getElementById('titulo').textContent = t.titulo || p.nombre || '';
      document.getElementById('sub').textContent = t.fecha || '';
      document.title = 'Confirma tu asistencia · ' + (t.titulo || p.nombre || '');
      urlInv = p.urlInvitacion || '';
      document.getElementById('ver').hidden = !urlInv;
      enlace();
    });
    window.addEventListener('rsvp:invitado', enlace);
  })();
</script>
<script src="../assets/qr.js" defer></script>
<script src="../assets/rsvp.js" defer></script>
</body>
</html>
