<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pili & Juan Pa</title>
<meta property="og:title" content="Pili &amp; Juan Pa · Nos casamos" />
<meta property="og:description" content="Te invitamos a nuestra boda — 17 de Octubre." />
<meta property="og:image" content="https://bodas.parteydetalles.com/piliyjuanpa/miniatura.jpg" />
<link rel="icon" href="favicon.ico" type="image/x-icon"/>

  <!-- ========================================================================== -->
  <!-- 1. ESTILOS AISLADOS DE LA PORTADA / OVERLAY                               -->
  <!-- ========================================================================== -->
  <style>
    /* Fuentes locales */
    @font-face {
      font-family: 'WeddingSerifOverlay';
      src: url('assets/e58c18b36ad4165050b3e1e4a9630299.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingSansOverlay';
      src: url('assets/d03c54154a623d2ee20a92055206f9ee.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingCursiveOverlay';
      src: url('assets/3e3457d475095ca62238d2567391b968.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    /* Bloqueo estricto del scroll hasta abrir el sobre */
    html.overlay-active, 
    html.overlay-active body {
      overflow: hidden !important;
      height: 100vh !important;
      position: fixed !important;
      width: 100vw !important;
    }

    /* Capa flotante principal */
    #hero-screen-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2147483647 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-end !important;
      align-items: center !important;
      background-color: #121212 !important;
      background-image: url('assets/fondo.png') !important;
      background-repeat: no-repeat !important;
      background-size: auto 100vh !important;
      background-position: center 30% !important;
      transition: opacity 1.2s ease-in-out, filter 1.2s ease-in-out !important;
      font-family: 'WeddingSansOverlay', sans-serif !important;
      color: #ffffff !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 0 calc(95px + env(safe-area-inset-bottom)) 0 !important;
    }

    @media (min-width: 601px) {
      #hero-screen-overlay {
        background-size: 120vw auto !important;
        background-position: center 30% !important;
        padding-bottom: 70px !important;
      }
    }

    /* Capa de oscurecimiento */
    .hero-overlay-bg {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      background: rgba(0, 0, 0, 0.35) !important;
      z-index: 1 !important;
      opacity: 0 !important;
      transition: opacity 1s ease !important;
    }

    #hero-screen-overlay.loaded .hero-overlay-bg {
      opacity: 1 !important;
    }

    #hero-screen-overlay.fade-out {
      opacity: 0 !important;
      filter: blur(4px) !important;
      pointer-events: none !important;
    }

    /* Elementos visibles en la carga inicial */
    .header-content-overlay,
    .envelope-wrapper-overlay {
      opacity: 0 !important;
      transition: opacity 1.2s ease-in-out !important;
    }

    #hero-screen-overlay.loaded .header-content-overlay,
    #hero-screen-overlay.loaded .envelope-wrapper-overlay {
      opacity: 1 !important;
    }

    /* Tipografía de la Portada */
    .header-content-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      color: #ffffff !important;
      text-transform: uppercase !important;
      padding: 0 10px !important;
      margin-bottom: 100px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      width: 100% !important;
      max-width: 500px !important;
    }

    .sub-title-overlay {
      font-family: 'WeddingSerifOverlay', serif !important;
      font-size: 15px !important;
      letter-spacing: 0.25em !important;
      font-weight: 300 !important;
      margin: 0 0 20px 0 !important;
      opacity: 0.95 !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6) !important;
    }

    .main-title-overlay {
      font-family: 'WeddingSerifOverlay', serif !important;
      font-size: 52px !important;
      line-height: 0.95 !important;
      font-weight: 300 !important;
      letter-spacing: 0.12em !important;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7) !important;
      margin: 0 !important;
    }

    .title-pili {
      margin-bottom: 10px !important;
    }

    @media (max-width: 600px) {
      .main-title-overlay {
        font-size: 46px !important;
        letter-spacing: 0.1em !important;
      }
    }

    .center-row-overlay {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 60% !important;
      margin: 6px 0 12px 0 !important;
    }

    .line-overlay {
      flex-grow: 1 !important;
      height: 2px !important;
      background-color: rgba(255, 255, 255, 0.65) !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5) !important;
    }

    .y-image-overlay {
      height: 70px !important;
      width: auto !important;
      margin: 0 14px !important;
      display: inline-block !important;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)) !important;
    }

    .date-title-overlay {
      font-family: 'WeddingSerifOverlay', serif !important;
      font-size: 15px !important;
      letter-spacing: 0.22em !important;
      font-weight: 300 !important;
      margin-top: 20px !important;
      opacity: 0.92 !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6) !important;
    }

    /* ========================================================================== */
    /* CONTENEDOR DEL SOBRE Y ANIMACIÓN DE APERTURA                               */
    /* ========================================================================== */
    .envelope-wrapper-overlay {
      position: relative !important;
      z-index: 3 !important;
      width: 82% !important;
      max-width: 390px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      margin: 25px 0 0 0 !important;
      aspect-ratio: 1.38 / 1 !important;
      overflow: visible !important;
    }

    @media (min-width: 601px) {
      .envelope-wrapper-overlay {
        width: 80% !important;
        max-width: 440px !important;
      }
    }

    .envelope-wrapper-overlay.ready {
      cursor: pointer !important;
      pointer-events: auto !important;
    }

    /* Capas internas base */
    .envelope-layer {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
    }

    /* 0. Fondo interior estático del sobre (sobre_fondo.png): Detrás de la tarjeta */
    .envelope-back-interior {
      position: absolute !important;
      top: -46.86% !important;
      left: 2% !important;
      width: 100% !important;
      height: 150% !important;
      background-image: url('assets/sobre_fondo.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
	  background-position: bottom center !important;
      z-index: 1 !important;
    }

    /* 1. Fondo abierto con hojas: Aparece a la mitad del tiempo de la solapa (0.5s) */
    .envelope-open-bg {
      position: absolute !important;
      top: -46.86% !important; 
      left: 2% !important;
      width: 100% !important;
      height: 150% !important; 
      background-image: url('assets/ca970addf72d79f3ec05bb08a9483a73.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      background-position: bottom center !important;
      z-index: 2 !important;
      opacity: 0 !important;
      transition: opacity 0.4s ease 0.5s !important; 
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-open-bg {
      opacity: 1 !important;
    }

    /* 2. Tarjeta desplegable: Inicia justo cuando termina la solapa (1.1s) */
    .envelope-card {
      position: absolute !important;
      width: 80% !important;
      left: 10% !important;
      top: 25% !important;
      height: 70% !important;
      background-image: url('assets/tarjeta.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      z-index: 3 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      padding: 15px 20px !important;
      box-sizing: border-box !important;
      color: #4a4a4a !important;
      font-family: 'WeddingSerifOverlay', serif !important;
      transform: translateY(0) !important;
      opacity: 1 !important;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1) 1.1s !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-card {
      transform: translateY(-75%) !important;
    }

    /* Textos internos de la tarjeta */
    .card-reserved-title {
      font-size: 10px !important;
      letter-spacing: 0.18em !important;
      text-transform: uppercase !important;
      color: #8C9070 !important;
      margin-bottom: 4px !important;
    }

    .card-reserved-name {
      font-size: 15px !important;
      font-weight: bold !important;
      color: #2c2c2c !important;
      margin-bottom: 6px !important;
      line-height: 1.2 !important;
    }

    .card-reserved-seats {
      font-size: 10px !important;
      letter-spacing: 0.12em !important;
      color: #666666 !important;
      margin-bottom: 12px !important;
    }

    /* Botón interno: Aparece inmediatamente al terminar la tarjeta (a los 2.3s exactos) */
    .btn-ver-invitacion-card {
      background: #8C9070 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 7px 18px !important;
      border-radius: 20px !important;
      font-size: 9px !important;
      font-weight: 500 !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      cursor: pointer !important;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2) !important;
      transition: background 0.2s ease, transform 0.2s ease !important;
      pointer-events: none;
      opacity: 0;
    }

    .envelope-wrapper-overlay.opening-sequence .btn-ver-invitacion-card {
      pointer-events: auto !important;
      opacity: 1 !important;
      transition: opacity 0.3s ease 2.3s, background 0.2s ease !important;
    }

    .btn-ver-invitacion-card:hover {
      background: #7A7E5F !important;
      transform: scale(1.03) !important;
    }

    /* 3. Frente del sobre cerrado */
    .envelope-front-body {
      background-image: url('assets/9e79a22f226af82406330ab23d362810.png') !important;
      z-index: 4 !important;
    }

    /* 4. Solapa superior animada (1.1s) */	
    .envelope-flap {
      position: absolute !important;
      top: -49% !important;
      left: 2.5% !important;
      width: 96% !important;
      height: 54% !important;
      background-image: url('assets/solapa_superior.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      background-position: top center !important;
      transform: rotateX(180deg) !important;
      transform-origin: 50% 100% !important;
      z-index: 5 !important;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease 0.9s !important;
    }

    .envelope-wrapper-overlay.opening-sequence .envelope-flap {
      transform: rotateX(0deg) !important;
      opacity: 0 !important;
    }

    /* Animación de latido inicial */
    @keyframes heartbeatOverlay {
      0% { transform: scale(1); }
      15% { transform: scale(1.03); }
      30% { transform: scale(1); }
      45% { transform: scale(1.03); }
      60% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .envelope-wrapper-overlay.ready {
      animation: heartbeatOverlay 2.5s infinite ease-in-out !important;
    }

    .envelope-wrapper-overlay.opening-sequence {
      animation: none !important;
    }

    /* ========================================================================== */
    /* BOTÓN INICIAL: ABRE EL SOBRE                                              */
    /* ========================================================================== */
    .btn-abrir-status-overlay {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      opacity: 1 !important;
      z-index: 10 !important;
      padding: 12px 28px !important;
      border-radius: 28px !important;
      background: #8C9070 !important;
      color: #ffffff !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      letter-spacing: 3px !important;
      text-transform: uppercase !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      display: inline-block !important;
      text-align: center !important;
      white-space: nowrap !important;
      will-change: top, opacity !important;
      cursor: default !important;
    }

    .btn-abrir-status-overlay.animating {
      transition: top 1.3s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay,
    .btn-abrir-status-overlay.ready-btn {
      cursor: pointer !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay:hover,
    .btn-abrir-status-overlay.ready-btn:hover {
      background: #7A7E5F !important;
    }

    .envelope-wrapper-overlay.opening-sequence ~ .btn-abrir-status-overlay {
      opacity: 0 !important;
      transform: translate(-50%, 25px) !important;
      transition: opacity 0.3s ease !important;
      pointer-events: none !important;
    }

    /* Control de Música Flotante */
    #btn-musica-overlay {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 2147483647 !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background-color: #8C9070 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: white !important;
      display: none;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35) !important;
      transition: transform 0.2s ease, background-color 0.2s ease !important;
    }
  </style>

  <script>document.documentElement.classList.add('overlay-active');</script>
</head>
<body>

  <!-- ========================================================================== -->
  <!-- 2. ESTRUCTURA HTML DEL OVERLAY                                            -->
  <!-- ========================================================================== -->

  <!-- AUDIO -->
  <audio id="musica-boda-overlay" src="assets/musica.mp3" preload="auto" loop></audio>

  <!-- BOTÓN FLOTANTE MÚSICA -->
  <button id="btn-musica-overlay" aria-label="Silenciar música">
    <svg id="icon-sound-on-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    <svg id="icon-sound-off-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
  </button>

  <!-- PORTADA OVERLAY -->
  <div id="hero-screen-overlay">
    <div class="hero-overlay-bg"></div>

    <header class="header-content-overlay">
      <p class="sub-title-overlay">¡NUESTRA BODA!</p>
      <h1 class="main-title-overlay title-pili">PILI</h1>
      
      <div class="center-row-overlay">
        <div class="line-overlay"></div>
        <img src="assets/letra_y.png" alt="y" class="y-image-overlay">
        <div class="line-overlay"></div>
      </div>

      <h1 class="main-title-overlay">JUAN PA</h1>
      <p class="date-title-overlay">17 DE OCTUBRE 2026</p>
    </header>

    <!-- COMPONENTES DE APERTURA DEL SOBRE -->
    <div id="envelope-wrapper-overlay" class="envelope-wrapper-overlay">
      <div class="envelope-back-interior"></div>
      <div class="envelope-open-bg"></div>
      <div class="envelope-card">
        <span class="card-reserved-title">Reservado para:</span>
        <!-- Elementos dinámicos para el nombre y los pases -->
        <span id="card-name-target" class="card-reserved-name">Invitado Especial</span>
        <span id="card-seats-target" class="card-reserved-seats">Pase para ( 2 ) personas</span>
        <button id="btn-ver-invitacion-final" class="btn-ver-invitacion-card">Ver invitación</button>
      </div>
      <div class="envelope-layer envelope-front-body"></div>
      <div class="envelope-flap"></div>
    </div>

    <!-- Botón inicial de apertura -->
    <span id="btn-abrir-text-overlay" class="btn-abrir-status-overlay">Cargando...</span>
  </div>

  <!-- PEGA AQUÍ TODO EL CONTENIDO ORIGINAL QUE VIENE DE CANVA -->


  <!-- ========================================================================== -->
  <!-- 3. LÓGICA DE PRECARGA Y ANIMACIÓN Y PARÁMETROS URL                         -->
  <!-- ========================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- LÓGICA DE PARÁMETROS URL (?invitado= & ?pase=) ---
      const urlParams = new URLSearchParams(window.location.search);
      
      const invitadoParam = urlParams.get('invitado');
      const paseParam = urlParams.get('pase');

      const nameTarget = document.getElementById('card-name-target');
      const seatsTarget = document.getElementById('card-seats-target');
	  //const seatsTarget2 = document.getElementById('card-seats-target2');

      // 1. Manejo del nombre (Espacios: Usar '+' o '%20' en la URL, JS los lee automáticamente)
      if (invitadoParam) {
        // decodeURIComponent procesa adecuadamente tanto %20 como los signos de más (+)
        nameTarget.innerText = decodeURIComponent(invitadoParam.replace(/\+/g, ' '));
      }

      // 2. Manejo de pases (Singular vs Plural)
      if (paseParam) {
        const numPases = parseInt(paseParam, 10) || 1;
        if (numPases === 1) {
          seatsTarget.innerText = `Pase para ( 1 ) persona`;
		  //seatsTarget2.innerText = `( 1 ) persona`;
        } else {
          seatsTarget.innerText = `Pase para ( ${numPases} ) personas`;
		  //seatsTarget2.innerText = `( ${numPases} ) personas`;
        }
      }

      // --- ANIMACIÓN Y AUDIO ---
      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeWrapper = document.getElementById('envelope-wrapper-overlay');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const btnVerInvitacionFinal = document.getElementById('btn-ver-invitacion-final');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarImagen(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(url);
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      function obtenerPosicionBoton() {
        const rect = envelopeWrapper.getBoundingClientRect();
        return `${rect.top + (rect.height * 0.86)}px`;
      }

      Promise.all([
        precargarImagen('assets/fondo.png'),
        precargarImagen('assets/9e79a22f226af82406330ab23d362810.png'),
        precargarImagen('assets/sobre_fondo.png'),
        precargarImagen('assets/ca970addf72d79f3ec05bb08a9483a73.png'),
        precargarImagen('assets/solapa_superior.png'),
        precargarImagen('assets/tarjeta.png'),
        precargarImagen('assets/letra_y.png'),
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]).then(() => {
        heroScreen.classList.add('loaded');
        setTimeout(() => {
          btnAbrirText.classList.add('animating');
          void btnAbrirText.offsetHeight; 
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeWrapper.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 650);
        }, 2000);
      });

      window.addEventListener('resize', () => {
        if (envelopeWrapper.classList.contains('ready')) {
          btnAbrirText.style.setProperty('top', obtenerPosicionBoton(), 'important');
        }
      });

      function abrirSobre(e) {
        if (!envelopeWrapper.classList.contains('ready')) return;
        if (e) e.stopPropagation();
        
        envelopeWrapper.classList.remove('ready');
        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        envelopeWrapper.classList.add('opening-sequence');
      }

      function desplegarCanva(e) {
        if (e) e.stopPropagation();
        heroScreen.classList.add('fade-out');
        setTimeout(() => {
          heroScreen.remove();
          document.documentElement.classList.remove('overlay-active');
          window.scrollTo(0, 0);
        }, 1200);
      }

      envelopeWrapper.addEventListener('click', abrirSobre);
      btnAbrirText.addEventListener('click', abrirSobre);
      btnVerInvitacionFinal.addEventListener('click', desplegarCanva);

      btnMusica.addEventListener('click', function(e) {
        e.stopPropagation();
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
