  .g-barra button::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 4px; height: 1.5px; background: var(--terracota); transform: scaleX(0); transition: transform .4s cubic-bezier(.16, 1, .3, 1); }

<!-- =====================================================================================
     PORTADA EN SHADOW DOM (ningún estilo de Canva la alcanza). Reconstruida a partir de portada.html de Canva, a pantalla completa:
     papel de fondo (ya horneado con su «filtro»: papel al 24 % sobre el rosa) · título · «¡NOS CASAMOS!» · sobre de DOBLE PUERTA con sello.
     El escenario (#stage) mide 485 × 1072 (el lienzo de Canva): todo se ubica en % de él, así queda alineado en cualquier pantalla.
     Apertura: el sello se despega y cae al borde inferior del sobre → las dos puertas giran hacia afuera (JS, cuadro a cuadro: se ve igual
     en iPhone y Android, aunque el sistema pida reducir movimiento) → la tarjeta del interior se adelanta con el nombre y los pases → «Ver invitación».
     ===================================================================================== -->
<template id="portada-plantilla">
<style>
  :host { all: initial; display: block; position: fixed; inset: 0; }
  .gate { position: absolute; inset: 0; overflow: hidden; background: #F7E4E3 url('assets/portada_fondo.jpg') center / cover no-repeat; font-synthesis: none;
          -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
          --d-tarjeta: 1.75s; --t-tarjeta: 1.1s; --d-cab: .5s; --t-cab: 1.6s; --d-cam: 1.5s; --t-cam: 1.8s; }
  .gate *, .gate *::before, .gate *::after { box-sizing: border-box; }
  #stage { position: absolute; left: 0; top: 0; container-type: inline-size; }

  /* ---------- Cabecera: título (imagen) + «¡NOS CASAMOS!» (texto, cambia con el idioma) ---------- */
  .cab { position: absolute; inset: 0; pointer-events: none; transition: transform var(--t-cab) cubic-bezier(.45,.05,.25,1) var(--d-cab); }
  .gate.abierto .cab { transform: translateY(-5cqw); }
  .cab-titulo { position: absolute; left: 11.05%; top: 18.74%; width: 77.9%; margin: 0; }
  .cab-titulo img { display: block; width: 100%; height: auto; -webkit-user-drag: none;
                    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 58.3%, transparent 100%);
                            mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 58.3%, transparent 100%);
                    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: 100% 0; mask-position: 100% 0; }
  .gate.lista .cab-titulo img { -webkit-mask-position: 0 0; mask-position: 0 0; transition: -webkit-mask-position 2.2s cubic-bezier(.45,.05,.2,1) .3s, mask-position 2.2s cubic-bezier(.45,.05,.2,1) .3s; }
  .cab-sub { position: absolute; left: 0; right: 0; top: 28.4%; margin: 0; text-align: center; color: rgb(178, 100, 78);
             font: 700 4.46cqw/1.2 'YACgEeV8bIQ_0', Georgia, serif; text-transform: uppercase; letter-spacing: .02em;
             opacity: 0; transform: translateY(1.2cqw); transition: opacity 1.2s ease 1.6s, transform 1.4s cubic-bezier(.16,1,.3,1) 1.6s; }
  .gate.lista .cab-sub { opacity: 1; transform: none; }

  /* ---------- El sobre (doble puerta) ---------- */
  /* Marco del sobre = la parte OPACA del PNG de Canva (575 × 800, ver generar_portada_moaniyjavier.py): así la bisagra de cada puerta
     coincide con el borde del cuerpo y no queda rendija al abrir. Posición = la del sobre de Canva corrida 5 px de 582. */
  .cam-pos { position: absolute; left: 16.31%; width: 67.735%; top: 32.38%; }
  .cam { opacity: 0; transform-origin: 50% 45%; transition: opacity 1.2s ease, transform var(--t-cam) cubic-bezier(.45,.05,.25,1) var(--d-cam); }
  .gate.lista .cam { opacity: 1; }
  .gate.abierto .cam { transform: translateY(4.4%) scale(1.12); }          /* la «cámara» se acerca a la tarjeta (sin tapar el título) */
  .env { position: relative; width: 100%; aspect-ratio: 575 / 800; perspective-origin: 50% 46%; }
  .pieza { position: absolute; top: 0; height: 100%; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; }
  .base { left: 0; width: 100%; z-index: 1; background-image: url('assets/sobre_base.webp'); filter: drop-shadow(0 8px 14px rgba(90, 50, 40, .22)); }
  /* sombra que las puertas cerradas dejan dentro del sobre (se aclara mientras se abren; la maneja el JS) */
  .sombra { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: 1.2%; background: radial-gradient(120% 90% at 50% 50%, rgba(40,30,15,0) 40%, rgba(40,30,15,.5) 100%), rgba(40,30,15,.35); opacity: 1; }
  /* Puertas: la izquierda gira sobre su borde izquierdo y la derecha sobre el derecho. Cada una tiene dos caras: a los 90° (de canto) el JS cambia
     de cara (sin backface-visibility: Safari la ignora en algunos contextos). La cara interior se refleja (scaleX(-1)) para anular el espejo del giro. */
  .puerta { position: absolute; top: 0; height: 100%; z-index: 4; pointer-events: none; will-change: transform; }
  .p-izq { left: 0; width: 49.913%; transform-origin: 0 50%; }          /* 287 / 575: la costura queda donde estaba */
  .p-der { right: 0; width: 50.087%; transform-origin: 100% 50%; }       /* 288 / 575 */
  .cara { position: absolute; inset: 0; background-size: 100% 100%; background-repeat: no-repeat; --sh: 0; }
  .cara::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: rgba(35, 32, 14, var(--sh)); -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat; mask: var(--m) 0 0 / 100% 100% no-repeat; }
  .p-izq .frente { background-image: url('assets/puerta_izq.webp'); --m: url('assets/puerta_izq.webp'); }
  .p-der .frente { background-image: url('assets/puerta_der.webp'); --m: url('assets/puerta_der.webp'); }
  .p-izq .dorso  { background-image: url('assets/puerta_izq_dentro.webp'); --m: url('assets/puerta_izq_dentro.webp'); transform: scaleX(-1); visibility: hidden; }
  .p-der .dorso  { background-image: url('assets/puerta_der_dentro.webp'); --m: url('assets/puerta_der_dentro.webp'); transform: scaleX(-1); visibility: hidden; }
  .p-izq .frente { filter: drop-shadow(1px 0 1px rgba(40, 35, 15, .18)); }

  /* ---------- Sello: late mientras espera · se despega, se levanta y cae al borde inferior del sobre ---------- */
  .sello-caja { position: absolute; left: 49.74%; top: 50.44%; width: 26.75%; z-index: 6; transform: translate(-50%, -50%); pointer-events: none; }
  .sello-lat { width: 100%; transform-origin: 50% 50%; }
  .sello-img { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 5px rgba(90, 50, 30, .3)); }
  .gate.lat-sello:not(.abierto) .sello-lat { animation: sello-latido 1.7s infinite ease-in-out; }
  @keyframes sello-latido { 0% { transform: scale(1); } 12% { transform: scale(1.1); } 24% { transform: scale(1); } 36% { transform: scale(1.07); } 52% { transform: scale(1); } 100% { transform: scale(1); } }
  .gate.abierto .sello-caja { animation: sello-caja 1.5s cubic-bezier(.5, 0, .2, 1) forwards; }
  .gate.abierto .sello-img { animation: sello-img 1.5s cubic-bezier(.5, 0, .2, 1) forwards; }
  /* cae ~2.5 alturas del sello: su centro queda en el borde inferior del sobre (mitad afuera) */
  @keyframes sello-caja { 0% { transform: translate(-50%, -50%); } 28% { transform: translate(-50%, -58%); } 100% { transform: translate(-50%, calc(-50% + 250%)); } }
  @keyframes sello-img  { 0% { transform: scale(1) rotate(0); } 28% { transform: scale(1.16) rotate(-7deg); filter: drop-shadow(0 12px 12px rgba(90,50,30,.38)); }
                          100% { transform: scale(.66) rotate(4deg); filter: drop-shadow(0 3px 5px rgba(90,50,30,.32)); } }

    var sec = raizInv && raizInv.querySelector('section'), r = sec && sec.getBoundingClientRect();
    if (r && r.bottom < window.innerHeight - 8) { el.style.bottom = 'auto'; el.style.top = Math.max(60, r.bottom - 16 - el.offsetHeight) + 'px'; }
    el.classList.add('ver');
    var fin = function () {
      window.removeEventListener('scroll', alMover); window.removeEventListener('wheel', fin); window.removeEventListener('touchmove', fin); window.removeEventListener('keydown', fin);
      clearTimeout(t); el.classList.remove('ver'); setTimeout(function () { el.hidden = true; }, 1000);
    };
    var alMover = function () { if (window.scrollY > 30) fin(); };
    var t = setTimeout(fin, 16000);
    window.addEventListener('scroll', alMover, { passive: true }); window.addEventListener('wheel', fin, { passive: true });
    window.addEventListener('touchmove', fin, { passive: true }); window.addEventListener('keydown', fin);
  }
  /* Crédito «Hecho con amor»: discreto (corazón a la izquierda). pyd-config.js lo muestra solo al llegar al final y lo oculta al subir. */
  function creditoAlFinal() {
    if (!P.credito || CONFIG.credito === 'oculto') return;
    window.PYD_SIN_CREDITO = false;
    P.credito({ modo: CONFIG.credito, lang: LANG });
  }

  /* ---------------------------------------------------------------- VENTANAS: RSVP y guía de la ciudad */
  var ventanaAbierta = null, foco = null;
  function abrirVentana(v) {
    if (ventanaAbierta === v) return;
    if (ventanaAbierta) cerrarVentana(true);
    foco = document.activeElement; ventanaAbierta = v;
    v.hidden = false; void v.offsetWidth; v.classList.add('abierta');
    document.documentElement.classList.add('modal');
    v.querySelector('.v-cerrar').setAttribute('aria-label', tx('cerrar'));
    var caja = v.querySelector('.v-caja'); caja.tabIndex = -1;
    setTimeout(function () { try { caja.focus({ preventScroll: true }); } catch (e) {} }, 60);
    try { history.pushState({ ventana: v.id }, ''); } catch (e) {}                 // el botón «atrás» del celular cierra la ventana
  }
  function cerrarVentana(sinHistoria) {
    var v = ventanaAbierta; if (!v) return;
    ventanaAbierta = null; v.classList.remove('abierta');
    document.documentElement.classList.remove('modal');
    setTimeout(function () { if (ventanaAbierta !== v) v.hidden = true; }, 600);
    if (!sinHistoria && history.state && history.state.ventana) { try { history.back(); } catch (e) {} }
    if (foco && foco.focus) try { foco.focus({ preventScroll: true }); } catch (e) {}
  }
  window.addEventListener('popstate', function () { if (ventanaAbierta) cerrarVentana(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ventanaAbierta) cerrarVentana(); });
  ['v-rsvp', 'v-guia'].forEach(function (id) {
    $(id).addEventListener('click', function (e) { if (e.target.closest('[data-cerrar]')) cerrarVentana(); });
  });

  /* RSVP: rsvp.html del evento en un iframe (mismo origen), con el código del invitado y el idioma.
     Dentro se ocultan el selector ES/EN (el idioma ya viene dado), el enlace «Ver invitación completa» y el crédito (ya está en la invitación). */
  var iframeRsvp = null;
  function abrirRsvp() {
    var v = $('v-rsvp');
    if (!iframeRsvp) {
      var u = new URLSearchParams(); if (CODIGO) u.set('to', CODIGO); if (!CODIGO && PASE_URL > 0) u.set('pase', PASE_URL); u.set('lang', LANG);
      iframeRsvp = document.createElement('iframe');
      iframeRsvp.title = 'RSVP'; iframeRsvp.src = 'rsvp.html?' + u.toString();
      iframeRsvp.addEventListener('load', function () {
        try {
          var d = iframeRsvp.contentDocument, st = d.createElement('style');
		  st.textContent = '.cab,.ver,#pyd-credito{display:none!important}.pagina{padding-bottom:28px!important}' +
            'body{padding-top:max(52px,env(safe-area-inset-top))!important}' +
            /* transparencia: sin fondo de página, sin la capa de fondo de rsvp.js y sin la pantalla de carga opaca */
            'html,body{background:transparent!important}#rsvp-pagina{display:none!important}#carga{background:transparent!important}';
          d.head.appendChild(st);
        } catch (e) {}
        iframeRsvp.classList.add('listo');
        setTimeout(function () { $('rsvp-carga').classList.add('fuera'); }, 250);
      });
      v.querySelector('.v-caja').appendChild(iframeRsvp);
    }
    abrirVentana(v);
  }

  /* Guía de la ciudad: barra propia (alineada) + 4 páginas de Canva. Cada página se carga la primera vez que se abre;
     al cambiar de pestaña la nueva entra desde el lado que corresponde y la anterior se desliza al otro. «Inicio» = descubre. */
  var G = { creada: false, actual: -1, pags: [] };
  function crearGuia() {
    if (G.creada) return; G.creada = true;
    var barra = $('g-barra'), cont = $('g-paginas');
    $('v-guia').setAttribute('aria-label', tx('guia'));
    CONFIG.guia.forEach(function (g, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = g.t[LANG]; b.dataset.i = i;
      b.addEventListener('click', function () { irA(i); });
      barra.appendChild(b);
      var pag = document.createElement('div'); pag.className = 'g-pag der'; pag.setAttribute('role', 'region'); pag.setAttribute('aria-label', g.t[LANG].replace('\n', ' '));
      var host = document.createElement('div'); host.className = 'canva-host'; pag.appendChild(host);
      var carga = document.createElement('div'); carga.className = 'v-carga'; carga.innerHTML = '<i></i>'; pag.appendChild(carga);
      cont.appendChild(pag);
      G.pags.push({ cfg: g, pag: pag, host: host, carga: carga, tarea: null, boton: b });
    });
  }
  function cargarPagina(i) {
    var x = G.pags[i]; if (x.tarea) return x.tarea;
    var archivo = x.cfg[LANG], partes, raiz;
    x.tarea = fetch(archivo).then(function (r) { if (!r.ok) throw new Error(archivo + ' → HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        partes = leerCanva(html, [x.cfg.menu]);                       // sin el menú de Canva: la barra de arriba lo reemplaza (alineada)
        raiz = montarCanva(x.host, partes, '', 1);
        var reglas = $('fuentes-guia'); reglas.textContent += '\n' + unirFuentes(partes.fuentes).join('\n');
        raiz.addEventListener('click', function (e) {                // anclas internas del export (#page-…) no navegan
          var a = e.target.closest && e.target.closest('a'); if (a && (a.getAttribute('href') || '').charAt(0) === '#') e.preventDefault();
        });
        Array.prototype.forEach.call(raiz.querySelectorAll('a[href^="http"]'), function (a) { a.target = '_blank'; a.rel = 'noopener'; });
        var primeras = Array.prototype.slice.call(raiz.querySelectorAll('section'), 0, 1), imgs = [];
        primeras.forEach(function (s) { imgs = imgs.concat(Array.prototype.slice.call(s.querySelectorAll('img'))); });
        return Promise.all([Promise.all(imgs.map(esperarImg)), cargarFuentes(partes.familias)]);
      }).then(function () {
        x.ajuste = Responsive.montar(raiz, { anchoOriginal: CONFIG.anchoCanva, anchoMaximo: CONFIG.anchoMaximo, modo: 'ancho', selectorPaginaCanva: CONFIG.canva.selectorPagina });
        x.carga.classList.add('fuera');
        if (window.ResizeObserver) new ResizeObserver(function () { x.ajuste && x.ajuste.reajustar(); }).observe(x.pag);
      }).catch(function (e) { console.error('[guía]', e); x.tarea = null; });
    return x.tarea;
  }
  function irA(i) {
    if (i === G.actual) { G.pags[i].pag.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var ant = G.actual; G.actual = i;
    G.pags.forEach(function (x, k) {
      x.boton.setAttribute('aria-current', k === i ? 'page' : 'false');
      x.pag.classList.toggle('actual', k === i);
      x.pag.classList.toggle('izq', k !== i && k < i);
      x.pag.classList.toggle('der', k !== i && k > i);
      x.pag.inert = k !== i;
    });
    if (ant < 0) { G.pags[i].pag.style.transition = 'none'; void G.pags[i].pag.offsetWidth; G.pags[i].pag.style.transition = ''; }   // la 1.ª vez entra con la ventana
    G.pags[i].pag.scrollTop = 0;
    G.pags[i].boton.scrollIntoView({ block: 'nearest', inline: 'center', behavior: ant < 0 ? 'auto' : 'smooth' });
    cargarPagina(i).then(function () {
      var x = G.pags[i]; x.ajuste && x.ajuste.reajustar();
      if (ant < 0) enReposo(function () { G.pags.forEach(function (y, k) { if (k !== i) cargarPagina(k); }); });   // las demás, en segundo plano
    });
  }
  function abrirGuia() {
    crearGuia(); abrirVentana($('v-guia'));
    irA(0);                                                          // siempre abre en «Inicio» (descubre)
  }

  /* ---------------------------------------------------------------- botones dentro de Canva */
  function enlazarEventos(raiz) {
    raiz.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a'), h = a ? a.getAttribute('href') || '' : '';
      var dest = CONFIG.enlaces.find(function (x) { return e.target.closest && e.target.closest('#' + x.id); });
      if (dest) { e.preventDefault(); e.stopPropagation(); if (dest.accion === 'rsvp') abrirRsvp(); else if (dest.accion === 'guia') abrirGuia(); return; }
      if (a && h.charAt(0) === '#') e.preventDefault();               // anclas internas del export (#page-1…)
    });
  }
  window.MJ = { abrirRsvp: abrirRsvp, abrirGuia: abrirGuia };        // (para probar desde la consola)
})();
