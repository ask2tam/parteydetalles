<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniela & Bruno</title>
<meta property="og:title" content="Daniela &amp; Bruno · Nos casamos" />
<meta property="og:description" content="Te invitamos a nuestra boda — 07 de Noviembre." />
<meta property="og:image" content="https://bodas.parteydetalles.com/danielaybruno/miniatura.jpg" />
<link rel="icon" href="favicon.ico" type="image/x-icon"/>

  <!-- ========================================================================== -->
  <!-- 1. ESTILOS AISLADOS DE LA PORTADA / OVERLAY                               -->
  <!-- ========================================================================== -->
  <style>
    /* Fuentes locales */
    @font-face {
      font-family: 'WeddingSerifOverlay';
      src: url('assets/d14b5ffc49cff7b227fa97a90f871d2c.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingSansOverlay';
      src: url('assets/d03c54154a623d2ee20a92055206f9ee.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingCursiveOverlay';
      src: url('assets/3e3457d475095ca62238d2567391b968.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    /* Bloqueo estricto del scroll de Canva hasta abrir el sobre */
    html.overlay-active, 
    html.overlay-active body {
      overflow: hidden !important;
      height: 100vh !important;
      position: fixed !important;
      width: 100vw !important;
    }

    /* Capa flotante principal */
    #hero-screen-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2147483647 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-end !important;
      align-items: center !important;
      background-color: #121212 !important;
      background-image: url('assets/fondo.png') !important;
      background-repeat: no-repeat !important;
      background-size: auto 135vh !important;
      background-position: center 90% !important;
      transition: opacity 1.6s ease-in-out, filter 1.6s ease-in-out !important;
      font-family: 'WeddingSansOverlay', sans-serif !important;
      color: #ffffff !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 0 calc(95px + env(safe-area-inset-bottom)) 0 !important;
    }

    @media (min-width: 601px) {
      #hero-screen-overlay {
        background-size: 130vw auto !important;
        background-position: center 42% !important;
        padding-bottom: 70px !important;
      }
    }

    /* Capa de oscurecimiento */
    .hero-overlay-bg {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      background: rgba(0, 0, 0, 0.35) !important;
      z-index: 1 !important;
      opacity: 0 !important;
      transition: opacity 1s ease !important;
    }

    #hero-screen-overlay.loaded .hero-overlay-bg {
      opacity: 1 !important;
    }

    #hero-screen-overlay.fade-out {
      opacity: 0 !important;
      filter: blur(6px) !important;
      pointer-events: none !important;
    }

    /* Elementos ocultos durante la carga inicial */
    .header-content-overlay,
    .envelope-image-overlay {
      opacity: 0 !important;
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out !important;
    }

    #hero-screen-overlay.loaded .header-content-overlay,
    #hero-screen-overlay.loaded .envelope-image-overlay {
      opacity: 1 !important;
    }

    /* Tipografía de la Portada */
    .header-content-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      color: #ffffff !important;
      text-transform: uppercase !important;
      padding: 0 10px !important;
      margin-bottom: 25px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }

    #hero-screen-overlay.opening .header-content-overlay {
      opacity: 0 !important;
      transform: translateY(-15px) !important;
    }

    .sub-title-overlay {
      font-family: 'WeddingSansOverlay', sans-serif !important;
      font-size: 13px !important;
      letter-spacing: 0.18em !important;
      font-weight: 400 !important;
      margin: 0 0 12px 0 !important;
      opacity: 0.95 !important;
    }

    /* Nombres */
    .main-title-overlay {
      font-family: 'WeddingSerifOverlay', serif !important;
      font-size: 68px !important;
      line-height: 0.88 !important;
      font-weight: 300 !important;
      letter-spacing: 0.07em !important;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7) !important;
      margin: 0 !important;
    }

    /* SUBIMOS "NOS CASAMOS" + "DANIELA" DANDO MAS MARGEN ABAJO DE DANIELA */
    .title-daniela {
      margin-bottom: 14px !important; /* Incrementado para subir Daniela y descolgar el ampersand */
    }

    @media (max-width: 600px) {
      .main-title-overlay {
        font-size: 60px !important;
      }
    }

    /* '&' - AHORA PERFECTAMENTE CENTRADO ENTRE AMBOS NOMBRES */
    .ampersand-overlay {
      display: block !important;
      font-family: 'WeddingCursiveOverlay', serif !important;
      font-size: 42px !important;
      line-height: 0.88 !important;
      margin: 2px 0 10px 0 !important; /* Espaciado simétrico milimétrico */
      text-transform: lowercase !important;
      font-weight: 300 !important;
      text-align: center !important;
    }

    /* Contenedor del Sobre */
    .envelope-wrapper-overlay {
      position: relative !important;
      z-index: 3 !important;
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      margin: 0 !important;
    }

    .envelope-wrapper-overlay.ready {
      cursor: pointer !important;
      pointer-events: auto !important;
    }

    /* Ancho de sobre nivelado al original */
    .envelope-image-overlay {
      width: 82% !important;
      max-width: 390px !important;
      height: auto !important;
      display: block !important;
      filter: drop-shadow(0px -6px 22px rgba(0, 0, 0, 0.45)) !important;
      transform-origin: center center !important;
      will-change: transform, opacity !important;
    }

    @media (min-width: 601px) {
      .envelope-image-overlay {
        width: 80% !important;
        max-width: 440px !important;
      }
    }

    /* Animaciones del sobre */
    @keyframes heartbeatOverlay {
      0% { transform: translateY(0) scale(1); }
      15% { transform: translateY(-4px) scale(1.03); }
      30% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-4px) scale(1.03); }
      60% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes zoomCinematicOverlay {
      0% { transform: scale(1); opacity: 1; filter: drop-shadow(0px -6px 22px rgba(0, 0, 0, 0.45)); }
      50% { opacity: 0.8; }
      100% { transform: scale(20); opacity: 0; filter: drop-shadow(0px 0px 50px rgba(0, 0, 0, 0.9)) blur(8px); }
    }

    .envelope-wrapper-overlay.ready .envelope-image-overlay {
      animation: heartbeatOverlay 2.5s infinite ease-in-out !important;
    }

    .envelope-wrapper-overlay.zoom-envelope .envelope-image-overlay {
      animation: zoomCinematicOverlay 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    /* ========================================================================== */
    /* BOTÓN: POSICIONAMIENTO DINÁMICO POR PORCENTAJE                            */
    /* ========================================================================== */
    .btn-abrir-status-overlay {
      position: fixed !important;
      top: 50%;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      opacity: 0 !important;
      z-index: 10 !important;
      padding: 12px 28px !important;
      border-radius: 28px !important;
      background: #8C9070 !important;
      color: #ffffff !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      letter-spacing: 3px !important;
      text-transform: uppercase !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      display: inline-block !important;
      text-align: center !important;
      white-space: nowrap !important;
      will-change: top, opacity !important;
      cursor: default !important;
    }

    .btn-abrir-status-overlay.show-center {
      opacity: 1 !important;
      transition: opacity 0.6s ease !important;
    }

    .btn-abrir-status-overlay.animating {
      transition: top 1.3s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay,
    .btn-abrir-status-overlay.ready-btn {
      cursor: pointer !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay:hover,
    .btn-abrir-status-overlay.ready-btn:hover {
      background: #7A7E5F !important;
    }

    .envelope-wrapper-overlay.zoom-envelope .btn-abrir-status-overlay {
      opacity: 0 !important;
      transform: translate(-50%, 30px) !important;
      transition: opacity 0.5s ease, transform 0.5s ease !important;
    }

    /* Control de Música Flotante */
    #btn-musica-overlay {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 2147483647 !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background-color: #8C9070 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: white !important;
      display: none;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35) !important;
      transition: transform 0.2s ease, background-color 0.2s ease !important;
    }
  </style>

  <script>document.documentElement.classList.add('overlay-active');</script>
</head>
<body>

  <!-- ========================================================================== -->
  <!-- 2. ESTRUCTURA HTML DEL OVERLAY                                            -->
  <!-- ========================================================================== -->

  <!-- AUDIO -->
  <audio id="musica-boda-overlay" src="assets/musica.mp3" preload="auto" loop></audio>

  <!-- BOTÓN FLOTANTE MÚSICA -->
  <button id="btn-musica-overlay" aria-label="Silenciar música">
    <svg id="icon-sound-on-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    <svg id="icon-sound-off-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
  </button>

  <!-- PORTADA OVERLAY -->
  <div id="hero-screen-overlay">
    <div class="hero-overlay-bg"></div>

    <header class="header-content-overlay">
      <p class="sub-title-overlay">NOS CASAMOS</p>
      <h1 class="main-title-overlay title-daniela">DANIELA</h1>
      <span class="ampersand-overlay">&amp;</span>
      <h1 class="main-title-overlay">BRUNO</h1>
    </header>

    <div id="envelope-wrapper-overlay" class="envelope-wrapper-overlay">
      <img id="envelope-img-overlay" src="assets/sobre.png" alt="Sobre invitación" class="envelope-image-overlay">
    </div>

    <!-- Botón con posición fija administrado por JS -->
    <span id="btn-abrir-text-overlay" class="btn-abrir-status-overlay">Cargando...</span>
  </div>

  <!-- PEGA AQUÍ TODO EL CONTENIDO ORIGINAL QUE VIENE DE CANVA -->


  <!-- ========================================================================== -->
  <!-- 3. LÓGICA DE PRECARGA Y ANIMACIÓN                                          -->
  <!-- ========================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeWrapper = document.getElementById('envelope-wrapper-overlay');
      const envelopeImg = document.getElementById('envelope-img-overlay');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarImagen(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(url);
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      function obtenerPosicionSobre(porcentaje = 0.84) {
        const rect = envelopeImg.getBoundingClientRect();
        return `${rect.top + (rect.height * porcentaje)}px`;
      }

      Promise.all([
        precargarImagen('assets/fondo.png'),
        precargarImagen('assets/sobre.png'),
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]).then(() => {

        heroScreen.classList.add('loaded');
        btnAbrirText.classList.add('show-center');

        setTimeout(() => {
          btnAbrirText.classList.add('animating');
          void btnAbrirText.offsetHeight;
          
          btnAbrirText.style.setProperty('top', obtenerPosicionSobre(0.84), 'important');

          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeWrapper.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 650);

        }, 2000);
      });

      window.addEventListener('resize', () => {
        if (envelopeWrapper.classList.contains('ready')) {
          btnAbrirText.style.setProperty('top', obtenerPosicionSobre(0.84), 'important');
        }
      });

      function abrirInvitacion() {
        if (!envelopeWrapper.classList.contains('ready')) return;

        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        heroScreen.classList.add('opening');
        envelopeWrapper.classList.add('zoom-envelope');

        setTimeout(() => {
          heroScreen.classList.add('fade-out');
        }, 200);

        setTimeout(() => {
          heroScreen.remove();
          document.documentElement.classList.remove('overlay-active');
          window.scrollTo(0, 0);
        }, 1600);
      }

      envelopeWrapper.addEventListener('click', abrirInvitacion);
      btnAbrirText.addEventListener('click', abrirInvitacion);

      btnMusica.addEventListener('click', function() {
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
