<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melisa & Celso</title>
<meta property="og:title" content="Melisa &amp; Celso · Nos casamos" />
<meta property="og:description" content="Te invitamos a nuestra boda — 28 de Noviembre." />
<meta property="og:image" content="https://bodas.parteydetalles.com/melisaycelso/miniatura.jpg" />
<link rel="icon" href="favicon.ico" type="image/x-icon"/>

  <!-- ========================================================================== -->
  <!-- 1. ESTILOS AISLADOS DE LA PORTADA / OVERLAY                               -->
  <!-- ========================================================================== -->
  <style>
    /* Fuentes locales */
    @font-face {
      font-family: 'WeddingSansOverlay';
      src: url('assets/e7d7067aaf811fc432ef1d1d532ea8f5.woff') format('woff');
      font-weight: 900; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'WeddingCursiveOverlay';
      src: url('assets/97d2abd2f0e4a07aeb0a898987da3962.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    /* Bloqueo estricto del scroll de Canva hasta abrir el sobre */
    html.overlay-active, 
    html.overlay-active body {
      overflow: hidden !important;
      height: 100vh !important;
      position: fixed !important;
      width: 100vw !important;
    }

    /* Capa flotante principal con color de fondo sólido */
    #hero-screen-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2147483647 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      background-color: #f8f2e7 !important;
      transition: opacity 1.6s ease-in-out, filter 1.6s ease-in-out !important;
      font-family: 'WeddingSansOverlay', sans-serif !important;
      color: #3b3a36 !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 15px 20px 20px 20px !important;
      gap: 16px !important;
    }

    #hero-screen-overlay.fade-out {
      opacity: 0 !important;
      filter: blur(6px) !important;
      pointer-events: none !important;
    }

    /* Elementos ocultos durante la carga inicial */
    .header-top-overlay,
    .header-bottom-overlay,
    .envelope-image-overlay {
      opacity: 0 !important;
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out !important;
    }

    #hero-screen-overlay.loaded .header-top-overlay,
    #hero-screen-overlay.loaded .header-bottom-overlay,
    #hero-screen-overlay.loaded .envelope-image-overlay {
      opacity: 1 !important;
    }

    /* Texto Superior ("Nuestra boda") */
    .header-top-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      margin: 0 !important;
    }

    #hero-screen-overlay.opening .header-top-overlay,
    #hero-screen-overlay.opening .header-bottom-overlay {
      opacity: 0 !important;
      transform: translateY(-10px) !important;
    }

    .sub-title-overlay {
      font-family: 'WeddingCursiveOverlay', serif !important;
      font-size: 38px !important;
      font-weight: 400 !important;
      color: #2c3e50 !important;
      margin: 0 !important;
      text-transform: capitalize !important;
      letter-spacing: 0.02em !important;
    }

    @media (min-width: 601px) {
      .sub-title-overlay {
        font-size: 46px !important;
      }
    }

    /* Contenedor del Sobre */
    .envelope-wrapper-overlay {
      position: relative !important;
      z-index: 3 !important;
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      margin: 0 !important;
    }

    .envelope-wrapper-overlay.ready {
      cursor: pointer !important;
      pointer-events: auto !important;
    }

    /* Ancho del sobre */
    .envelope-image-overlay {
      width: 82% !important;
      max-width: 380px !important;
      height: auto !important;
      display: block !important;
      filter: drop-shadow(0px 8px 25px rgba(0, 0, 0, 0.12)) !important;
      transform-origin: center center !important;
      will-change: transform, opacity !important;
    }

    @media (min-width: 601px) {
      .envelope-image-overlay {
        width: 80% !important;
        max-width: 420px !important;
      }
    }

    /* Animaciones del sobre */
    @keyframes heartbeatOverlay {
      0% { transform: translateY(0) scale(1); }
      15% { transform: translateY(-4px) scale(1.03); }
      30% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-4px) scale(1.03); }
      60% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes zoomCinematicOverlay {
      0% { transform: scale(1); opacity: 1; filter: drop-shadow(0px 8px 25px rgba(0, 0, 0, 0.12)); }
      50% { opacity: 0.8; }
      100% { transform: scale(20); opacity: 0; filter: drop-shadow(0px 0px 50px rgba(0, 0, 0, 0.3)) blur(8px); }
    }

    .envelope-wrapper-overlay.ready .envelope-image-overlay {
      animation: heartbeatOverlay 2.5s infinite ease-in-out !important;
    }

    .envelope-wrapper-overlay.zoom-envelope .envelope-image-overlay {
      animation: zoomCinematicOverlay 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    /* Texto Inferior (Nombres y Pase) */
    .header-bottom-overlay {
      position: relative !important;
      z-index: 2 !important;
      text-align: center !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 6px !important;
      margin: 0 !important;
    }

    .main-title-overlay {
      font-family: 'WeddingCursiveOverlay', serif !important;
      font-size: 34px !important;
      line-height: 1.1 !important;
      font-weight: 400 !important;
      color: #2c3e50 !important;
      margin: 0 !important;
      text-transform: capitalize !important;
    }

    /* Corrección de tamaño para la 'y' enlazada */
    .main-title-overlay .conjunction-y {
      font-size: 0.72em !important;
      display: inline-block !important;
      vertical-align: baseline !important;
      text-transform: lowercase !important;
    }

    @media (min-width: 601px) {
      .main-title-overlay {
        font-size: 42px !important;
      }
    }

    /* Estilo alargado, espaciado y elegante para el texto del pase */
	.pass-info-overlay {
      font-family: 'WeddingSansOverlay', sans-serif !important;
      font-size: 11px !important;
      letter-spacing: 0.08em !important; /* Reducido para que las letras estén más juntas */
      color: #4a4945 !important;
      margin: 4px 0 0 0 !important;
      text-transform: uppercase !important;
      font-weight: bold !important;
      display: inline-block !important;
      transform: none !important; /* Eliminamos el estiramiento horizontal forzado */
    }

    /* ========================================================================== */
    /* BOTÓN: TRANSICIÓN PURA POR TRANSLATE Y TONO ARMÓNICO                       */
    /* ========================================================================== */
    .btn-abrir-status-overlay {
      position: fixed !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      opacity: 1 !important;
      z-index: 10 !important;
      padding: 12px 28px !important;
      border-radius: 28px !important;
      background: #B3A392 !important;
      color: #ffffff !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      letter-spacing: 2.5px !important;
      text-transform: uppercase !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.15) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      display: inline-block !important;
      text-align: center !important;
      white-space: nowrap !important;
      will-change: transform !important;
      cursor: default !important;
      transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease !important;
    }

    .btn-abrir-status-overlay.moved-down {
      transform: translate(-50%, calc(38vh - env(safe-area-inset-bottom))) !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay,
    .btn-abrir-status-overlay.ready-btn {
      cursor: pointer !important;
    }

    .envelope-wrapper-overlay.ready ~ .btn-abrir-status-overlay:hover,
    .btn-abrir-status-overlay.ready-btn:hover {
      background: #A09181 !important;
    }

    .envelope-wrapper-overlay.zoom-envelope .btn-abrir-status-overlay {
      opacity: 0 !important;
      transform: translate(-50%, calc(38vh - env(safe-area-inset-bottom))) scale(0.95) !important;
      transition: opacity 0.4s ease, transform 0.4s ease !important;
    }

    /* Control de Música Flotante */
    #btn-musica-overlay {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 2147483647 !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background-color: #B3A392 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: white !important;
      display: none;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15) !important;
      transition: transform 0.2s ease, background-color 0.2s ease !important;
    }

    #btn-musica-overlay:hover {
      background-color: #A09181 !important;
    }
  </style>

  <script>document.documentElement.classList.add('overlay-active');</script>
</head>
<body>

  <!-- ========================================================================== -->
  <!-- 2. ESTRUCTURA HTML DEL OVERLAY                                            -->
  <!-- ========================================================================== -->

  <!-- AUDIO -->
  <audio id="musica-boda-overlay" src="assets/musica.mp3" preload="auto" loop></audio>

  <!-- BOTÓN FLOTANTE MÚSICA -->
  <button id="btn-musica-overlay" aria-label="Silenciar música">
    <svg id="icon-sound-on-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    <svg id="icon-sound-off-overlay" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
  </button>

  <!-- PORTADA OVERLAY -->
  <div id="hero-screen-overlay">
    <!-- Texto Superior -->
    <header class="header-top-overlay">
      <h2 class="sub-title-overlay">Nuestra Boda</h2>
    </header>

    <!-- Sobre Central -->
    <div id="envelope-wrapper-overlay" class="envelope-wrapper-overlay">
      <img id="envelope-img-overlay" src="assets/sobre.png" alt="Sobre invitación" class="envelope-image-overlay">
    </div>

    <!-- Texto Inferior -->
    <div class="header-bottom-overlay">
      <h1 class="main-title-overlay">Melisa <span class="conjunction-y">y</span> Celso</h1>
      <!-- El texto del pase mantendrá el formato alargado tanto por defecto como al inyectar por URL -->
      <p id="pass-text-overlay" class="pass-info-overlay">HEMOS RESERVADO ( 1 ) PASE PARA USTED</p>
    </div>

    <!-- Botón visible de inmediato en el centro con "Cargando..." -->
    <span id="btn-abrir-text-overlay" class="btn-abrir-status-overlay">Cargando...</span>
  </div>

  <!-- PEGA AQUÍ TODO EL CONTENIDO ORIGINAL QUE VIENE DE CANVA -->


  <!-- ========================================================================== -->
  <!-- 3. LÓGICA DE PRECARGA Y ANIMACIÓN                                          -->
  <!-- ========================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Leer parámetro de la URL (Ejemplo: ?pase=2)
      const urlParams = new URLSearchParams(window.location.search);
      const numeroPase = urlParams.get('pase');
      
      if (numeroPase) {
        const passElement = document.getElementById('pass-text-overlay');
        passElement.innerText = `HEMOS RESERVADO ( ${numeroPase} ) PASES PARA USTED`;
      }

      const musica = document.getElementById('musica-boda-overlay');
      const btnMusica = document.getElementById('btn-musica-overlay');
      const iconOn = document.getElementById('icon-sound-on-overlay');
      const iconOff = document.getElementById('icon-sound-off-overlay');
      const envelopeWrapper = document.getElementById('envelope-wrapper-overlay');
      const btnAbrirText = document.getElementById('btn-abrir-text-overlay');
      const heroScreen = document.getElementById('hero-screen-overlay');

      function precargarAudio(audioElement) {
        return new Promise((resolve) => {
          if (audioElement.readyState >= 1) {
            resolve();
          } else {
            audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            setTimeout(resolve, 2500);
          }
        });
      }

      // Espera a que todo esté cargado
      Promise.all([
        precargarAudio(musica),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]).then(() => {

        // 1. Mostrar elementos suavemente cuando cargó
        heroScreen.classList.add('loaded');

        // 2. Iniciar la espera estética de 2 segundos antes de deslizar el botón
        setTimeout(() => {
          btnAbrirText.classList.add('moved-down');

          setTimeout(() => {
            btnAbrirText.innerText = "Abrir invitación";
            envelopeWrapper.classList.add('ready');
            btnAbrirText.classList.add('ready-btn');
          }, 800);

        }, 2000);
      });

	  function abrirInvitacion() {
        if (!envelopeWrapper.classList.contains('ready')) return;

        btnMusica.style.display = 'flex';
        musica.play().then(() => {
          actualizarIconos(false);
        }).catch((error) => {
          console.log("Autoplay prevenido:", error);
          actualizarIconos(true);
        });

        heroScreen.classList.add('opening');
        envelopeWrapper.classList.add('zoom-envelope');

        setTimeout(() => {
          heroScreen.classList.add('fade-out');
        }, 200);

        setTimeout(() => {
          heroScreen.remove();
          document.documentElement.classList.remove('overlay-active');
          window.scrollTo(0, 0);

          // <--- AQUÍ ACTIVAS LAS ANIMACIONES DE TEXTO AL ABRIR EL SOBRE --->
          if (typeof window.iniciarEfectosTexto === 'function') {
            window.iniciarEfectosTexto();
          }

        }, 1600);
      }

      envelopeWrapper.addEventListener('click', abrirInvitacion);
      btnAbrirText.addEventListener('click', abrirInvitacion);

      btnMusica.addEventListener('click', function() {
        if (musica.paused) { 
          musica.play(); 
          actualizarIconos(false); 
        } else { 
          musica.pause(); 
          actualizarIconos(true); 
        }
      });

      function actualizarIconos(estaPausado) {
        if (estaPausado) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
