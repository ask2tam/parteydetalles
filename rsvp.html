<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Asistencia - RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- CSS intl-tel-input -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">

    <style>
        :root {
            --primary-font: 'Montserrat', sans-serif;
            --title-font: 'Playfair Display', serif;
            --bg-color: #faf8f5;
            --card-container-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #666666;
            --border-color: #e5e0d8;
            --card-inner-bg: #f8f6f0;
            --card-green-line: #43644d;
            --btn-green-hover: #34503d;
            --tag-confirm-bg: #d1e8d5;
            --tag-confirm-txt: #2f5938;
            --tag-decline-bg: #f8d7da;
            --tag-decline-txt: #842029;
            --tag-pending-bg: #ede4d8;
            --tag-pending-txt: #6c5b4c;
            --tag-revision-bg: #e0f2fe;
            --tag-revision-txt: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            font-family: var(--primary-font);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .rsvp-section {
            width: 100%;
            max-width: 520px;
            background: var(--card-container-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }

        .rsvp-title { font-family: var(--title-font); font-size: 2.2rem; margin-bottom: 5px; font-weight: 400; }
        .rsvp-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; font-weight: 300; }
        .hint { font-size: 0.75rem; color: #888; margin-bottom: 8px; font-style: italic; display: block; }

        .guest-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: var(--primary-font);
            text-align: center;
            text-transform: uppercase;
            outline: none;
            background-color: #faf9f6;
        }

        .guest-input:focus { border-color: var(--card-green-line); background-color: #fff; }
        .status-msg { font-size: 0.85rem; margin-top: 10px; min-height: 20px; color: var(--text-muted); }

        .result-card {
            display: none;
            margin-top: 20px;
            background-color: var(--card-inner-bg);
            border-left: 5px solid var(--card-green-line);
            border-radius: 8px;
            padding: 24px 22px;
            text-align: left;
            animation: fadeIn 0.2s ease-out;
        }

        .registration-card { border-left-color: #0284c7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .data-row { display: flex; align-items: center; margin-bottom: 14px; font-size: 0.95rem; }
        .data-label { width: 135px; flex-shrink: 0; color: #4a584d; font-weight: 400; }
        .data-value { color: #222222; font-weight: 400; }

        .acomp-wrapper { display: flex; align-items: center; gap: 8px; flex-grow: 1; }
        .btn-edit-icon { background: none; border: none; cursor: pointer; font-size: 0.85rem; color: var(--card-green-line); padding: 2px 6px; }
        .inline-edit-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.88rem; outline: none; }

        .select-pases { padding: 5px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.88rem; background-color: #fff; outline: none; }
        
        .btn-comment-toggle {
            background: #ffffff;
            border: 1px dashed var(--card-green-line);
            color: var(--card-green-line);
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .comment-container { display: none; margin-top: 10px; flex-direction: column; gap: 8px; }
        .comment-textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; outline: none; resize: vertical; }

        .btn-save-comment {
            align-self: flex-end;
            background-color: var(--card-green-line);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 0.78rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-save-comment:hover { background-color: var(--btn-green-hover); }

        /* Estilos intl-tel-input */
        .iti { width: 100%; margin-bottom: 12px; }
        .iti__country-list { text-align: left; font-size: 0.85rem; }

        .couple-reply-box {
            margin-top: 12px;
            padding: 12px;
            background-color: #f0f4f1;
            border-radius: 6px;
            border-left: 3px solid var(--card-green-line);
            font-size: 0.85rem;
        }

        .tag { display: inline-block; padding: 4px 14px; font-size: 0.78rem; font-weight: 500; border-radius: 20px; text-transform: uppercase; }
        .tag.confirmado { background-color: var(--tag-confirm-bg); color: var(--tag-confirm-txt); }
        .tag.declinado { background-color: var(--tag-decline-bg); color: var(--tag-decline-txt); }
        .tag.pendiente { background-color: var(--tag-pending-bg); color: var(--tag-pending-txt); }
        .tag.revision { background-color: var(--tag-revision-bg); color: var(--tag-revision-txt); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 13px; font-size: 0.82rem; font-weight: 600; text-transform: uppercase; border-radius: 6px; cursor: pointer; border: none; transition: background-color 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-yes { background-color: var(--card-green-line); color: #fff; }
        .btn-yes:hover { background-color: var(--btn-green-hover); }
        .btn-no { background-color: transparent; color: #666; border: 1px solid #ccc; }
        .btn-no:hover { background-color: #f0f0f0; }

        .notification-box {
            margin-top: 18px;
            padding: 12px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .info-revision-box {
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
            color: #0369a1;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <section class="rsvp-section">
        <h2 class="rsvp-title">Confirma tu Asistencia</h2>
        <p class="rsvp-subtitle">Busca tu nombre y confirma</p>

        <div class="search-container">
            <span class="hint">Escribe en mayúsculas, sin acentos.</span>
            <input type="text" id="guestInput" class="guest-input" placeholder="INGRESA TU NOMBRE" autocomplete="off">
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <!-- TARJETA INVITADO EXISTENTE -->
        <div id="resultCard" class="result-card">
            <div class="data-row">
                <span class="data-label">Nombre:</span>
                <span id="txtNombre" class="data-value"></span>
            </div>

            <div class="data-row">
                <span class="data-label">Acompañante:</span>
                <div class="acomp-wrapper">
                    <span id="txtAcompanantes" class="data-value"></span>
                    <input type="text" id="inputAcompanantes" class="inline-edit-input" style="display: none;" placeholder="Nombre de acompañante">
                    <button type="button" id="btnToggleAcomp" class="btn-edit-icon">✏️</button>
                </div>
            </div>

            <div class="data-row">
                <span class="data-label">Pases a usar:</span>
                <select id="selectPases" class="select-pases"></select>
            </div>

            <div class="data-row">
                <span class="data-label">Estado:</span>
                <div><span id="txtEstado" class="tag"></span></div>
            </div>

            <button type="button" id="btnToggleComment" class="btn-comment-toggle">
                <span id="commentToggleText">Agregar mensaje para los novios</span>
                <span id="commentArrow">▼</span>
            </button>

            <div id="commentContainer" class="comment-container">
                <textarea id="txtComentario" class="comment-textarea" placeholder="Ej: Solicito 1 pase adicional, No usaré todos mis pases, Voy a la ceremonia pero no a la fiesta"></textarea>
                <button type="button" id="btnSaveComment" class="btn-save-comment">✓ Guardar mensaje</button>
            </div>

            <div id="coupleReplyContainer" class="couple-reply-box" style="display: none;">
                <div style="font-weight: 600; color: var(--card-green-line); margin-bottom: 4px;">💌 Respuesta de los novios:</div>
                <p id="txtRespuestaNovios"></p>
            </div>

            <div class="btn-group">
                <button id="btnYes" class="btn btn-yes">✓ Sí, asistiré</button>
                <button id="btnNo" class="btn btn-no">✕ No podré asistir</button>
            </div>

            <div id="notificationBox" class="notification-box">
                <div id="notifStatus" style="font-weight: 600; font-size: 0.88rem;"></div>
                <div id="notifDate" style="font-size: 0.78rem; color: #777;"></div>
            </div>
        </div>

        <!-- TARJETA REGISTRO / EN REVISIÓN -->
        <div id="registrationCard" class="result-card registration-card">
            <h3 style="font-family: var(--title-font); font-size: 1.3rem; color: #0284c7; margin-bottom: 8px;" id="regTitle">¿No estás en la lista?</h3>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 18px;" id="regSubtitle">Ingresa tus datos para solicitar tu pase a los novios.</p>

            <div id="infoRevisionBox" class="info-revision-box" style="display: none;"></div>

            <div style="margin-bottom: 12px; text-align: left;">
                <label style="font-size: 0.8rem; color: #555; display: block; margin-bottom: 4px;">Nombre Completo:</label>
                <input type="text" id="regNombre" class="inline-edit-input">
            </div>

            <div style="margin-bottom: 12px; text-align: left;">
                <label style="font-size: 0.8rem; color: #555; display: block; margin-bottom: 4px;">WhatsApp de Contacto:</label>
                <input type="tel" id="regWhatsapp" class="inline-edit-input">
            </div>

            <div style="margin-bottom: 12px; text-align: left;">
                <label style="font-size: 0.8rem; color: #555; display: block; margin-bottom: 4px;">Mensaje para los novios:</label>
                <textarea id="regComentario" class="comment-textarea" placeholder="Favor incluirme en la lista con 1 pase" disabled></textarea>
            </div>

            <button id="btnSubmitRequest" class="btn btn-yes" style="background-color: #0284c7; width: 100%;" disabled>Enviar Solicitud</button>
            <div id="regStatusMsg" style="font-size: 0.85rem; margin-top: 10px; text-align: center;"></div>
        </div>
    </section>

    <!-- JS intl-tel-input -->
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://axblncwwexkebqaoebio.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4YmxuY3d3ZXhrZWJxYW9lYmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjMxNTAsImV4cCI6MjEwMTA5OTE1MH0.bZXAsCyVP8W-JptrzxyjNlZGDW_56qnsghbB76lw2TA';
        
        const urlParams = new URLSearchParams(window.location.search);
        const BODA_TOKEN = urlParams.get('token') || 'BODA_DEFAULT';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const phoneInputElem = document.getElementById('regWhatsapp');
        const iti = window.intlTelInput(phoneInputElem, {
            initialCountry: "pe",
            separateDialCode: true,
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js"
        });

        const guestInput = document.getElementById('guestInput');
        const statusMsg = document.getElementById('statusMsg');
        const resultCard = document.getElementById('resultCard');
        const registrationCard = document.getElementById('registrationCard');
        
        const txtNombre = document.getElementById('txtNombre');
        const txtEstado = document.getElementById('txtEstado');
        const txtAcompanantes = document.getElementById('txtAcompanantes');
        const inputAcompanantes = document.getElementById('inputAcompanantes');
        const btnToggleAcomp = document.getElementById('btnToggleAcomp');
        const selectPases = document.getElementById('selectPases');
        const txtComentario = document.getElementById('txtComentario');
        const btnSaveComment = document.getElementById('btnSaveComment');
        const coupleReplyContainer = document.getElementById('coupleReplyContainer');
        const txtRespuestaNovios = document.getElementById('txtRespuestaNovios');
        const notificationBox = document.getElementById('notificationBox');
        const notifStatus = document.getElementById('notifStatus');
        const notifDate = document.getElementById('notifDate');

        const regTitle = document.getElementById('regTitle');
        const regSubtitle = document.getElementById('regSubtitle');
        const infoRevisionBox = document.getElementById('infoRevisionBox');
        const regNombre = document.getElementById('regNombre');
        const regComentario = document.getElementById('regComentario');
        const btnSubmitRequest = document.getElementById('btnSubmitRequest');
        const regStatusMsg = document.getElementById('regStatusMsg');

        let activeGuest = null;
        let isEditingAcomp = false;
        let debounceTimer = null;
        let originalGuestComment = "";

        function normalizar(texto) {
            return texto ? texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";
        }

        function resetCardState() {
            notificationBox.style.opacity = '0';
            notifStatus.textContent = '';
            notifDate.textContent = '';
            txtEstado.textContent = '';
            txtEstado.className = 'tag';
            txtRespuestaNovios.textContent = '';
            coupleReplyContainer.style.display = 'none';
            isEditingAcomp = false;
            inputAcompanantes.style.display = 'none';
            txtAcompanantes.style.display = 'inline';
            btnToggleAcomp.textContent = '✏️';
        }

        function validarFormularioSolicitud() {
            const esTelValido = iti.isValidNumber();
            
            if (esTelValido) {
                if (regComentario.disabled) {
                    regComentario.disabled = false;
                    if (!regComentario.value.trim()) {
                        regComentario.value = "Favor incluirme en la lista con 1 pase";
                    }
                }
            } else {
                regComentario.disabled = true;
            }

            const tieneComentario = regComentario.value.trim() !== "";
            const esFormValido = esTelValido && tieneComentario && regNombre.value.trim() !== "";

            btnSubmitRequest.disabled = !esFormValido;
        }

        phoneInputElem.addEventListener('input', validarFormularioSolicitud);
        phoneInputElem.addEventListener('countrychange', validarFormularioSolicitud);
        regComentario.addEventListener('input', validarFormularioSolicitud);
        regNombre.addEventListener('input', validarFormularioSolicitud);

        async function buscarInvitado() {
            const queryStr = normalizar(guestInput.value);
            
            resetCardState();

            if (queryStr.length < 3) {
                resultCard.style.display = 'none';
                registrationCard.style.display = 'none';
                statusMsg.textContent = "";
                return;
            }

            statusMsg.textContent = "Buscando...";

            try {
                const { data, error } = await supabase
                    .from('invitados')
                    .select('*')
                    .eq('nombre_busqueda', queryStr)
                    .eq('boda_token', BODA_TOKEN)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    statusMsg.textContent = "";
                    activeGuest = data;

                    if (normalizar(data.estado) === "EN REVISION" || normalizar(data.estado) === "EN REVISIÓN") {
                        mostrarFormularioRevision(data);
                    } else {
                        registrationCard.style.display = 'none';
                        mostrarDatos(activeGuest);
                    }
                } else {
                    statusMsg.textContent = "";
                    resultCard.style.display = 'none';
                    prepararNuevoRegistro(guestInput.value.toUpperCase());
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Error al consultar la base de datos.";
            }
        }

        function prepararNuevoRegistro(nombre) {
            regTitle.textContent = "¿No estás en la lista?";
            regSubtitle.textContent = "Ingresa tus datos para solicitar tu pase a los novios.";
            infoRevisionBox.style.display = 'none';
            regNombre.value = nombre;
            
            phoneInputElem.value = "";
            if (iti) {
                iti.setNumber("");
            }

            regComentario.value = "";
            regComentario.disabled = true;
            btnSubmitRequest.textContent = "Enviar Solicitud";
            btnSubmitRequest.disabled = true;
            regStatusMsg.textContent = "";
            registrationCard.style.display = 'block';

            validarFormularioSolicitud();
        }

        function mostrarFormularioRevision(inv) {
            resultCard.style.display = 'none';
            regTitle.textContent = "Solicitud en Revisión";
            regSubtitle.textContent = "Puedes modificar tu teléfono o mensaje antes de la aprobación.";
            
            const fechaHora = inv.fecha_solicitud ? new Date(inv.fecha_solicitud).toLocaleString() : new Date().toLocaleString();
            infoRevisionBox.innerHTML = `📌 <b>Solicitud enviada el ${fechaHora}.</b><br>Los novios la revisarán pronto para incluirte en la lista de confirmación.`;
            infoRevisionBox.style.display = 'block';

            regNombre.value = inv.nombre;
            if (inv.whatsapp) {
                iti.setNumber(inv.whatsapp);
            } else {
                phoneInputElem.value = "";
                iti.setNumber("");
            }
            regComentario.value = inv.comentario || "Favor incluirme en la lista con 1 pase";
            
            btnSubmitRequest.textContent = "Actualizar Solicitud";
            registrationCard.style.display = 'block';
            validarFormularioSolicitud();
        }

        guestInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(buscarInvitado, 300);
        });

        btnSubmitRequest.addEventListener('click', async () => {
            const nom = regNombre.value.trim();
            const wa = iti.getNumber();
            const com = regComentario.value.trim();
            const nomKey = normalizar(nom);
            const ahoraIso = new Date().toISOString();

            btnSubmitRequest.disabled = true;
            btnSubmitRequest.textContent = "Enviando...";

            try {
                const payload = {
                    boda_token: BODA_TOKEN,
                    nombre: nom.toUpperCase(),
                    nombre_busqueda: nomKey,
                    pases: 1,
                    pases_seleccionados: 1,
                    estado: 'En revisión',
                    whatsapp: wa,
                    comentario: com,
                    fecha_solicitud: ahoraIso
                };

                const { error } = await supabase
                    .from('invitados')
                    .upsert(payload, { onConflict: 'boda_token, nombre_busqueda' });

                if (error) throw error;

                btnSubmitRequest.textContent = "Enviado ✓";
                regStatusMsg.style.color = "#2f5938";
                regStatusMsg.textContent = "¡Solicitud registrada correctamente!";
                
                setTimeout(() => buscarInvitado(), 1000);

            } catch (err) {
                console.error(err);
                regStatusMsg.style.color = "#842029";
                regStatusMsg.textContent = "Error al enviar la solicitud.";
                btnSubmitRequest.disabled = false;
                btnSubmitRequest.textContent = "Enviar Solicitud";
            }
        });

        async function guardarEnSupabase(nuevoEstado = null) {
            if (!activeGuest) return;

            const estadoFinal = nuevoEstado || activeGuest.estado || "Pendiente";
            
            let acompFinal = "";
            const totalPases = activeGuest.pases || 1;
            
            if (totalPases > 1) {
                acompFinal = isEditingAcomp ? inputAcompanantes.value.trim() : (txtAcompanantes.textContent === "Favor definir" ? "" : txtAcompanantes.textContent);
            }

            const pasesFinales = parseInt(selectPases.value) || activeGuest.pases || 1;
            const comFinal = txtComentario.value.trim();
            const ahoraIso = new Date().toISOString();

            const updateData = {
                estado: estadoFinal,
                acompanantes: acompFinal,
                pases_seleccionados: pasesFinales,
                comentario: comFinal,
                fecha_confirmacion: ahoraIso
            };

            if (comFinal !== originalGuestComment) {
                updateData.respuesta_novios = null;
                coupleReplyContainer.style.display = 'none';
                originalGuestComment = comFinal;
            }

            activeGuest.estado = estadoFinal;
            activeGuest.acompanantes = acompFinal;
            activeGuest.pases_seleccionados = pasesFinales;

            try {
                await supabase.from('invitados').update(updateData).eq('id', activeGuest.id);
            } catch (err) { console.error(err); }
        }

        selectPases.addEventListener('change', () => guardarEnSupabase());
        btnSaveComment.addEventListener('click', async () => {
            await guardarEnSupabase();
            btnSaveComment.textContent = "✓ Guardado";
            setTimeout(() => { btnSaveComment.textContent = "✓ Guardar mensaje"; }, 2000);
        });

        btnToggleAcomp.addEventListener('click', () => {
            isEditingAcomp = !isEditingAcomp;
            if (isEditingAcomp) {
                txtAcompanantes.style.display = 'none';
                inputAcompanantes.style.display = 'block';
                inputAcompanantes.focus();
                btnToggleAcomp.textContent = '✔️';
            } else {
                let val = inputAcompanantes.value.trim();
                const totalPases = activeGuest ? (activeGuest.pases || 1) : 1;
                
                if (val !== "") {
                    txtAcompanantes.textContent = val;
                } else {
                    txtAcompanantes.textContent = totalPases === 1 ? "No aplica" : "Favor definir";
                }

                inputAcompanantes.style.display = 'none';
                txtAcompanantes.style.display = 'inline';
                btnToggleAcomp.textContent = '✏️';
                guardarEnSupabase();
            }
        });

        document.getElementById('btnToggleComment').addEventListener('click', () => {
            const container = document.getElementById('commentContainer');
            const isHidden = container.style.display === 'none' || container.style.display === '';
            container.style.display = isHidden ? 'flex' : 'none';
        });

        function mostrarDatos(inv) {
            txtNombre.textContent = inv.nombre;

            const totalPases = inv.pases || 1;
            
            // Lógica de acompañante según la cantidad de pases
            if (totalPases === 1) {
                btnToggleAcomp.style.display = 'none';
                txtAcompanantes.textContent = (inv.acompanantes && inv.acompanantes.trim() !== "") ? inv.acompanantes : "No aplica";
            } else {
                btnToggleAcomp.style.display = 'inline-block';
                txtAcompanantes.textContent = (inv.acompanantes && inv.acompanantes.trim() !== "") ? inv.acompanantes : "Favor definir";
            }

            inputAcompanantes.value = inv.acompanantes || "";

            selectPases.innerHTML = "";
            for (let i = 1; i <= totalPases; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i} ${i === 1 ? 'pase' : 'pases'}`;
                selectPases.appendChild(opt);
            }
            
            selectPases.value = (inv.pases_seleccionados !== undefined && inv.pases_seleccionados !== null) ? inv.pases_seleccionados : totalPases;
            
            originalGuestComment = inv.comentario || "";
            txtComentario.value = originalGuestComment;

            if (inv.respuesta_novios && inv.respuesta_novios.trim() !== "") {
                txtRespuestaNovios.textContent = inv.respuesta_novios;
                coupleReplyContainer.style.display = 'block';
            } else {
                coupleReplyContainer.style.display = 'none';
            }

            actualizarEstadoVisual(inv.estado || "Pendiente");

            // Si ya hay confirmación previa registrada, mostrar fecha y hora
            if (inv.fecha_confirmacion && normalizar(inv.estado) !== "PENDIENTE") {
                const dt = new Date(inv.fecha_confirmacion);
                notifStatus.textContent = `Estado: ${inv.estado.toUpperCase()}`;
                notifDate.textContent = `Registrado: ${dt.toLocaleDateString('es-ES')} ${dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                notificationBox.style.opacity = '1';
            }

            resultCard.style.display = 'block';
        }

        function actualizarEstadoVisual(estado) {
            txtEstado.textContent = estado;
            txtEstado.className = 'tag';
            const est = normalizar(estado);
            
            if (est === "ASISTIRA" || est === "CONFIRMADO") {
                txtEstado.classList.add('confirmado');
            } else if (est.includes("NO")) {
                txtEstado.classList.add('declinado');
            } else if (est.includes("REVISION")) {
                txtEstado.classList.add('revision');
            } else {
                txtEstado.classList.add('pendiente');
            }
        }

        function responder(estado) {
            actualizarEstadoVisual(estado);
            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            notifStatus.textContent = `Estado: ${estado.toUpperCase()}`;
            notifDate.textContent = `Registrado: ${fechaStr} ${horaStr}`;
            notificationBox.style.opacity = '1';
            guardarEnSupabase(estado);
        }

        document.getElementById('btnYes').addEventListener('click', () => responder("Confirmado"));
        document.getElementById('btnNo').addEventListener('click', () => responder("No asistirá"));
    </script>
</body>
</html>
