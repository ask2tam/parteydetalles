<style id="fuentes-canva"></style><!-- aquí se copian los @font-face de Canva (Chrome ignora @font-face dentro de un Shadow DOM) -->
<style>
  /* Paleta del diseño: azul tinta (textos), crema (fondo), bronce (sello) y azul acero (tarjeta de confirmación).
     NOTA: este documento NO usa @media (prefers-reduced-motion): las animaciones corren siempre. */
  :root { --azul:#243B55; --crema:#F8F7EF; --bronce:#99683F; --acero:#718A96; }
  * { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }   /* solo alcanza el documento principal (botones, modal, loader) */
  html, body { margin:0; padding:0; background:var(--crema); }
  html { scrollbar-gutter: stable; }
  html.bloqueado, html.bloqueado body { overflow:hidden !important; }
  html.bloqueado body { touch-action:none; }

  /* ---------- Hosts de los diseños (cada uno con su Shadow DOM) ---------- */
  #invitacion-host { position:relative; visibility:hidden; }          /* maquetada desde el inicio, pero no se pinta hasta abrir el sello */
  #invitacion-host.visible { visibility:visible; }
  /* Entrada suave de la invitación: sube unos píxeles mientras se aclara (a la vez que la portada se desvanece) */
  #invitacion-host.entrando { animation:entrada-suave 2.4s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes entrada-suave { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:translateY(0); } }
  #portada-host { position:fixed; inset:0; z-index:100; background:var(--crema);
                  transition:opacity 1.6s ease, filter 1.6s ease; }
  #portada-host.fuera { opacity:0; filter:blur(4px); pointer-events:none; }

  /* ---------- Modal del RSVP (el mismo componente de rsvp.html, montado aquí) ---------- */
  /* Cerrado: invisible Y sin captar toques. OJO: el RSVP vive en un Shadow DOM con «all:initial» (visibility:visible), así que
     visibility:hidden del modal no lo oculta del todo; por eso se usa también clip-path (después del fundido) y el atributo inert. */
  #rsvp-modal { position:fixed; inset:0; z-index:200; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
                background-color:var(--crema); opacity:0; visibility:hidden; clip-path:inset(0 0 100% 0);
                transition:opacity .5s ease, background-color .4s ease, visibility 0s linear .5s, clip-path 0s linear .5s; }
  #rsvp-modal.abierto { opacity:1; visibility:visible; clip-path:none; transition:opacity .5s ease, background-color .4s ease, visibility 0s, clip-path 0s; }
  /* Fondo de página «transparente» o translúcido (Panel › Configuración › Fondos › Página): se quita el crema sólido del modal y se ve la
     invitación detrás; el color/imagen y su opacidad los pinta #rsvp-pagina (rsvp.js). Mientras no llega la configuración, el modal conserva el crema. */
  #rsvp-modal.ver-detras { background-color:transparent; }
  /* Fondo de TODA la página del RSVP (lo pinta rsvp.js con la configuración del panel: color o imagen, opacidad, zoom y posición) */
  #rsvp-pagina { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .rsvp-contenedor { position:relative; z-index:1; width:100%; max-width:460px; margin:0 auto;
                     padding:max(64px, calc(env(safe-area-inset-top) + 56px)) 0 max(56px, calc(env(safe-area-inset-bottom) + 40px));
                     transform:translateY(26px); transition:transform .7s cubic-bezier(.16,1,.3,1); }
  #rsvp-modal.abierto .rsvp-contenedor { transform:translateY(0); }
  #rsvp { width:100%; --rsvp-relleno:0 16px 8px; }
  .rsvp-cab { width:100%; display:flex; justify-content:flex-start; padding:0 16px 10px; }
  .rsvp-cab[hidden] { display:none; }
  .rsvp-idiomas { display:flex; border:1px solid color-mix(in srgb, var(--rsvp-acento, var(--bronce)) 50%, transparent); border-radius:999px; overflow:hidden; }
  .rsvp-idiomas button { border:0; background:transparent; color:var(--rsvp-acento, var(--bronce)); font:600 11px/1 system-ui, sans-serif; letter-spacing:.08em; padding:7px 10px; cursor:pointer; }
  .rsvp-idiomas button[aria-pressed="true"] { background:var(--rsvp-acento, var(--bronce)); color:#fff; }
  #rsvp-carga { position:fixed; inset:0; z-index:2; display:grid; place-items:center; pointer-events:none; opacity:0; transition:opacity .4s ease; }
  #rsvp-modal.abierto:not(.listo):not(.con-error) #rsvp-carga { opacity:1; }
  #rsvp-carga i { width:26px; height:26px; border-radius:50%; border:2px solid rgba(153,104,63,.28); border-top-color:var(--bronce); animation:rsvp-gira .9s linear infinite; }
  @keyframes rsvp-gira { to { transform:rotate(360deg); } }
  #rsvp-error { margin:30px 22px; text-align:center; color:var(--azul); font:500 14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif; }
  #rsvp-error[hidden] { display:none; }
  #rsvp-error button { margin-top:12px; border:1px solid var(--bronce); background:#fff; color:var(--bronce); border-radius:999px; padding:10px 20px; font:600 12px/1 system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  #rsvp-cerrar { position:fixed; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:210; width:44px; height:44px; padding:0;
                 border-radius:50%; border:1px solid rgba(248,247,239,.6); background:var(--azul); color:var(--crema);
                 display:grid; place-items:center; cursor:pointer; box-shadow:0 4px 14px rgba(20,32,48,.35);
                 opacity:0; pointer-events:none; transition:opacity .35s ease, transform .2s ease; }
  #rsvp-modal.abierto #rsvp-cerrar { opacity:1; pointer-events:auto; transition-delay:.15s; }
  #rsvp-cerrar:hover { transform:scale(1.06); }
  #rsvp-cerrar:focus-visible, #musica-btn:focus-visible, #rsvp-error button:focus-visible { outline:2px solid var(--bronce); outline-offset:3px; }

  /* ---------- Botón de música (paleta del diseño: azul + crema) ---------- */
  #musica-btn { position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:300; width:44px; height:44px; padding:0;
                border-radius:50%; border:1px solid rgba(248,247,239,.6); background:var(--azul); color:var(--crema);
                display:none; place-items:center; cursor:pointer; box-shadow:0 4px 14px rgba(20,32,48,.35);
                opacity:0; transform:scale(.8); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), background .2s ease;
                -webkit-tap-highlight-color:transparent; }
  #musica-btn.mostrar { display:grid; }
  #musica-btn.activo { opacity:1; transform:none; }
  #musica-btn:hover { background:#1a2c42; }
  #musica-btn svg { display:block; }

  /* ---------- Pantalla de carga ---------- */
  #cargador { position:fixed; inset:0; z-index:1000; background:var(--crema); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
              transition:opacity .9s ease, visibility 0s linear .9s; }
  #cargador.fuera { opacity:0; visibility:hidden; pointer-events:none; }
  .anillo { position:relative; width:104px; height:104px; }
  .anillo svg { width:100%; height:100%; display:block; transform:rotate(-90deg); }
  .anillo circle { fill:none; stroke-width:3; }
  .anillo .riel { stroke:rgba(36,59,85,.13); }
  .anillo .avance { stroke:var(--bronce); stroke-linecap:round; }
  .anillo .pct { position:absolute; inset:0; display:grid; place-items:center; color:var(--azul); font:500 18px/1 system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:.04em; }
  .cargador-txt { color:rgba(36,59,85,.6); font:400 11px/1 system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:.3em; text-transform:uppercase; text-align:center; padding:0 24px; }
</style>

  /* ------------- 2) «Confirma aquí» → modal del RSVP (conserva el scroll) ------------- */

    cab.querySelectorAll('[data-l]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === e.detail)); });
  });
  cab.addEventListener('click', function (e) { var b = e.target.closest('[data-l]'); if (b && window.RSVP_IDIOMA) RSVP_IDIOMA.cambiar(b.dataset.l); });

  function abrirRsvp() {
    if (rsvpAbierto) return; rsvpAbierto = true;
    if (rsvpEstado === 'pendiente' || rsvpEstado === 'error') cargarRsvp();   // si aún no se había cargado (conexión lenta) se pide ahora
    scrollGuardado = window.pageYOffset || document.documentElement.scrollTop || 0;
    document.documentElement.classList.add('bloqueado');
    modal.scrollTop = 0;
    modal.inert = false;
    modal.classList.add('abierto');
    try { history.pushState({ rsvp: 1 }, ''); } catch (e) {}
    btnCerrar.focus({ preventScroll: true });
  }
  function cerrarRsvpReal() {
    if (!rsvpAbierto) return; rsvpAbierto = false;
    modal.classList.remove('abierto');
    modal.inert = true;
    document.documentElement.classList.remove('bloqueado');
    window.scrollTo(0, scrollGuardado);                             // vuelve exactamente a donde estaba
    requestAnimationFrame(function () { window.scrollTo(0, scrollGuardado); });
  }
  function cerrarRsvp() {
    if (history.state && history.state.rsvp) history.back();        // popstate hace el cierre real
    else cerrarRsvpReal();
  }
  window.addEventListener('popstate', function () { if (rsvpAbierto) cerrarRsvpReal(); });
  btnCerrar.addEventListener('click', cerrarRsvp);
  modal.addEventListener('click', function (e) { if (e.target === modal) cerrarRsvp(); });   // clic fuera del formulario
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && rsvpAbierto) cerrarRsvp(); });

  /* ----------------- Eventos dentro de los Shadow DOM ----------------- */
  function enlazarEventos() {
    // Portada: clic en el sello (o en su enlace superpuesto) → abrir. Se bloquea cualquier ancla interna (#page-0).
    var enlaceSello = raices.portada.querySelector('a[aria-labelledby="' + ID_SELLO + '"]');
    if (enlaceSello) enlaceSello.setAttribute('aria-label', 'Abrir invitación');
    raices.portada.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a');
      if (a && (a.getAttribute('href') || '').charAt(0) === '#') e.preventDefault();
      var sello = e.target.closest && e.target.closest('#' + ID_SELLO + ', a[aria-labelledby="' + ID_SELLO + '"]');
      if (sello) abrirInvitacion();
    });
    // Invitación: «Confirma aquí» (cápsula o texto; el texto trae un enlace a WhatsApp que se reemplaza) abre el RSVP; los demás enlaces (mapas) funcionan normal
    raices.invitacion.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest && t.closest(SEL_CONFIRMA)) { e.preventDefault(); abrirRsvp(); return; }
      var a = t.closest && t.closest('a');
      if (a && (a.getAttribute('href') || '').charAt(0) === '#') e.preventDefault();
    });
  }
})();
</script>
